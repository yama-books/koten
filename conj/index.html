<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>古典活用ドリル 実機確認プレビュー</title>
  <style>

<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">実機確認用プレビュー · 未告知URL</p>
        <h1>古典活用ドリル</h1>
      </div>
    </header>

    <section class="panel controls" aria-label="出題設定">
      <div class="control-group">
        <span class="label">品詞</span>
        <div class="segmented" id="posButtons" role="group" aria-label="品詞">
          <button data-pos="verb" class="active" type="button" aria-pressed="true">動詞</button>
          <button data-pos="adjective" type="button" aria-pressed="false">形容詞</button>
          <button data-pos="adjectivalVerb" type="button" aria-pressed="false">形容動詞</button>
          <button data-pos="auxiliary" type="button" aria-pressed="false">助動詞</button>
        </div>
      </div>
    </section>

    <section class="panel table-mode">
      <div class="question-meta">
        <h2>活用表ドリル</h2>
        <span id="masterBadge" class="badge">学校文法master</span>
      </div>
      <p class="prompt">□になっている活用形を答えてください。存在しない活用形は「○」。複数形があるセルは「／」で区切って入力します。</p>
      <p id="tableQuestionLabel" class="table-question-label"></p>
      <div id="masterGrid" class="master-grid" aria-live="polite"></div>
      <div class="table-answer-panel">
        <label for="tableAnswerInput">答え</label>
        <input id="tableAnswerInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" />
        <button id="tableCheckBtn" class="primary-btn" type="button">答え合わせ</button>
        <button id="tableNextBtn" class="ghost-btn" type="button">次の活用表</button>
      </div>
      <div id="tableResult" class="result" aria-live="polite" hidden></div>
      <div class="actions">
        <button id="resetBtn" class="ghost-btn" type="button">学習記録をリセット</button>
      </div>
      <p class="muted">形容詞はク活用・シク活用、形容動詞はナリ活用・タリ活用をPC幅では左右に表示します。学習履歴はこの端末内だけに保存します。</p>
    </section>

    <footer>
      <p>実機確認用プレビューです。活用表ドリルのみを収録し、コーパス由来の用例本文・検索結果・permalinkは含みません。</p>
    </footer>
  </main>

ayOrder":74,"rows":[{"id":"main","label":"本活用","series":"本活用","cells":{"mizen":{"status":"exists","values":["ごとく"]},"renyo":{"status":"exists","values":["ごとく"]},"shushi":{"status":"exists","values":["ごとし"]},"rentai":{"status":"exists","values":["ごとき"]},"izen":{"status":"none","values":[]},"meirei":{"status":"none","values":[]}}}]},{"id":"aux-younari","partOfSpeech":"auxiliary","label":"やうなり","conjugationType":"形容動詞型","displayGroup":"auxiliary","displayOrder":75,"rows":[{"id":"main","label":"本活用","series":"本活用","cells":{"mizen":{"status":"exists","values":["やうなら"]},"renyo":{"status":"exists","values":["やうなり","やうに"]},"shushi":{"status":"exists","values":["やうなり"]},"rentai":{"status":"exists","values":["やうなる"]},"izen":{"status":"exists","values":["やうなれ"]},"meirei":{"status":"none","values":[]}}}]}]}</script>
<script>
const POS_LABELS={verb:'動詞',adjective:'形容詞',adjectivalVerb:'形容動詞',auxiliary:'助動詞'};
const FORM_KEYS=['mizen','renyo','shushi','rentai','izen','meirei'];
const FORM_LABELS={mizen:'未然形',renyo:'連用形',shushi:'終止形',rentai:'連体形',izen:'已然形',meirei:'命令形'};
const state={pos:'verb',master:null,question:null,lastKey:null,answered:false,sessionCount:0};
function qs(s){return document.querySelector(s)}
function qsa(s){return [...document.querySelectorAll(s)]}
function loadProgress(){try{return JSON.parse(localStorage.getItem('katsuyoTableOnlyProgressV01')||'{}')}catch{return {}}}
function saveProgress(v){localStorage.setItem('katsuyoTableOnlyProgressV01',JSON.stringify(v))}
function feedbackSymbol(streak){return streak>=3?'はなまる':streak>=2?'✓':'○'}
function entriesForPos(){return state.master.entries.filter(e=>e.partOfSpeech===state.pos).slice().sort((a,b)=>(a.displayOrder||0)-(b.displayOrder||0))}
function cellKey(entry,row,formKey){return `${entry.id}:${row.id}:${formKey}`}
function questions(){const out=[];for(const entry of entriesForPos())for(const row of entry.rows)for(const formKey of FORM_KEYS){const cell=row.cells[formKey];if(cell?.status==='exists'&&cell.values?.length)out.push({entry,row,formKey,cell,key:cellKey(entry,row,formKey)})}return out}
function entriesToRender(q){if(state.pos==='adjective'||state.pos==='adjectivalVerb')return entriesForPos();return [q.entry]}
function renderValues(td,values){const w=document.createElement('span');w.className='cell-values';values.forEach((v,i)=>{if(i){const s=document.createElement('span');s.className='cell-value-separator';s.textContent='／';w.append(s)}const x=document.createElement('span');x.className='cell-value';x.textContent=v;w.append(x)});td.append(w)}
function buildBlock(entry,q){const block=document.createElement('section');block.className='conjugation-block';const h=document.createElement('h3');h.textContent=entry.label;block.append(h);const table=document.createElement('table');table.className='conj-table';const thead=document.createElement('thead');const hr=document.createElement('tr');const sh=document.createElement('th');sh.scope='col';sh.textContent='系列';hr.append(sh);for(const fk of FORM_KEYS){const th=document.createElement('th');th.scope='col';th.textContent=FORM_LABELS[fk];hr.append(th)}thead.append(hr);table.append(thead);const tbody=document.createElement('tbody');for(const row of entry.rows){const tr=document.createElement('tr');const rh=document.createElement('th');rh.scope='row';rh.className='series-cell';rh.textContent=row.label;tr.append(rh);for(const fk of FORM_KEYS){const td=document.createElement('td');const c=row.cells[fk];const target=q.entry.id===entry.id&&q.row.id===row.id&&q.formKey===fk;if(target){td.className='target-cell';const b=document.createElement('span');b.className='blank-cell';b.textContent='□';td.append(b)}else if(c.status==='none'){const n=document.createElement('span');n.className='none-cell';n.textContent='○';td.append(n)}else{renderValues(td,c.values)}tr.append(td)}tbody.append(tr)}table.append(tbody);block.append(table);return block}
function render(){const q=state.question;if(!q)return;const grid=qs('#masterGrid');grid.replaceChildren();const es=entriesToRender(q);grid.classList.toggle('single',es.length===1);es.forEach(e=>grid.append(buildBlock(e,q)));qs('#tableQuestionLabel').textContent=`${POS_LABELS[state.pos]}｜${q.entry.label}｜${q.row.label}｜${FORM_LABELS[q.formKey]}`;qs('#masterBadge').textContent=`学校文法master｜この回 ${state.sessionCount}｜候補 ${questions().length}`;const i=qs('#tableAnswerInput');i.value='';i.disabled=false;i.placeholder=q.cell.values.length>1?`例：${q.cell.values.join('／')}`:'かなで入力';qs('#tableCheckBtn').disabled=false;const r=qs('#tableResult');r.hidden=true;r.replaceChildren();state.answered=false;requestAnimationFrame(()=>i.focus({preventScroll:true}))}
function next(){const pool=questions();if(!pool.length)return;let candidates=pool.filter(q=>q.key!==state.lastKey);if(!candidates.length)candidates=pool;state.question=candidates[Math.floor(Math.random()*candidates.length)];state.lastKey=state.question.key;state.sessionCount++;render()}
function normalize(v){return String(v||'').normalize('NFKC').replace(/[，,、・]/g,'／').replace(/[\\/|]/g,'／').replace(/\s+/g,'').replace(/／+/g,'／').replace(/^／|／$/g,'')}
function tokens(v){const n=normalize(v);return n?n.split('／').filter(Boolean):[]}
function correct(input,expected){const a=tokens(input);const e=expected.map(normalize);if(e.length===1)return a.length===1&&a[0]===e[0];return a.length===e.length&&[...a].sort().join('\0')===[...e].sort().join('\0')}
function check(){if(state.answered||!state.question)return;const input=qs('#tableAnswerInput');if(!input.value.trim()){const r=qs('#tableResult');r.hidden=false;r.textContent='答えを入力してください。';return}state.answered=true;const q=state.question;const ok=correct(input.value,q.cell.values);const p=loadProgress();const k=`table:${q.key}`;const prev=p[k]||{streak:0,correct:0,wrong:0};if(ok){prev.streak++;prev.correct++}else{prev.streak=0;prev.wrong++}p[k]=prev;saveProgress(p);input.disabled=true;qs('#tableCheckBtn').disabled=true;const r=qs('#tableResult');r.hidden=false;r.replaceChildren();const s=document.createElement('span');s.className='symbol';s.textContent=ok?feedbackSymbol(prev.streak):'もう一度';r.append(s);const ans=q.cell.values.join('／');r.append(document.createTextNode(ok?` 正解：${ans}`:` 正解は ${ans}。`))}
function setPos(pos){state.pos=pos;state.lastKey=null;state.sessionCount=0;qsa('#posButtons button').forEach(b=>{const a=b.dataset.pos===pos;b.classList.toggle('active',a);b.setAttribute('aria-pressed',String(a))});next()}
async function init(){state.master=JSON.parse(document.getElementById('conjugationMasterData').textContent);qsa('#posButtons button').forEach(b=>b.addEventListener('click',()=>setPos(b.dataset.pos)));qs('#tableCheckBtn').addEventListener('click',check);qs('#tableNextBtn').addEventListener('click',next);qs('#resetBtn').addEventListener('click',()=>{localStorage.removeItem('katsuyoTableOnlyProgressV01');next()});qs('#tableAnswerInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();state.answered?next():check()}});next()}
document.addEventListener('DOMContentLoaded',()=>init().catch(err=>{console.error(err);const r=qs('#tableResult');r.hidden=false;r.textContent='データの読み込みに失敗しました。HTTPサーバー上で開いてください。'}));

</script>
