<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f4">
<title>記録画面 モーション比較</title>
<style>
:root{
  --bg:#fbf8f4;--card:#fffefc;--ink:#4a4036;--muted:#84796e;--line:#e9dfd4;
  --verb:#a6526b;--adj:#c88753;--adjv:#3d7f77;--aux:#3b576d;--pink:#fbf0f3
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic","Yu Gothic UI",sans-serif}
body{min-height:100vh}
.controls{position:sticky;top:0;z-index:20;background:rgba(251,248,244,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 10px 9px}
.controls-inner{width:min(430px,100%);margin:auto;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.controls-inner::-webkit-scrollbar{display:none}
.mode{border:1px solid #d8cdbf;background:#fff;color:var(--ink);border-radius:999px;padding:8px 12px;font:inherit;font-size:12px;font-weight:800;white-space:nowrap}
.mode.active{background:#5a4b3d;color:#fff;border-color:#5a4b3d}
.page{width:min(430px,100%);margin:auto;padding:18px 15px 100px}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:30px;font-weight:850}.back{border:1.5px solid #d7cabb;background:#fff;border-radius:14px;padding:10px 16px;color:var(--ink);font-size:15px;font-weight:750}
.stack{display:grid;gap:13px;margin-top:14px}
.card{background:var(--card);border:1.4px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 4px 12px rgba(70,55,40,.025)}
.points-card{border-color:#e2e6cb}.points-row{display:flex;align-items:center;justify-content:space-between}.kicker{font-size:13px;color:#857d75;font-weight:700;letter-spacing:.07em}.points{font-size:32px;font-weight:900;margin-top:8px}
.cat{font-size:38px;line-height:1}.section-title,.check-title{font-size:18px;font-weight:900;margin:0 0 13px}
.breakdown{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.donut{width:146px;height:146px;position:relative;margin:auto}svg{width:100%;height:100%;display:block;overflow:visible}
.track{fill:none;stroke:#eee8e2;stroke-width:26}.arc{fill:none;stroke-width:26;stroke-linecap:butt;transform-box:view-box;transform-origin:100px 100px}
.a{stroke:var(--verb)}.b{stroke:var(--adj)}.c{stroke:var(--adjv)}.d{stroke:var(--aux)}
.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.center small{display:block;color:#8c8279;font-size:11px}.center b{font-size:25px;color:#7e756d}
.legend{display:grid;gap:9px}.legend-row{display:grid;grid-template-columns:10px 1fr auto;gap:7px;align-items:center;font-size:13px}.dot{width:9px;height:9px;border-radius:50%}.dot.a{background:var(--verb)}.dot.b{background:var(--adj)}.dot.c{background:var(--adjv)}.dot.d{background:var(--aux)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.statbox{border:1.4px solid var(--line);border-radius:14px;padding:10px 9px;text-align:center;background:#fff}.statbox .label{font-size:12px;color:#786e65;font-weight:800}.statbox .value{font-size:24px;margin-top:4px}.ratebox{grid-column:1/-1}.rate-cols{display:grid;grid-template-columns:1fr 1fr}.rate-col+.rate-col{border-left:1px solid var(--line)}.rate-col small{display:block;color:#857c74;font-size:10px}.rate-col b{font-size:24px;font-weight:500}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{border:2px solid currentColor;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;background:#fff}.chip.active{color:#fff;background:var(--verb);border-color:var(--verb)}.chip.adj{color:var(--adj)}.chip.adjv{color:var(--adjv)}.chip.aux{color:var(--aux)}
.explain{font-size:11px;color:#8b8178;line-height:1.6;margin-bottom:11px}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.review{border:1.4px solid #e4dfd8;border-radius:14px;background:#fff;padding:10px 9px;display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:center}.error{background:var(--pink);border:1px solid #ead1d8;border-radius:11px;padding:7px;text-align:center;min-width:50px}.error small{display:block;color:#9a6475;font-size:9px;font-weight:800}.error b{font-size:17px}.qtop{display:flex;align-items:center;gap:5px}.qtag{border-radius:999px;background:var(--verb);color:#fff;font-size:9px;padding:4px 6px;font-weight:800}.qname{font-size:13px;font-weight:900;white-space:nowrap}.qsub{font-size:9px;color:#81776e;margin-top:3px}
.replay{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;border:1px solid #d9cec2;border-radius:999px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);padding:10px 17px;box-shadow:0 7px 24px rgba(65,50,35,.14);font:inherit;color:var(--ink);font-size:13px;font-weight:800}

/* base reset */
.page .anim,.page .arc,.page .center,.page .legend-row,.page .statbox,.page .review{animation:none}
.page:not(.play) .anim,
.page:not(.play) .arc,
.page:not(.play) .center,
.page:not(.play) .legend-row,
.page:not(.play) .statbox,
.page:not(.play) .review{opacity:0}

/* D-style donut */
.page.play .arc{animation:bloom .72s cubic-bezier(.19,.86,.22,1) forwards}
.page.play .arc.p1{animation-delay:.28s}.page.play .arc.p2{animation-delay:.35s}.page.play .arc.p3{animation-delay:.42s}.page.play .arc.p4{animation-delay:.49s}
@keyframes bloom{0%{opacity:0;transform:scale(.18) rotate(-28deg)}40%{opacity:1}82%{transform:scale(1.025) rotate(1deg)}100%{opacity:1;transform:none}}
.page.play .center{animation:centerIn .32s ease .88s forwards}
@keyframes centerIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* 1 ripple cascade */
.page.mode-ripple .anim{opacity:0;transform:translateY(12px)}
.page.mode-ripple.play .anim{animation:rippleCard .5s cubic-bezier(.2,.8,.2,1) forwards}
.page.mode-ripple.play .a1{animation-delay:.03s}.page.mode-ripple.play .a2{animation-delay:.12s}.page.mode-ripple.play .a3{animation-delay:.21s}
.page.mode-ripple.play .legend-row{animation:rippleSmall .3s ease forwards}.page.mode-ripple.play .legend-row:nth-child(1){animation-delay:.62s}.page.mode-ripple.play .legend-row:nth-child(2){animation-delay:.68s}.page.mode-ripple.play .legend-row:nth-child(3){animation-delay:.74s}.page.mode-ripple.play .legend-row:nth-child(4){animation-delay:.80s}
.page.mode-ripple.play .statbox{animation:rippleSmall .32s ease forwards}.page.mode-ripple.play .statbox:nth-child(1){animation-delay:.58s}.page.mode-ripple.play .statbox:nth-child(2){animation-delay:.66s}
.page.mode-ripple.play .review{animation:rippleSmall .34s ease forwards}.page.mode-ripple.play .review:nth-child(1){animation-delay:.52s}.page.mode-ripple.play .review:nth-child(2){animation-delay:.57s}.page.mode-ripple.play .review:nth-child(3){animation-delay:.62s}.page.mode-ripple.play .review:nth-child(4){animation-delay:.67s}.page.mode-ripple.play .review:nth-child(5){animation-delay:.72s}.page.mode-ripple.play .review:nth-child(6){animation-delay:.77s}
@keyframes rippleCard{to{opacity:1;transform:none}}@keyframes rippleSmall{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* 2 side magnet */
.page.mode-magnet .a1{opacity:0;transform:translateX(-18px)}.page.mode-magnet .a2{opacity:0;transform:translateX(18px)}.page.mode-magnet .a3{opacity:0;transform:translateX(-18px)}
.page.mode-magnet.play .anim{animation:magCard .48s cubic-bezier(.16,.86,.24,1.08) forwards}.page.mode-magnet.play .a1{animation-delay:.03s}.page.mode-magnet.play .a2{animation-delay:.11s}.page.mode-magnet.play .a3{animation-delay:.19s}
.page.mode-magnet .legend-row,.page.mode-magnet .statbox,.page.mode-magnet .review{opacity:0}
.page.mode-magnet.play .legend-row{animation:magRight .34s ease forwards}.page.mode-magnet.play .legend-row:nth-child(1){animation-delay:.58s}.page.mode-magnet.play .legend-row:nth-child(2){animation-delay:.64s}.page.mode-magnet.play .legend-row:nth-child(3){animation-delay:.70s}.page.mode-magnet.play .legend-row:nth-child(4){animation-delay:.76s}
.page.mode-magnet.play .statbox{animation:magRight .34s ease forwards}.page.mode-magnet.play .statbox:nth-child(1){animation-delay:.56s}.page.mode-magnet.play .statbox:nth-child(2){animation-delay:.64s}
.page.mode-magnet.play .review:nth-child(odd){animation:magLeft .34s ease forwards}.page.mode-magnet.play .review:nth-child(even){animation:magRight .34s ease forwards}.page.mode-magnet.play .review:nth-child(1){animation-delay:.48s}.page.mode-magnet.play .review:nth-child(2){animation-delay:.53s}.page.mode-magnet.play .review:nth-child(3){animation-delay:.58s}.page.mode-magnet.play .review:nth-child(4){animation-delay:.63s}.page.mode-magnet.play .review:nth-child(5){animation-delay:.68s}.page.mode-magnet.play .review:nth-child(6){animation-delay:.73s}
@keyframes magCard{70%{opacity:1;transform:translateX(1px)}100%{opacity:1;transform:none}}@keyframes magLeft{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}@keyframes magRight{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

/* 3 soft landing */
.page.mode-land .anim{opacity:0;transform:translateY(-10px) scale(.985)}
.page.mode-land.play .anim{animation:landing .62s cubic-bezier(.18,.86,.28,1.12) forwards}.page.mode-land.play .a1{animation-delay:.02s}.page.mode-land.play .a2{animation-delay:.10s}.page.mode-land.play .a3{animation-delay:.18s}
.page.mode-land .legend-row,.page.mode-land .statbox,.page.mode-land .review{opacity:0;transform:translateY(-6px)}
.page.mode-land.play .legend-row,.page.mode-land.play .statbox,.page.mode-land.play .review{animation:landSmall .4s cubic-bezier(.18,.86,.28,1.08) forwards}
.page.mode-land.play .legend-row:nth-child(1){animation-delay:.60s}.page.mode-land.play .legend-row:nth-child(2){animation-delay:.66s}.page.mode-land.play .legend-row:nth-child(3){animation-delay:.72s}.page.mode-land.play .legend-row:nth-child(4){animation-delay:.78s}
.page.mode-land.play .statbox:nth-child(1){animation-delay:.58s}.page.mode-land.play .statbox:nth-child(2){animation-delay:.66s}
.page.mode-land.play .review:nth-child(1){animation-delay:.50s}.page.mode-land.play .review:nth-child(2){animation-delay:.55s}.page.mode-land.play .review:nth-child(3){animation-delay:.60s}.page.mode-land.play .review:nth-child(4){animation-delay:.65s}.page.mode-land.play .review:nth-child(5){animation-delay:.70s}.page.mode-land.play .review:nth-child(6){animation-delay:.75s}
@keyframes landing{72%{opacity:1;transform:translateY(1px) scale(1.003)}100%{opacity:1;transform:none}}@keyframes landSmall{to{opacity:1;transform:none}}

/* 4 scan reveal */
.page.mode-scan .anim{opacity:0;clip-path:inset(0 100% 0 0)}
.page.mode-scan.play .anim{animation:scanCard .58s cubic-bezier(.25,.75,.2,1) forwards}.page.mode-scan.play .a1{animation-delay:.03s}.page.mode-scan.play .a2{animation-delay:.12s}.page.mode-scan.play .a3{animation-delay:.21s}
.page.mode-scan .legend-row,.page.mode-scan .statbox,.page.mode-scan .review{opacity:0;clip-path:inset(0 100% 0 0)}
.page.mode-scan.play .legend-row,.page.mode-scan.play .statbox,.page.mode-scan.play .review{animation:scanSmall .38s ease forwards}
.page.mode-scan.play .legend-row:nth-child(1){animation-delay:.58s}.page.mode-scan.play .legend-row:nth-child(2){animation-delay:.64s}.page.mode-scan.play .legend-row:nth-child(3){animation-delay:.70s}.page.mode-scan.play .legend-row:nth-child(4){animation-delay:.76s}
.page.mode-scan.play .statbox:nth-child(1){animation-delay:.56s}.page.mode-scan.play .statbox:nth-child(2){animation-delay:.64s}
.page.mode-scan.play .review:nth-child(1){animation-delay:.48s}.page.mode-scan.play .review:nth-child(2){animation-delay:.53s}.page.mode-scan.play .review:nth-child(3){animation-delay:.58s}.page.mode-scan.play .review:nth-child(4){animation-delay:.63s}.page.mode-scan.play .review:nth-child(5){animation-delay:.68s}.page.mode-scan.play .review:nth-child(6){animation-delay:.73s}
@keyframes scanCard{to{opacity:1;clip-path:inset(0 0 0 0)}}@keyframes scanSmall{to{opacity:1;clip-path:inset(0 0 0 0)}}

@media(max-width:370px){.breakdown{grid-template-columns:135px 1fr}.donut{width:132px;height:132px}.review-grid{grid-template-columns:1fr}.qname{white-space:normal}}
</style>
</head>
<body>
<div class="controls"><div class="controls-inner">
<button class="mode active" data-mode="ripple">A 波紋整列</button>
<button class="mode" data-mode="magnet">B 左右吸着</button>
<button class="mode" data-mode="land">C 浮いて着地</button>
<button class="mode" data-mode="scan">D スキャン表示</button>
</div></div>

<div class="page mode-ripple" id="page">
<header><h1>記録</h1><button class="back">戻る</button></header>
<div class="stack">
<section class="card points-card anim a1"><div class="points-row"><div><div class="kicker">これまでにためたポイント</div><div class="points">18,984</div></div><div class="cat">🐈</div></div></section>

<section class="card anim a2">
<h2 class="section-title">取り組んだ問題の内訳</h2>
<div class="breakdown">
<div class="donut">
<svg viewBox="0 0 200 200">
<circle class="track" cx="100" cy="100" r="70"/>
<circle class="arc a p1" cx="100" cy="100" r="70" pathLength="100" stroke-dasharray="27.64 72.36" stroke-dashoffset="0" transform="rotate(-90 100 100)"/>
<circle class="arc b p2" cx="100" cy="100" r="70" pathLength="100" stroke-dasharray="1.67 98.33" stroke-dashoffset="-27.64" transform="rotate(-90 100 100)"/>
<circle class="arc c p3" cx="100" cy="100" r="70" pathLength="100" stroke-dasharray="24.30 75.70" stroke-dashoffset="-29.31" transform="rotate(-90 100 100)"/>
<circle class="arc d p4" cx="100" cy="100" r="70" pathLength="100" stroke-dasharray="46.39 53.61" stroke-dashoffset="-53.61" transform="rotate(-90 100 100)"/>
</svg>
<div class="center"><div><small>累計</small><b>539</b> <small style="display:inline">問</small></div></div>
</div>
<div>
<div class="legend">
<div class="legend-row"><i class="dot a"></i><span>動詞</span><strong>149問</strong></div>
<div class="legend-row"><i class="dot b"></i><span>形容詞</span><strong>9問</strong></div>
<div class="legend-row"><i class="dot c"></i><span>形容動詞</span><strong>131問</strong></div>
<div class="legend-row"><i class="dot d"></i><span>助動詞</span><strong>250問</strong></div>
</div>
<div class="stats">
<div class="statbox"><div class="label">正答数<br>(累計)</div><div class="value">312</div></div>
<div class="statbox ratebox"><div class="label">正答率</div><div class="rate-cols"><div class="rate-col"><small>直近</small><b>29%</b></div><div class="rate-col"><small>累計</small><b>14%</b></div></div></div>
</div>
</div>
</div>
</section>

<section class="card anim a3">
<h2 class="check-title">要確認</h2>
<div class="chips"><span class="chip active">動詞</span><span class="chip adj">形容詞</span><span class="chip adjv">形容動詞</span><span class="chip aux">助動詞</span></div>
<div class="explain">3問以上取り組んだ項目を、誤答率の高い順に表示します。</div>
<div class="review-grid">
<div class="review"><div class="error"><small>誤答率</small><b>100%</b></div><div><div class="qtop"><span class="qtag">動詞</span><span class="qname">下二段活用</span></div><div class="qsub">誤答 105/105</div></div></div>
<div class="review"><div class="error"><small>誤答率</small><b>100%</b></div><div><div class="qtop"><span class="qtag">動詞</span><span class="qname">上一段活用</span></div><div class="qsub">誤答 6/6</div></div></div>
<div class="review"><div class="error"><small>誤答率</small><b>100%</b></div><div><div class="qtop"><span class="qtag">動詞</span><span class="qname">ナ変活用</span></div><div class="qsub">誤答 3/3</div></div></div>
<div class="review"><div class="error"><small>誤答率</small><b>100%</b></div><div><div class="qtop"><span class="qtag">動詞</span><span class="qname">ラ変活用</span></div><div class="qsub">誤答 3/3</div></div></div>
<div class="review"><div class="error"><small>誤答率</small><b>98%</b></div><div><div class="qtop"><span class="qtag">動詞</span><span class="qname">四段活用</span></div><div class="qsub">誤答 280/285</div></div></div>
<div class="review"><div class="error"><small>誤答率</small><b>93%</b></div><div><div class="qtop"><span class="qtag">動詞</span><span class="qname">上二段活用</span></div><div class="qsub">誤答 42/45</div></div></div>
</div>
</section>
</div>
</div>
<button class="replay" id="replay">↻ この動きを再生</button>

<script>
function review(rate,name,sub){
 return '<div class="review"><div class="error"><small>誤答率</small><b>'+rate+'</b></div><div><div class="qtop"><span class="qtag">動詞</span><span class="qname">'+name+'</span></div><div class="qsub">'+sub+'</div></div></div>';
}
(function(){
 const page=document.getElementById('page');
 const buttons=[].slice.call(document.querySelectorAll('.mode'));
 function play(){
   page.classList.remove('play');void page.offsetWidth;
   requestAnimationFrame(function(){requestAnimationFrame(function(){page.classList.add('play')})});
 }
 buttons.forEach(function(btn){
   btn.addEventListener('click',function(){
     buttons.forEach(function(b){b.classList.remove('active')});
     btn.classList.add('active');
     page.className='page mode-'+btn.dataset.mode;
     play();
   });
 });
 document.getElementById('replay').addEventListener('click',play);
 window.addEventListener('pageshow',function(){setTimeout(play,160)},{once:true});
})();
</script>
</body>
</html>
