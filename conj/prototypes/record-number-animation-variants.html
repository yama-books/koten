<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f4">
<title>記録画面 数字アニメーション比較</title>
<style>
:root{
 --bg:#fbf8f4;--card:#fffefc;--ink:#4a4036;--muted:#84796e;--line:#e9dfd4;
 --verb:#a6526b;--adj:#c88753;--adjv:#3d7f77;--aux:#3b576d;--soft:#f5efe9
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic","Yu Gothic UI",sans-serif}
body{min-height:100vh}
.controls{position:sticky;top:0;z-index:20;background:rgba(251,248,244,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:9px 10px}
.controls-inner{width:min(430px,100%);margin:auto;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.controls-inner::-webkit-scrollbar{display:none}
.mode{border:1px solid #d8cdbf;background:#fff;color:var(--ink);border-radius:999px;padding:8px 12px;font:inherit;font-size:12px;font-weight:800;white-space:nowrap}
.mode.active{background:#594c40;color:#fff;border-color:#594c40}
.page{width:min(430px,100%);margin:auto;padding:18px 15px 110px}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:30px;font-weight:850}
.back{border:1.5px solid #d7cabb;background:#fff;border-radius:14px;padding:10px 16px;color:var(--ink);font-size:15px;font-weight:750}
.stack{display:grid;gap:13px;margin-top:14px}
.card{background:var(--card);border:1.4px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 4px 12px rgba(70,55,40,.025)}
.float{opacity:0;transform:translateY(15px) scale(.988)}
.page.play .float{animation:floatIn .62s cubic-bezier(.18,.86,.22,1) forwards}
.page.play .f1{animation-delay:.02s}.page.play .f2{animation-delay:.10s}.page.play .f3{animation-delay:.18s}
@keyframes floatIn{60%{opacity:1;transform:translateY(-2px) scale(1.002)}100%{opacity:1;transform:none}}

.points-card{border-color:#e2e6cb}
.points-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kicker{font-size:13px;color:#857d75;font-weight:700;letter-spacing:.07em}
.points{font-size:34px;font-weight:900;margin-top:8px;letter-spacing:-.03em;min-height:42px}
.cat{font-size:38px;line-height:1}
.section-title{font-size:18px;font-weight:900;margin:0 0 13px}
.summary-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:10px}
.bigbox,.statbox{border:1.4px solid var(--line);border-radius:16px;background:#fff;padding:13px}
.bigbox .label,.statbox .label{font-size:12px;color:#786e65;font-weight:800}
.bigbox .num{font-size:34px;font-weight:750;margin-top:8px;min-height:42px}
.statbox{text-align:center}.statbox .num{font-size:27px;margin-top:6px;min-height:34px}
.rate-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.rate{border:1.4px solid var(--line);border-radius:16px;background:#fff;padding:12px;text-align:center}
.rate small{display:block;color:#857c74;font-size:10px}.rate .num{font-size:28px;margin-top:3px;min-height:34px}

.breakdown{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;margin-top:4px}
.donut{width:146px;height:146px;position:relative;margin:auto}
svg{width:100%;height:100%;display:block;overflow:visible}
.track{fill:none;stroke:#eee8e2;stroke-width:26}.arc{fill:none;stroke-width:26;stroke-linecap:butt;transform-box:view-box;transform-origin:100px 100px}
.a{stroke:var(--verb)}.b{stroke:var(--adj)}.c{stroke:var(--adjv)}.d{stroke:var(--aux)}
.page:not(.play) .arc{opacity:0;transform:scale(.2) rotate(-25deg)}
.page.play .arc{animation:bloom .72s cubic-bezier(.19,.86,.22,1) forwards}
.page.play .p1{animation-delay:.22s}.page.play .p2{animation-delay:.29s}.page.play .p3{animation-delay:.36s}.page.play .p4{animation-delay:.43s}
@keyframes bloom{0%{opacity:0;transform:scale(.2) rotate(-25deg)}40%{opacity:1}82%{transform:scale(1.025) rotate(1deg)}100%{opacity:1;transform:none}}
.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.center small{display:block;color:#8c8279;font-size:11px}.center .num{font-size:25px;color:#7e756d;font-weight:750;min-height:30px}
.legend{display:grid;gap:9px}.legend-row{display:grid;grid-template-columns:10px 1fr auto;gap:7px;align-items:center;font-size:13px}.dot{width:9px;height:9px;border-radius:50%}.dot.a{background:var(--verb)}.dot.b{background:var(--adj)}.dot.c{background:var(--adjv)}.dot.d{background:var(--aux)}
.demo-note{margin:12px 2px 0;padding:10px 12px;border-radius:14px;background:var(--soft);font-size:11px;line-height:1.6;color:#786f67}
.replay{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;border:1px solid #d9cec2;border-radius:999px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);padding:10px 17px;box-shadow:0 7px 24px rgba(65,50,35,.14);font:inherit;color:var(--ink);font-size:13px;font-weight:800}

/* number animation wrappers */
.numwrap{display:inline-flex;align-items:baseline;position:relative;min-width:1ch;font-variant-numeric:tabular-nums}
.value-layer{display:inline-block;will-change:transform,opacity,filter}

/* A smooth count */
.mode-count .value-layer{transform-origin:50% 60%}

/* B whole-reel */
.mode-reel .value-layer{transform:translateY(-18px);opacity:0}
.mode-reel.play .value-layer.ready{animation:wholeReel .72s cubic-bezier(.18,.82,.18,1) forwards}
@keyframes wholeReel{0%{opacity:0;transform:translateY(-18px)}55%{opacity:1;transform:translateY(2px)}100%{opacity:1;transform:translateY(0)}}

/* C digit reels */
.digits{display:inline-flex;overflow:hidden;height:1.08em;vertical-align:bottom}
.digit-window{display:inline-block;width:.62em;height:1.08em;overflow:hidden;position:relative}
.digit-strip{display:flex;flex-direction:column;will-change:transform}
.digit-strip span{height:1.08em;line-height:1.08em;display:block;text-align:center}
.sep{display:inline-block;min-width:.33em;text-align:center}

/* D focus resolve */
.mode-focus .value-layer{opacity:0;filter:blur(7px);transform:scale(.965)}
.mode-focus.play .value-layer.ready{animation:focusResolve .78s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes focusResolve{0%{opacity:0;filter:blur(7px);transform:scale(.965)}55%{opacity:1;filter:blur(1.5px);transform:scale(1.012)}100%{opacity:1;filter:blur(0);transform:scale(1)}}

/* E settle zoom */
.mode-zoom .value-layer{opacity:0;transform:scale(.88)}
.mode-zoom.play .value-layer.ready{animation:zoomSettle .72s cubic-bezier(.18,.86,.22,1.05) forwards}
@keyframes zoomSettle{0%{opacity:0;transform:scale(.88)}70%{opacity:1;transform:scale(1.025)}100%{opacity:1;transform:scale(1)}}

/* F cross-slide */
.cross-wrap{position:relative;display:inline-block;min-width:2ch}
.cross-old,.cross-new{display:inline-block}
.cross-old{position:absolute;inset:0 auto auto 0}
.mode-cross .cross-old{opacity:1;transform:translateY(0)}
.mode-cross .cross-new{opacity:0;transform:translateY(9px)}
.mode-cross.play .ready.cross-old{animation:crossOld .44s ease .26s forwards}
.mode-cross.play .ready.cross-new{animation:crossNew .52s cubic-bezier(.2,.8,.2,1) .28s forwards}
@keyframes crossOld{to{opacity:0;transform:translateY(-7px)}}
@keyframes crossNew{to{opacity:1;transform:translateY(0)}}

@media(max-width:370px){.breakdown{grid-template-columns:135px 1fr}.donut{width:132px;height:132px}.summary-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="controls"><div class="controls-inner">
<button class="mode active" data-mode="count">A 滑らかカウント</button>
<button class="mode" data-mode="reel">B 全体リール</button>
<button class="mode" data-mode="digits">C 桁ごとロール</button>
<button class="mode" data-mode="focus">D ピント確定</button>
<button class="mode" data-mode="zoom">E ズーム収束</button>
<button class="mode" data-mode="cross">F クロススライド</button>
</div></div>

<div class="page mode-count" id="page">
<header><h1>記録</h1><button class="back">戻る</button></header>
<div class="stack">

<section class="card points-card float f1">
<div class="points-row">
<div><div class="kicker">これまでにためたポイント</div><div class="points numhost" data-value="18984"></div></div>
<div class="cat">🐈</div>
</div>
</section>

<section class="card float f2">
<h2 class="section-title">数字カードの動き</h2>
<div class="summary-grid">
<div class="bigbox"><div class="label">累計回答数</div><div class="num numhost" data-value="539"></div></div>
<div class="statbox"><div class="label">正答数<br>(累計)</div><div class="num numhost" data-value="312"></div></div>
</div>
<div class="rate-row">
<div class="rate"><small>直近 正答率</small><div class="num"><span class="numhost" data-value="29"></span>%</div></div>
<div class="rate"><small>累計 正答率</small><div class="num"><span class="numhost" data-value="14"></span>%</div></div>
</div>
<div class="demo-note" id="note">A: 数値が連続的に増え、終盤だけゆっくり減速して止まります。最も素直で滑らか。</div>
</section>

<section class="card float f3">
<h2 class="section-title">取り組んだ問題の内訳</h2>
<div class="breakdown">
<div class="donut">
<svg viewBox="0 0 200 200">
<circle class="track" cx="100" cy="100" r="70"/>
<circle class="arc a p1" cx="100" cy="100" r="70" pathLength="100" stroke-dasharray="27.64 72.36" stroke-dashoffset="0" transform="rotate(-90 100 100)"/>
<circle class="arc b p2" cx="100" cy="100" r="70" pathLength="100" stroke-dasharray="1.67 98.33" stroke-dashoffset="-27.64" transform="rotate(-90 100 100)"/>
<circle class="arc c p3" cx="100" cy="100" r="70" pathLength="100" stroke-dasharray="24.30 75.70" stroke-dashoffset="-29.31" transform="rotate(-90 100 100)"/>
<circle class="arc d p4" cx="100" cy="100" r="70" pathLength="100" stroke-dasharray="46.39 53.61" stroke-dashoffset="-53.61" transform="rotate(-90 100 100)"/>
</svg>
<div class="center"><div><small>累計</small><div class="num numhost" data-value="539"></div><small>問</small></div></div>
</div>
<div class="legend">
<div class="legend-row"><i class="dot a"></i><span>動詞</span><strong>149問</strong></div>
<div class="legend-row"><i class="dot b"></i><span>形容詞</span><strong>9問</strong></div>
<div class="legend-row"><i class="dot c"></i><span>形容動詞</span><strong>131問</strong></div>
<div class="legend-row"><i class="dot d"></i><span>助動詞</span><strong>250問</strong></div>
</div>
</div>
</section>

</div>
</div>
<button class="replay" id="replay">↻ この数字の動きを再生</button>

<script>
(function(){
 const page=document.getElementById('page');
 const note=document.getElementById('note');
 const buttons=[].slice.call(document.querySelectorAll('.mode'));
 const notes={
   count:'A: 数値が連続的に増え、終盤だけゆっくり減速して止まります。最も素直で滑らか。',
   reel:'B: 数字全体が1枚のリールのように縦へ滑り、最後の値で止まります。くるくる感を残しつつガタつきを抑えます。',
   digits:'C: 各桁が独立した数字ホイールとして静かに回転します。オドメーターに近い動きです。',
   focus:'D: 数字がぼやけた状態からピントが合い、最終値だけが確定して見えます。静かで上品。',
   zoom:'E: 数字が少し小さい状態から手前へ寄り、わずかにオーバーして止まります。',
   cross:'F: 直前値が上へ抜け、新しい値が下から静かに入れ替わります。もっとも短く控えめ。'
 };

 function format(v){return Number(v).toLocaleString('ja-JP')}

 function build(mode){
   document.querySelectorAll('.numhost').forEach(function(host){
     const target=Number(host.dataset.value||0);
     host.innerHTML='';
     if(mode==='digits'){
       const text=format(target);
       const wrap=document.createElement('span');wrap.className='digits';
       [...text].forEach(function(ch,idx){
         if(ch===','){
           const sep=document.createElement('span');sep.className='sep';sep.textContent=',';
           wrap.appendChild(sep);return;
         }
         const win=document.createElement('span');win.className='digit-window';
         const strip=document.createElement('span');strip.className='digit-strip';
         for(let i=0;i<=9;i++){const s=document.createElement('span');s.textContent=i;strip.appendChild(s)}
         win.appendChild(strip);wrap.appendChild(win);
         const digit=Number(ch);
         strip.dataset.digit=String(digit);
         strip.dataset.idx=String(idx);
       });
       host.appendChild(wrap);
     } else if(mode==='cross'){
       const wrap=document.createElement('span');wrap.className='cross-wrap';
       const oldv=document.createElement('span');oldv.className='cross-old';oldv.textContent=format(Math.max(0,Math.round(target*.82)));
       const newv=document.createElement('span');newv.className='cross-new';newv.textContent=format(target);
       wrap.append(oldv,newv);host.appendChild(wrap);
     } else {
       const span=document.createElement('span');span.className='value-layer';span.textContent=mode==='count'?'0':format(target);host.appendChild(span);
     }
   });
 }

 function animateCount(){
   document.querySelectorAll('.numhost').forEach(function(host,i){
     const target=Number(host.dataset.value||0), el=host.querySelector('.value-layer');
     const delay=260+i*35, dur=760, start=performance.now()+delay;
     function tick(now){
       if(now<start){requestAnimationFrame(tick);return}
       const p=Math.min(1,(now-start)/dur);
       const e=1-Math.pow(1-p,4);
       el.textContent=format(Math.round(target*e));
       if(p<1)requestAnimationFrame(tick);
     }
     requestAnimationFrame(tick);
   });
 }

 function animateDigits(){
   document.querySelectorAll('.digit-strip').forEach(function(strip,i){
     strip.style.transition='none';
     strip.style.transform='translateY(0)';
     void strip.offsetWidth;
     const digit=Number(strip.dataset.digit||0);
     const duration=720 + (i%4)*65;
     strip.style.transition='transform '+duration+'ms cubic-bezier(.12,.78,.18,1)';
     requestAnimationFrame(function(){requestAnimationFrame(function(){
       strip.style.transform='translateY(calc(-1.08em * '+digit+'))';
     })});
   });
 }

 function animateStatic(mode){
   document.querySelectorAll('.value-layer,.cross-old,.cross-new').forEach(function(el){el.classList.add('ready')});
   if(mode==='reel'){
     document.querySelectorAll('.value-layer').forEach(function(el,i){
       el.style.animationDelay=(.25+i*.04)+'s';
     });
   } else if(mode==='focus'||mode==='zoom'){
     document.querySelectorAll('.value-layer').forEach(function(el,i){
       el.style.animationDelay=(.25+i*.04)+'s';
     });
   }
 }

 function play(){
   const mode=page.dataset.mode;
   page.classList.remove('play');
   build(mode);
   void page.offsetWidth;
   requestAnimationFrame(function(){requestAnimationFrame(function(){
     page.classList.add('play');
     if(mode==='count') animateCount();
     else if(mode==='digits') setTimeout(animateDigits,260);
     else animateStatic(mode);
   })});
 }

 buttons.forEach(function(btn){
   btn.addEventListener('click',function(){
     buttons.forEach(function(b){b.classList.remove('active')});
     btn.classList.add('active');
     const mode=btn.dataset.mode;
     page.className='page mode-'+mode;
     page.dataset.mode=mode;
     note.textContent=notes[mode];
     play();
   });
 });

 page.dataset.mode='count';
 document.getElementById('replay').addEventListener('click',play);
 window.addEventListener('pageshow',function(){setTimeout(play,170)},{once:true});
})();
</script>
</body>
</html>
