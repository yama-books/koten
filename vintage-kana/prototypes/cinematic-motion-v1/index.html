<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>変体仮名メーカー・変換演出プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Noto+Serif+Hentaigana:400,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f0e8;
    --paper2:#ebe2d4;
    --ink:#1d1a17;
    --muted:#766f68;
    --gold:#b08a4a;
    --gold2:#e6c987;
    --glass:rgba(255,255,255,.58);
    --shadow:0 22px 60px rgba(42,31,20,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 50% 12%, rgba(255,255,255,.9), transparent 34%),
      linear-gradient(160deg,var(--paper),var(--paper2));
    overflow:hidden;
  }
  body:before{
    content:"";
    position:fixed; inset:0; pointer-events:none; opacity:.15;
    background-image:
      linear-gradient(90deg, rgba(80,60,40,.07) 1px, transparent 1px),
      linear-gradient(rgba(80,60,40,.05) 1px, transparent 1px);
    background-size:28px 28px;
    mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent);
  }
  .app{
    height:100%;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:max(20px,env(safe-area-inset-top)) clamp(18px,4vw,44px) max(20px,env(safe-area-inset-bottom));
    position:relative;
    z-index:2;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    max-width:980px; width:100%; margin:0 auto;
  }
  .brand{display:flex; align-items:center; gap:12px}
  .seal{
    width:38px;height:38px;border-radius:12px;border:1px solid rgba(29,26,23,.18);
    display:grid;place-items:center;font-family:serif;font-size:18px;background:rgba(255,255,255,.34);
  }
  .brand b{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:600;letter-spacing:.08em}
  .mode{font-size:12px;color:var(--muted);letter-spacing:.08em}
  main{
    display:grid;place-items:center;position:relative;min-height:0;
  }
  .panel{
    width:min(860px,100%);
    border:1px solid rgba(70,55,40,.12);
    background:var(--glass);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:30px;
    box-shadow:var(--shadow);
    padding:clamp(26px,5vw,56px);
    position:relative;
    overflow:hidden;
  }
  .panel:before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(120deg,rgba(255,255,255,.32),transparent 28%,transparent 70%,rgba(176,138,74,.05));
  }
  .eyebrow{font-size:12px;letter-spacing:.16em;color:var(--muted);margin-bottom:14px}
  h1{
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:clamp(28px,5vw,52px);
    margin:0 0 14px; font-weight:600; letter-spacing:.06em;
  }
  .lead{color:var(--muted);font-size:14px;line-height:1.8;margin-bottom:28px}
  .composer{
    display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch;
    background:rgba(255,255,255,.48);
    border:1px solid rgba(52,42,32,.12);
    border-radius:20px;padding:10px;
  }
  textarea#input{
    min-width:0;min-height:82px;border:0;background:transparent;outline:none;resize:vertical;
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:clamp(22px,4vw,34px);padding:10px 14px;color:var(--ink);
    letter-spacing:.12em;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;
  }
  button{
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    border:0;border-radius:14px;padding:0 22px;min-height:56px;
    background:var(--ink);color:#fff;font-weight:700;letter-spacing:.08em;
    box-shadow:0 8px 22px rgba(29,26,23,.22);
    cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;
  }
  button:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(29,26,23,.25)}
  button:active{transform:translateY(1px) scale(.99)}
  button:disabled{opacity:.45;cursor:default}
  .options{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    margin-top:12px;padding:0 4px;color:var(--muted);font-size:13px;
  }
  .options label{display:flex;align-items:center;gap:6px}
  .options input{accent-color:var(--ink)}
  .optLabel{font-size:12px;letter-spacing:.08em;color:rgba(65,56,48,.76)}
  .hint{margin-top:14px;font-size:12px;color:var(--muted)}
  .debug-tools{
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    margin-top:12px;padding-top:10px;border-top:1px solid rgba(65,56,48,.10);
  }
  .debug-label{font-size:10px;letter-spacing:.12em;color:rgba(65,56,48,.50);margin-right:2px}
  .debug-btn{
    min-height:30px;width:auto;padding:5px 9px;border-radius:999px;
    font-size:10px;font-weight:600;letter-spacing:.03em;
    color:rgba(29,26,23,.78);background:rgba(255,255,255,.62);
    border:1px solid rgba(65,56,48,.13);box-shadow:none;
  }
  .debug-btn:hover{transform:none;box-shadow:none;background:rgba(255,255,255,.88)}
  .debug-plan{
    width:100%;min-height:15px;font:10px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:rgba(65,56,48,.48);letter-spacing:.015em;
  }
  footer{font-size:11px;color:rgba(65,56,48,.55);text-align:center}
  #stage{
    position:fixed;inset:0;z-index:20;pointer-events:none;
    display:grid;place-items:center;perspective:1100px;
    opacity:0;visibility:hidden;
  }
  #stage.active{opacity:1;visibility:visible}
  .veil{
    position:absolute;inset:0;background:
      radial-gradient(circle at 50% 48%,rgba(255,255,255,.08),rgba(22,18,15,.38));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;
  }
  .stage-core{
    position:relative;width:min(96vw,900px);height:min(68vh,620px);
    perspective:1200px;
    -webkit-perspective:1200px;
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
  }
  .glyph{
    position:absolute;left:50%;top:50%;
    width:70px;height:90px;margin:-45px 0 0 -35px;
    display:grid;place-items:center;
    font-family:"Noto Serif Hentaigana","Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:58px;line-height:1;color:#fff;
    text-shadow:0 3px 22px rgba(0,0,0,.26);
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    backface-visibility:visible;
    -webkit-backface-visibility:visible;
    will-change:transform,opacity,filter;
    opacity:0;
  }
  .glyph:after{
    content:"";position:absolute;inset:4px 9px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.3),transparent 68%);
    filter:blur(8px);z-index:-1;opacity:.6;
  }
  .orbitRig{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    will-change:transform;
    pointer-events:none;
  }
  .orbitRig .glyph{
    backface-visibility:visible;
    -webkit-backface-visibility:visible;
  }
  .orbitRig.spinning{
    animation:orbitSpin 3.6s linear both;
    -webkit-animation:orbitSpin 3.6s linear both;
  }
  @keyframes orbitSpin{
    0%{transform:rotateX(-9deg) rotateY(0deg) rotateZ(0deg)}
    25%{transform:rotateX(-6deg) rotateY(360deg) rotateZ(.8deg)}
    50%{transform:rotateX(-11deg) rotateY(720deg) rotateZ(-.7deg)}
    75%{transform:rotateX(-7deg) rotateY(1080deg) rotateZ(.5deg)}
    100%{transform:rotateX(-9deg) rotateY(1440deg) rotateZ(0deg)}
  }
  @-webkit-keyframes orbitSpin{
    0%{-webkit-transform:rotateX(-9deg) rotateY(0deg) rotateZ(0deg)}
    25%{-webkit-transform:rotateX(-6deg) rotateY(360deg) rotateZ(.8deg)}
    50%{-webkit-transform:rotateX(-11deg) rotateY(720deg) rotateZ(-.7deg)}
    75%{-webkit-transform:rotateX(-7deg) rotateY(1080deg) rotateZ(.5deg)}
    100%{-webkit-transform:rotateX(-9deg) rotateY(1440deg) rotateZ(0deg)}
  }
  .spark{
    position:absolute;left:50%;top:50%;
    width:6px;height:6px;margin:-3px 0 0 -3px;
    border-radius:50%;
    background:#fffdf4;
    box-shadow:
      0 0 8px 2px rgba(255,255,255,.96),
      0 0 18px 5px rgba(255,236,166,.62);
    opacity:0;pointer-events:none;
    will-change:transform,opacity,filter;
    mix-blend-mode:screen;
  }
  .spark:before,.spark:after{
    content:"";position:absolute;left:50%;top:50%;
    background:rgba(255,255,255,.92);
    transform:translate(-50%,-50%);
    border-radius:2px;
  }
  .spark:before{width:18px;height:1px}
  .spark:after{width:1px;height:18px}
  .flash{
    position:fixed;inset:-10%;z-index:40;opacity:0;
    background:radial-gradient(circle at 50% 50%,#fff 0%,#fff 18%,rgba(255,250,228,.98) 30%,rgba(255,244,192,.72) 48%,transparent 72%);
    mix-blend-mode:screen;
  }
  .stampboard{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    row-gap:var(--stamp-row-gap,clamp(2px,1vw,10px));
    column-gap:var(--stamp-col-gap,clamp(2px,1.2vw,12px));
    padding:20px;
    opacity:0;transform:translateZ(80px);
    --stamp-size:clamp(46px,8.8vw,90px);
    --stamp-row-gap:clamp(2px,1vw,10px);
    --stamp-col-gap:clamp(2px,1.2vw,12px);
  }
  .stampboard.horizontal{
    display:grid;place-content:center;place-items:center;
    max-width:min(92vw,820px);max-height:min(82vh,720px);margin-inline:auto;
  }
  .stampboard.vertical{
    display:grid;place-content:center;place-items:center;
    max-width:min(92vw,820px);max-height:min(84vh,740px);
  }
  .stamp{
    font-family:"Noto Serif Hentaigana","Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:var(--stamp-size);font-weight:600;
    color:var(--ink);opacity:0;transform:translateY(-210px) scale(2.55);position:relative;z-index:2;
    filter:blur(18px);
    text-shadow:0 1px 0 rgba(255,255,255,.7);
    will-change:transform,opacity,filter;
  }
  .stamp.hit{animation:stampHit .82s cubic-bezier(.035,.78,.07,1) forwards}
  @keyframes stampHit{
    0%{
      opacity:0;
      transform:translateY(-228px) scale(2.72);
      filter:blur(20px);
      text-shadow:0 28px 46px rgba(29,26,23,.06)
    }
    20%{
      opacity:1;
      transform:translateY(34px) scale(.62,.46);
      filter:blur(0);
      text-shadow:0 22px 34px rgba(29,26,23,.50)
    }
    36%{
      transform:translateY(-18px) scale(1.18,1.30);
      text-shadow:0 7px 14px rgba(29,26,23,.30)
    }
    52%{
      transform:translateY(11px) scale(.88,.80);
      text-shadow:0 13px 20px rgba(29,26,23,.34)
    }
    68%{
      transform:translateY(-6px) scale(1.075,1.10);
      text-shadow:0 5px 10px rgba(29,26,23,.22)
    }
    82%{
      transform:translateY(3px) scale(.975,.95);
    }
    92%{
      transform:translateY(-1px) scale(1.018,1.025);
    }
    100%{
      opacity:1;
      transform:translateY(0) scale(1);
      filter:blur(0);
      text-shadow:0 1px 0 rgba(255,255,255,.7)
    }
  }
  .impactWave{
    position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;
    border-radius:50%;pointer-events:none;z-index:1;
    border:5px solid rgba(255,244,209,.96);
    box-shadow:
      0 0 36px 11px rgba(255,229,151,.62),
      inset 0 0 28px rgba(255,255,255,.72);
    animation:impactWave .62s .13s cubic-bezier(.06,.66,.12,1) both;
  }
  @keyframes impactWave{
    0%{opacity:.98;transform:scale(.14);filter:blur(0)}
    34%{opacity:.74;transform:scale(1.36);filter:blur(.2px)}
    68%{opacity:.28;transform:scale(2.55);filter:blur(1.2px)}
    100%{opacity:0;transform:scale(4.10);filter:blur(4px)}
  }
  .stampboard:after{
    content:"";position:absolute;width:min(86%,720px);height:1px;bottom:28%;
    background:linear-gradient(90deg,transparent,rgba(70,53,32,.25),transparent);
  }
  .done-glow{
    position:absolute;left:50%;top:54%;width:55%;aspect-ratio:1;border-radius:50%;
    transform:translate(-50%,-50%) scale(.5);
    background:radial-gradient(circle,rgba(230,201,135,.24),transparent 68%);
    opacity:0;filter:blur(8px);
  }
  .skip{
    position:fixed;right:20px;bottom:20px;z-index:60;pointer-events:auto;
    border:1px solid rgba(255,255,255,.34);background:rgba(24,20,17,.52);
    color:#fff;min-height:0;padding:9px 12px;font-size:11px;border-radius:999px;
    box-shadow:none;opacity:0;
  }
  #stage.active .skip{opacity:.8}
  .resultLabel{
    position:absolute;left:50%;top:22%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.22em;color:rgba(29,26,23,.58);
    opacity:0;white-space:nowrap;
  }
  .shake{animation:shake .58s cubic-bezier(.08,.72,.10,1)}
  @keyframes shake{
    0%{transform:translate3d(0,0,0) scale(1)}
    9%{transform:translate3d(-16px,14px,0) scale(.968)}
    20%{transform:translate3d(13px,-9px,0) scale(1.026)}
    34%{transform:translate3d(-10px,8px,0) scale(.982)}
    49%{transform:translate3d(8px,-5px,0) scale(1.016)}
    64%{transform:translate3d(-5px,4px,0) scale(.991)}
    78%{transform:translate3d(3px,-2px,0) scale(1.007)}
    90%{transform:translate3d(-1px,1px,0) scale(.998)}
    100%{transform:translate3d(0,0,0) scale(1)}
  }

  /* MOTION STUDY 28: source-peel -> white ascent -> orbit -> vortex */
  .veil{
    background:transparent;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  .white-room{
    position:absolute;inset:0;z-index:0;opacity:0;overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 46%,rgba(255,255,255,1) 0%,rgba(255,255,255,.99) 34%,rgba(250,249,246,.98) 68%,rgba(238,234,226,.96) 100%);
    will-change:opacity,transform;
  }
  .white-room:before{
    content:"";position:absolute;left:50%;top:50%;
    width:130vmax;height:130vmax;border-radius:50%;
    transform:translate(-50%,-50%) scale(.42);
    background:
      repeating-conic-gradient(from 0deg,
        rgba(185,174,154,.00) 0deg,
        rgba(185,174,154,.00) 7deg,
        rgba(185,174,154,.075) 7.5deg,
        rgba(185,174,154,.00) 8.8deg);
    mask-image:radial-gradient(circle,black 0 15%,rgba(0,0,0,.76) 34%,transparent 68%);
    -webkit-mask-image:radial-gradient(circle,black 0 15%,rgba(0,0,0,.76) 34%,transparent 68%);
    opacity:.62;will-change:transform,opacity;
  }
  .white-room:after{
    content:"";position:absolute;left:50%;top:50%;
    width:min(88vw,720px);height:min(88vw,720px);border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,255,255,1) 0 8%,rgba(255,255,255,.88) 22%,rgba(230,223,210,.16) 48%,transparent 72%);
    filter:blur(7px);
  }
  .rush-lines{position:absolute;inset:0;overflow:hidden;opacity:0;will-change:opacity}
  .rush-line{
    position:absolute;top:-38vh;width:1.5px;height:32vh;border-radius:999px;
    background:linear-gradient(to bottom,transparent,rgba(156,143,122,.08) 18%,rgba(156,143,122,.34) 56%,transparent);
    filter:blur(.15px);will-change:transform,opacity;
  }
  .portal-glow{
    position:absolute;left:50%;top:50%;width:min(72vw,560px);aspect-ratio:1;border-radius:50%;
    transform:translate(-50%,-50%) scale(.4);opacity:0;
    background:radial-gradient(circle,rgba(255,255,255,.98) 0 12%,rgba(255,248,228,.72) 32%,rgba(215,199,165,.15) 54%,transparent 72%);
    filter:blur(8px);will-change:transform,opacity;
  }
  .stage-core{z-index:2}
  .glyph{
    color:var(--ink);
    text-shadow:none;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  .glyph:after{display:none}

  @media (max-width:620px){
    .composer{grid-template-columns:1fr}
    button{width:100%}
    .panel{border-radius:24px}
    .glyph{font-size:48px}
    .stage-core{height:62vh}
  }
  @media (prefers-reduced-motion:reduce){
    .mode:after{content:" / 省アニメ環境"}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><div class="seal">変</div><b>変体仮名メーカー</b></div>
    <div class="mode">MOTION STUDY 28</div>
  </header>
  <main>
    <section class="panel">
      <div class="eyebrow">HIRAGANA → HENTAIGANA</div>
      <h1>文字を、ほどく。</h1>
      <div class="lead">変換そのものは一瞬。そこへ、必要以上の儀式を足した実験版です。</div>
      <div class="composer">
        <textarea id="input" maxlength="80" rows="2" aria-label="変換する文字列">あさきゆめみし</textarea>
        <button id="convert">変換する</button>
      </div>
      <div class="options" role="group" aria-label="変換方向の選択">
        <span class="optLabel">変換</span>
        <label><input type="radio" name="conversionMode" value="forward" checked> 変体仮名にする</label>
        <label><input type="radio" name="conversionMode" value="reverse"> ひらがなに戻す</label>
      </div>
      <div class="options" role="group" aria-label="刻印方向の選択">
        <span class="optLabel">刻印方向</span>
        <label><input type="radio" name="stampDirection" value="horizontal" checked> 横</label>
        <label><input type="radio" name="stampDirection" value="vertical"> 縦</label>
        <span class="optLabel">改行可 / 80文字まで / Ctrl・⌘+Enterで変換</span>
      </div>
      <div class="hint">※ 演出検証用。縦ぴょこは白化を遅らせ、十分に加速して「ドドドドド」と最高潮になってから閃光へ突入します。表示領域に応じて軌道も自動調整します。</div>
      <div class="debug-tools" aria-label="演出デバッグ">
        <span class="debug-label">DEBUG</span>
        <button class="debug-btn" type="button" data-preset="rare">レアを出す</button>
        <button class="debug-btn" type="button" data-preset="radial">放射線</button>
        <button class="debug-btn" type="button" data-preset="radial-extreme">放射線・極</button>
        <button class="debug-btn" type="button" data-preset="rain">上から</button>
        <button class="debug-btn" type="button" data-preset="peek">かくれんぼ</button>
        <button class="debug-btn" type="button" data-preset="front-chick">前半ぴょこ</button>
        <button class="debug-btn" type="button" data-preset="front-column">前半縦同期</button>
        <button class="debug-btn" type="button" data-preset="front-column-random">前半バラバラ上下</button>
        <button class="debug-btn" type="button" data-preset="front-pinball">前半ばらピン</button>
        <div class="debug-plan" id="debugPlan">通常ランダム</div>
      </div>
    </section>
  </main>
  <footer>prototype / cinematic conversion motion</footer>
</div>
<div id="stage" aria-hidden="true">
  <div class="veil"></div>
  <div class="white-room" id="whiteRoom">
    <div class="rush-lines" id="rushLines"></div>
    <div class="portal-glow" id="portalGlow"></div>
  </div>
  <div class="stage-core" id="core">
    <div class="done-glow" id="doneGlow"></div>
    <div class="resultLabel" id="resultLabel">HENTAIGANA</div>
    <div class="stampboard" id="stampboard"></div>
  </div>
  <div class="flash" id="flash"></div>
  <button class="skip" id="skip">演出を飛ばす</button>
</div>
<script>
const firstVariant = {
  "あ":"𛀂","い":"𛀆","う":"𛀊","え":"𛀏","お":"𛀔",
  "か":"𛀗","き":"𛀣","く":"𛀫","け":"𛀲","こ":"𛀸",
  "さ":"𛀼","し":"𛁄","す":"𛁊","せ":"𛁒","そ":"𛁗",
  "た":"𛁞","ち":"𛁢","つ":"𛁩","て":"𛁮","と":"𛁷",
  "な":"𛁾","に":"𛂇","ぬ":"𛂏","ね":"𛂒","の":"𛂙",
  "は":"𛂞","ひ":"𛂩","ふ":"𛂰","へ":"𛂳","ほ":"𛂺",
  "ま":"𛃂","み":"𛃉","む":"𛃐","め":"𛃔","も":"𛃗",
  "や":"𛃝","ゆ":"𛃣","よ":"𛃧",
  "ら":"𛃭","り":"𛃱","る":"𛃸","れ":"𛃾","ろ":"𛄂",
  "わ":"𛄈","ゐ":"𛄍","ゑ":"𛄒","を":"𛄖","ん":"𛄝"
};
const reverseVariant=Object.fromEntries(
  Object.entries(firstVariant).map(([hiragana,hentaigana])=>[hentaigana,hiragana])
);

let running=false,timers=[],playToken=0,nextPreset=null;

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

const pick=list=>list[Math.floor(Math.random()*list.length)];
const pickWeighted=items=>{
  const total=items.reduce((sum,item)=>sum+item[1],0);
  let r=Math.random()*total;
  for(const [value,weight] of items){
    r-=weight;
    if(r<=0)return value;
  }
  return items[items.length-1][0];
};
const randomIndex=n=>n>0?Math.floor(Math.random()*n):-1;
const triWave=x=>(2/Math.PI)*Math.asin(Math.sin(x));

function spinProgress(spin0,omega0,omega1,elapsedMs,durationMs){
  const t=elapsedMs/1000;
  const dur=durationMs/1000;
  const accel=(omega1-omega0)/Math.max(dur,.0001);
  return {
    spin:spin0+omega0*t+.5*accel*t*t,
    omega:omega0+accel*t
  };

function frameTween(duration,onFrame,token){
  return new Promise(resolve=>{
    const start=performance.now();
    const step=now=>{
      if(token!==playToken){resolve(false);return;}
      const p=clamp((now-start)/duration);
      onFrame(p,now-start);
      if(p<1)requestAnimationFrame(step);else resolve(true);
    };
    requestAnimationFrame(step);
  });
}
function setT(el,x,y,scale=1,rot=0,rx=0,ry=0,z=0){

}
function getConversionMode(){

}
function transformText(text,mode=getConversionMode()){

function targetFontFor(mode){

function getStampDirection(){

function getLayoutLines(text,direction=getStampDirection()){
  const wrapAt=direction==="vertical"?10:18;
  const source=String(text).replace(/\r\n?/g,"\n").split("\n");
  const lines=[];
  source.forEach(line=>{
    const chars=[...line];
    if(!chars.length){
      lines.push([]);
      return;
    }
    for(let i=0;i<chars.length;i+=wrapAt)lines.push(chars.slice(i,i+wrapAt));
  });
  return lines.length?lines:[[]];
}
function setupStampBoard(text){

      rowGap="clamp(5px,1.4vw,14px)";

    }else if(maxLen<=14&&lineCount<=3){

      rowGap="clamp(3px,.9vw,9px)";
      colGap="clamp(2px,.75vw,7px)";
    }else if(maxLen<=18&&lineCount<=4){

      rowGap="clamp(2px,.55vw,6px)";
      colGap="clamp(1px,.45vw,5px)";
    }else{
      size="clamp(22px,3.9vw,40px)";
      rowGap="clamp(1px,.36vw,4px)";
      colGap="clamp(0px,.28vw,3px)";
    }
    board.style.gridTemplateRows=`repeat(${lineCount},auto)`;
    board.style.gridTemplateColumns=`repeat(${maxLen},auto)`;
  }else{
    if(maxLen<=8&&lineCount<=2){
      size="clamp(44px,8vw,82px)";
      rowGap="clamp(1px,.45vw,5px)";
      colGap="clamp(4px,1.2vw,12px)";
    }else if(maxLen<=10&&lineCount<=4){
      size="clamp(34px,6vw,60px)";
      rowGap="clamp(0px,.28vw,3px)";
      colGap="clamp(3px,.72vw,7px)";
    }else{
      size="clamp(25px,4.4vw,44px)";
      rowGap="clamp(0px,.16vw,2px)";
      colGap="clamp(1px,.42vw,4px)";
    }
    board.style.gridTemplateRows=`repeat(${maxLen},auto)`;
    board.style.gridTemplateColumns=`repeat(${lineCount},auto)`;
  }

  board.style.setProperty("--stamp-size",size);
  board.style.setProperty("--stamp-row-gap",rowGap);
  board.style.setProperty("--stamp-col-gap",colGap);
  board.dataset.glyphCount=String(glyphCount);
  return {direction,lines,maxLen,lineCount,glyphCount};
}
function populateStampBoard(text,hit=false){
  board.innerHTML="";
  const layout=setupStampBoard(text);
  const stamps=[];
  layout.lines.forEach((line,lineIndex)=>{
    line.forEach((ch,charIndex)=>{
      const s=document.createElement("div");
      s.className="stamp"+(hit?" hit":"");
      s.textContent=ch;
      if(layout.direction==="horizontal"){
        s.style.gridRow=String(lineIndex+1);
        s.style.gridColumn=String(charIndex+1);
      }else{
        s.style.gridRow=String(charIndex+1);
        s.style.gridColumn=String(layout.lineCount-lineIndex);
      }
      board.appendChild(s);
      stamps.push(s);
    });

function ensureRushLines(){

function measureOrigins(text){
  const ir=input.getBoundingClientRect();
  const cr=core.getBoundingClientRect();
  const cs=getComputedStyle(input);
  const wrap=document.createElement("div");
  Object.assign(wrap.style,{
    position:"fixed",left:ir.left+"px",top:ir.top+"px",width:ir.width+"px",height:ir.height+"px",
    boxSizing:"border-box",padding:cs.padding,whiteSpace:"pre-wrap",overflowWrap:"anywhere",
    visibility:"hidden",pointerEvents:"none",fontFamily:cs.fontFamily,fontSize:cs.fontSize,
    fontWeight:cs.fontWeight,letterSpacing:cs.letterSpacing,lineHeight:cs.lineHeight
  });
  const spans=[];
  [...text].forEach(ch=>{
    if(ch==="\n"){
      wrap.appendChild(document.createElement("br"));
    }else{
      const s=document.createElement("span");
      s.textContent=ch;
      wrap.appendChild(s);
      spans.push(s);
    }
  });
  document.body.appendChild(wrap);
  const pts=spans.map(s=>{
    const r=s.getBoundingClientRect();
    return {x:r.left+r.width/2-(cr.left+cr.width/2),y:r.top+r.height/2-(cr.top+cr.height/2)};
  });
  wrap.remove();
  return {pts,fontSize:parseFloat(cs.fontSize)||32,color:cs.color,fontFamily:cs.fontFamily};
}
function makeGlyphs(text){
  return [...text].map((ch,i)=>{
    const e=document.createElement("div");
    e.className="glyph";
    e.textContent=ch;
    e.dataset.i=i;
    core.appendChild(e);
    return e;
  });
}

function clearStage(cancel=true){

function finishInstant(text,mode=getConversionMode()){

async function play(){
  if(running)return;
  running=true;
  btn.disabled=true;
  const token=++playToken;
  const mode=getConversionMode();
  const src=(input.value.replace(/\r\n?/g,"\n").trim()||"あさきゆめみし");
  const motionSrc=src.replace(/\n/g,"");
  const out=transformText(src,mode);
  const motionOut=out.replace(/\n/g,"");
  const targetFontFamily=targetFontFor(mode);

  const metrics=measureOrigins(src);

  // Every major trajectory targets a percentage of these safe extents so phones do not lose glyphs

  const viewportH=Math.max(480,vv?vv.height:innerHeight);
  const viewportAreaScale=clamp(Math.sqrt((viewportW*viewportH)/(390*844)),1,1.34);
  const motionGlyphPx=clamp(54*viewportAreaScale,48,76);
  const edgePadX=Math.max(26,motionGlyphPx*.62);
  const edgePadY=Math.max(38,motionGlyphPx*.82);
  const motionX=Math.max(118,viewportW*.5-edgePadX);
  const motionY=Math.max(150,viewportH*.5-edgePadY);
  const stageUsage={
    x:motionX,
    y:motionY,
    orbitX:motionX*.48,
    orbitY:motionY*.32,
    pinballX:motionX*.94,
    pinballY:motionY*.88,
    dragonX:motionX*.91,
    dragonY:motionY*.82,
    radialX:motionX*.72,
    radialY:motionY*.66,
    radialExtremeX:motionX*.985,
    radialExtremeY:motionY*.965
  };

  // White-world progression is monotonic for the entire play.
  let whiteLevel=0;
  const setWhiteLevel=(value)=>{
    whiteLevel=Math.max(whiteLevel,clamp(value));
    whiteRoom.style.opacity=String(whiteLevel);
    whiteRoom.style.transform=`scale(${1+whiteLevel*.16})`;
  };

  // One stable random plan per play. Randomness is never re-rolled per frame.
  const forcedPreset=nextPreset;
  nextPreset=null;
  const forceRare=forcedPreset==="rare";

  let frontMode;
  if(forcedPreset==="front-chick")frontMode="chick";
  else if(forcedPreset==="front-column")frontMode="chick-column-sync";
  else if(forcedPreset==="front-column-random")frontMode="chick-column-random";
  else if(forcedPreset==="front-pinball")frontMode="float-pinball";
  else frontMode=pickWeighted([
    ["orbit",.31],
    ["chick",.16],
    ["chick-column-sync",.11],
    ["chick-column-random",.13],
    ["float-pinball",.19],
    ["formation",.10]
  ]);

  let flashExitMode;
  if(forcedPreset==="radial")flashExitMode="radial";
  else if(forcedPreset==="radial-extreme")flashExitMode="radial-extreme";
  else if(forcedPreset==="rain")flashExitMode="rain";
  else if(forcedPreset==="peek")flashExitMode="peek";
  else flashExitMode=pickWeighted([
    ["ash",.28],
    ["radial",.24],
    ["radial-extreme",.15],
    ["rain",.16],

  const frontUsesChick=frontMode==="chick"||frontMode==="chick-column-sync"||frontMode==="chick-column-random";
  const backChoices=frontUsesChick

  const exitMode=forceRare
    ?pick(["camera","far"])

  // Roughly three plays in ten contain a visible troublemaker.
  const rogueIndex=n>2&&(forceRare||Math.random()<.30)?randomIndex(n):-1;
  const rogueType=rogueIndex>=0?pick(["reverse","drop","wander","early"]):"none";

  const stickyIndex=n>2&&(forceRare?Math.random()<.55:Math.random()<.12)
    ?randomIndex(n)

  console.debug("[hentaigana-motion]",motionPlan);

  const verticalFront=frontMode==="chick-column-sync"||frontMode==="chick-column-random";

  const seeds=g.map((el,i)=>{

  });

  // 元の入力文字を透明にし、同じ位置の複製だけが剥がれて見えるようにする。

  input.style.caretColor="transparent";

  // 1-2) 平面剥離のあと、今回の前半パターンへ滑らかに捕捉する。
  const ringR=stageUsage.orbitX;
  const ringRY=stageUsage.orbitY;
  const phase12Duration=8900;
  const spinStartMs=3300;

  const omega2Start=Math.PI*2*.38;

        +Math.cos(timeSec*.43+s.phase)*stageUsage.y*.07
        +layer*12,
      z:Math.sin(timeSec*s.pinFreqZ+s.pinPhaseZ)*Math.min(106,stageUsage.x*.20),
      scale:(.62+.08*Math.sin(timeSec*.66+s.phase))*densityScale,
      rot:Math.sin(timeSec*.98+s.phase)*8,
      rx:Math.sin(timeSec*1.13+s.phase)*18,
      ry:Math.cos(timeSec*1.04+s.phase)*20
    };
  };
  const frontTargetPose=(i,spinValue,timeSec)=>{
    if(frontMode==="chick")return chickFrontPose(i,timeSec);
    if(frontMode==="chick-column-sync")return columnFrontPose(i,timeSec,false);
    if(frontMode==="chick-column-random")return columnFrontPose(i,timeSec,true);
    if(frontMode==="float-pinball")return scatterFrontPose(i,timeSec);
    if(frontMode==="formation")return formationFrontPose(i,timeSec);
    return orbitFrontPose(i,spinValue,timeSec);
  };

  await frameTween(phase12Duration,(p,elapsed)=>{
    const tSec=elapsed/1000;
    const globalCapture=easeInOut(clamp((elapsed-2500)/6400));
    const whiteBlend=easeInOut(clamp((elapsed-3400)/3800));

    const spinElapsed=Math.max(0,elapsed-spinStartMs);
    const spinSec=spinElapsed/1000;
    spinBase=spinElapsed>0
      ?omega2Start*spinSec+.5*spinAccel*spinSec*spinSec
      :0;

    const preWhiteBlend=verticalFront?whiteBlend*.20:whiteBlend;
    if(verticalFront){
      setWhiteLevel(clamp(.025*globalCapture+whiteBlend*.16));
    }else{
      setWhiteLevel(clamp(.08*globalCapture+whiteBlend*.70));
    }
    portalGlow.style.opacity=String(clamp((preWhiteBlend-.05)*1.22));
    portalGlow.style.transform=`translate(-50%,-50%) scale(${lerp(.42,1.25,easeOut(preWhiteBlend))})`;
    rushLines.style.opacity=String(clamp((preWhiteBlend-.04)*1.30));

    [...rushLines.children].forEach(line=>{
      const speed=parseFloat(line.dataset.speed),phase=parseFloat(line.dataset.phase);
      const travel=((preWhiteBlend*speed+phase)%1)*165-45;
      line.style.transform=`translate3d(0,${travel}vh,0) scaleY(${1+preWhiteBlend*1.95})`;
    });

    g.forEach((el,i)=>{
      const s=seeds[i];
      const peelStagger=n>16?88:n>12?108:n>8?130:158;
      const sticky=i===stickyIndex;
      const peelDelay=150+i*peelStagger+s.peelJitter+(sticky?980:0);
      const peelT=easeInOut(clamp((elapsed-peelDelay)/(sticky?390:520)));
      const localRise=easeSoft(clamp((elapsed-(peelDelay+120))/(sticky?1800:3000)));
      const localFloat=easeInOut(clamp((elapsed-(peelDelay+(sticky?520:720)))/(sticky?680:1080)));
      const captureStart=sticky?1120:1900;
      const captureDuration=sticky?1050:2400;
      const charCapture=globalCapture*easeInOut(clamp((elapsed-(peelDelay+captureStart+s.orbitLag*.45))/captureDuration));

      const lift=s.liftAmp*localRise;
      const planarDriftX=Math.sin(tSec*.88+s.phase)*2.2*(1-charCapture);
      const planarDriftY=Math.cos(tSec*1.02+s.phase)*1.1*(1-charCapture);
      const peelSkew=(i-(n-1)/2)*1.4;
      const peelX=s.sway*.18*peelT+peelSkew*peelT*.24;
      const peelY=-13*peelT;

      const floatEnvelope=.20+.80*Math.sin(Math.min(localRise,.985)*Math.PI);
      const floatStrength=floatEnvelope*localFloat;
      const freeX=s.x+planarDriftX+peelX
        +Math.sin(tSec*2.18*s.floatFreqX+s.phase)*s.sway*s.floatAmpX*1.34*floatStrength
        +Math.cos(tSec*.84+s.phase*.63)*10*s.floatAmpX*floatStrength;
      const freeY=s.y-lift+planarDriftY+peelY
        +Math.sin(tSec*3.05*s.floatFreqY+s.phase)*8.8*s.floatAmpY*floatStrength
        +Math.cos(tSec*.76+s.phase*.82)*7*s.floatAmpY*floatStrength;
      const freeZ=(
        Math.sin(tSec*2.55*s.floatFreqZ+s.phase)*34
        +Math.cos(tSec*.92+s.phase*.71)*12
      )*s.floatAmpZ*floatStrength;

      const target=frontTargetPose(i,spinBase,tSec);
      const x=lerp(freeX,target.x,charCapture);
      const y=lerp(freeY,target.y,charCapture);
      const z=lerp(freeZ,target.z,charCapture);

      const freeScale=lerp(baseScale,.92,localRise);
      const scale=lerp(freeScale,target.scale,charCapture);

      const flutterRZ=Math.sin(tSec*1.55+s.phase)*s.tilt*(1-p*.18);
      const freeRZ=flutterRZ*localFloat;
      const freeRX=(
        Math.sin(tSec*2.45+s.phase)*38
        +Math.cos(tSec*.86+s.phase*.54)*11
      )*floatStrength;
      const freeRY=(
        Math.cos(tSec*2.25+s.phase)*43
        +Math.sin(tSec*.79+s.phase*.68)*12
      )*floatStrength;

      setT(
        el,x,y,scale,
        lerp(freeRZ,target.rot,charCapture),
        lerp(freeRX,target.rx,charCapture),
        lerp(freeRY,target.ry,charCapture),
        z
      );
      el.style.opacity="1";
      el.style.textShadow=`0 0 ${8+12*charCapture}px rgba(139,125,101,${.08+.14*charCapture})`;
    });
  },token);
  if(token!==playToken)return;

  // 4) 前半の第二幕。通常系は竜巻へ、ぴょこ系は可愛い整列からピンボール暴走へ。
  const omega4Start=omega2End;
  const omega4End=Math.PI*2*31.15;
  const phase4Duration=verticalFront?4800:3100;
  let spin=spinBase;
  const phase12EndSec=phase12Duration/1000;

  const pinballPose=(i,timeSec,intensity)=>{
    const s=seeds[i];
    const start=chickFrontPose(i,timeSec);
    const speed=lerp(1.0,8.8,intensity);
    const px=triWave(timeSec*speed*s.pinFreqX+s.pinPhaseX)*stageUsage.pinballX;
    const py=triWave(timeSec*speed*1.17*s.pinFreqY+s.pinPhaseY)*stageUsage.pinballY-stageUsage.y*.02;
    const pz=triWave(timeSec*speed*.67*s.pinFreqZ+s.pinPhaseZ)*Math.min(138,stageUsage.x*.23);
    return {
      x:lerp(start.x,px,intensity),
      y:lerp(start.y,py,intensity),
      z:lerp(start.z,pz,intensity),
      scale:lerp(start.scale,(.56+Math.abs(triWave(timeSec*.9+s.phase))*.16)*densityScale,intensity),
      rot:lerp(start.rot,triWave(timeSec*speed*.61+s.pinPhaseX)*34,intensity),
      rx:lerp(start.rx,triWave(timeSec*speed*.83+s.pinPhaseY)*38,intensity),
      ry:lerp(start.ry,triWave(timeSec*speed*.77+s.pinPhaseZ)*46,intensity)
    };
  };

  const columnBouncePose=(i,timeSec,intensity,independent=false)=>{
    const s=seeds[i];
    const phase=independent?s.verticalPhase:0;
    const baseFreq=independent?s.verticalFreq:5.15;
    const fury=easeInOut(clamp(intensity));
    const finalFreq=independent
      ?34+s.verticalFreq*1.65
      :45.5;
    const frequency=lerp(baseFreq,finalFreq,Math.pow(fury,1.18));

    const baseAmp=Math.min(stageUsage.y*.16,44);
    const ampPersonality=independent?clamp(s.verticalAmpMul,.82,1.12):1;
    const maxAmp=stageUsage.y*(independent?.78:.72)*ampPersonality;
    const amp=lerp(baseAmp,maxAmp,Math.pow(fury,.88));

    // At high intensity the motion becomes a rapid vertical pounding rather than a gentle bob.
    const raw=Math.sin(timeSec*frequency+phase);
    const wave=lerp(raw,Math.sign(raw)*Math.pow(Math.abs(raw),.76),fury*.72);
    const impact=Math.pow(Math.abs(wave),7)*fury;

    return {
      x:(i-(n-1)/2)*frontSpacing,
      y:-stageUsage.y*.13+wave*amp,
      z:Math.sin(timeSec*frequency*.31+phase)*Math.min(42,stageUsage.y*.10)*fury,
      scale:.72*densityScale*(1+impact*.065),
      rot:wave*lerp(2.4,independent?12:9.5,fury),
      rx:-impact*lerp(4,24,fury),
      ry:Math.sin(timeSec*frequency*.23+phase)*7*fury,
      impact
    };
  };

  const scatterPinballPose=(i,timeSec,intensity)=>{
    const s=seeds[i];
    const start=scatterFrontPose(i,timeSec);
    const speed=lerp(.78,10.4,intensity);
    const px=triWave(timeSec*speed*s.pinFreqX+s.pinPhaseX)*stageUsage.pinballX;
    const py=triWave(timeSec*speed*1.13*s.pinFreqY+s.pinPhaseY)*stageUsage.pinballY-stageUsage.y*.02;
    const pz=triWave(timeSec*speed*.63*s.pinFreqZ+s.pinPhaseZ)*Math.min(148,stageUsage.x*.25);
    return {
      x:lerp(start.x,px,intensity),
      y:lerp(start.y,py,intensity),
      z:lerp(start.z,pz,intensity),
      scale:lerp(start.scale,(.53+Math.abs(triWave(timeSec*.82+s.phase))*.17)*densityScale,intensity),
      rot:lerp(start.rot,triWave(timeSec*speed*.57+s.pinPhaseX)*42,intensity),
      rx:lerp(start.rx,triWave(timeSec*speed*.78+s.pinPhaseY)*46,intensity),
      ry:lerp(start.ry,triWave(timeSec*speed*.74+s.pinPhaseZ)*52,intensity)
    };
  };

  await frameTween(phase4Duration,(p,elapsed)=>{

      const violence=easeInOut(clamp((p-.06)/.94));

        el.style.opacity="1";
        el.style.filter=`brightness(${1+light*.45})`;
      });
      setWhiteLevel(lerp(.70,.90,light));
      portalGlow.style.opacity=String(lerp(.20,.78,light));
      portalGlow.style.transform=`translate(-50%,-50%) scale(${lerp(.92,.58,light)})`;
      rushLines.style.opacity=String(lerp(.10,.64,violence));
      [...rushLines.children].forEach(line=>{
        const speed=parseFloat(line.dataset.speed),phase=parseFloat(line.dataset.phase);

      const overdrive=easeInOut(clamp((p-.50)/.30));
      const light=easeInOut(clamp((p-.76)/.24));
      const drive=clamp(intensity+overdrive*.22);

        const pose=columnBouncePose(i,tSec,drive,independent);
        setT(el,pose.x,pose.y,pose.scale,pose.rot,pose.rx,pose.ry,pose.z);
        el.style.opacity="1";
        el.style.filter=`brightness(${1+pose.impact*.34+light*.30})`;
      });

      setWhiteLevel(lerp(.18,.84,light));
      portalGlow.style.opacity=String(lerp(.06,.78,light));
      portalGlow.style.transform=`translate(-50%,-50%) scale(${lerp(.58,.24,light)})`;
      rushLines.style.opacity=String(lerp(.10,.74,Math.max(overdrive,light)));

      [...rushLines.children].forEach(line=>{
        const speed=parseFloat(line.dataset.speed),phase=parseFloat(line.dataset.phase);
        const travel=((drive*speed*8.5+phase)%1)*176-50;
        line.style.transform=`translate3d(0,${travel}vh,0) scaleY(${1.35+drive*3.0})`;
      });
      return;
    }

    if(frontMode==="float-pinball"){
      const intensity=easeInOut(clamp((p-.10)/.90));
      const light=easeInOut(clamp((p-.32)/.68));
      g.forEach((el,i)=>{
        const pose=scatterPinballPose(i,tSec,intensity);
        setT(el,pose.x,pose.y,pose.scale,pose.rot,pose.rx,pose.ry,pose.z);
        el.style.opacity="1";
        el.style.filter=`brightness(${1+light*.42})`;
      });
      setWhiteLevel(lerp(.70,.90,light));
      portalGlow.style.opacity=String(lerp(.14,.72,light));
      rushLines.style.opacity=String(lerp(.08,.66,intensity));
      [...rushLines.children].forEach(line=>{
        const speed=parseFloat(line.dataset.speed),phase=parseFloat(line.dataset.phase);
        const travel=((intensity*speed*6.8+phase)%1)*174-48;
        line.style.transform=`translate3d(0,${travel}vh,0) scaleY(${1.4+intensity*2.6})`;
      });
      return;
    }

    const prog=spinProgress(spinBase,omega4Start,omega4End,elapsed,phase4Duration);
    spin=prog.spin;
    const radius=lerp(ringR,24,e);
    const ellipse=lerp(ringRY,10,e);
    const baseY=lerp(-104,-86,e);
    const vertical=lerp(0,196,e);
    const axisAmp=lerp(0,16,e);
    const axisTwist=Math.sin(spin*.18)*axisAmp;

    setWhiteLevel(lerp(.70,.90,e));
    portalGlow.style.opacity=String(lerp(.98,.92,e));
    portalGlow.style.transform=`translate(-50%,-50%) scale(${lerp(1.18,.82,e)})`;
    rushLines.style.opacity=String(lerp(.92,1,e));

    [...rushLines.children].forEach(line=>{
      const speed=parseFloat(line.dataset.speed),phase=parseFloat(line.dataset.phase);
      const travel=((e*speed*7.8+phase)%1)*172-48;
      line.style.transform=`translate3d(0,${travel}vh,0) scaleY(${2.15+e*1.55})`;
    });

    g.forEach((el,i)=>{
      const angle=baseAngles[i]+spin;
      const depth=(Math.sin(angle)+1)/2;
      const layer=(i-(n-1)/2)/(Math.max(1,n-1)/2);
      const start=frontMode==="formation"
        ?formationFrontPose(i,tSec)
        :orbitFrontPose(i,spin,tSec);

      const axisX=Math.sin(layer*1.8+spin*.22)*axisAmp+axisTwist*.12;
      const axisY=Math.cos(layer*1.25+spin*.18)*axisAmp*.16;
      const targetX=axisX+Math.cos(angle)*radius;

      const targetScale=(.58+depth*.42)*densityScale;
      const targetRot=(spin*180/Math.PI)*(i%2?-.24:.24)+Math.sin(angle)*9;
      const targetRx=-14+Math.cos(angle+layer*.4)*17;
      const targetRy=11+Math.sin(angle-layer*.3)*20;

      const blend=frontMode==="formation"?e:1;
      setT(
        el,
        lerp(start.x,targetX,blend),
        lerp(start.y,targetY,blend),
        lerp(start.scale,targetScale,blend),
        lerp(start.rot,targetRot,blend),
        lerp(start.rx,targetRx,blend),
        lerp(start.ry,targetRy,blend),
        lerp(start.z,targetZ,blend)
      );
      el.style.opacity=String(.68+depth*.32);
      el.style.filter="none";
    });
  },token);
  if(token!==playToken)return;

  const spinVortexEnd=spin;

  // 5) どの前半からでも、動きを止めずに中心核へ圧縮して「誕生の閃光」を作る。
  const omega5Start=omega4End;
  const omega5End=Math.PI*2*34.0;
  const phase5Duration=1540;

  const sparkleCount=Math.min(38,Math.max(20,n*3));
  const sparkleSeeds=Array.from({length:sparkleCount},(_,i)=>({
    el:(()=>{
      const spark=document.createElement("div");
      spark.className="spark";
      core.appendChild(spark);
      return spark;
    })(),
    angle:(i/sparkleCount)*Math.PI*2+Math.random()*.45,
    radius:34+Math.random()*92,
    y:-72+Math.random()*144,
    z:-24+Math.random()*70,
    phase:Math.random()*Math.PI*2,
    speed:(Math.random()<.5?-1:1)*(.35+Math.random()*.45),
    pulse:.75+Math.random()*1.4,
    size:.55+Math.random()*.95
  }));

  await frameTween(phase5Duration,(p,elapsed)=>{
    const e=easeInOut(p);
    const prog=spinProgress(spinVortexEnd,omega5Start,omega5End,elapsed,phase5Duration);
    if(frontMode==="orbit"||frontMode==="formation")spin=prog.spin;

    const squeeze=easeInOut(clamp(
      verticalFront
        ?(p-.34)/.50
        :(p-.12)/.62
    ));
    const coreHold=easeInOut(clamp(
      verticalFront
        ?(p-.78)/.14
        :(p-.72)/.18
    ));
    const flashRise=easeOut(clamp(
      verticalFront
        ?(p-.48)/.24
        :(p-.20)/.28
    ));
    const flashHold=1-.02*easeInOut(clamp((p-.92)/.08));
    const peak=flashRise*flashHold;

    // Common flash ritual. Vertical-pogo modes are allowed to pound at full force
    // for a while before the white world finally overtakes them.
    const quakeRise=easeInOut(clamp(
      verticalFront
        ?(p-.30)/.58
        :(p-.06)/.78
    ));
    const quakeAmp=lerp(0,11.5,quakeRise);
    const qx=(Math.sin(elapsed*.145)+Math.sin(elapsed*.317)*.55)*quakeAmp;
    const qy=(Math.cos(elapsed*.181)+Math.sin(elapsed*.271)*.48)*quakeAmp*.78;
    stage.style.transform=`translate3d(${qx}px,${qy}px,0) scale(${1+.010*quakeRise})`;

    const whiteRamp=easeInOut(clamp(
      verticalFront
        ?(p-.38)/.54
        :(p-.05)/.82
    ));

    rushLines.style.opacity=String(lerp(verticalFront?.54:.62,.96,quakeRise));

    portalGlow.style.opacity=String(.86+peak*.14);
    portalGlow.style.transform=`translate(-50%,-50%) scale(${lerp(1.02,.12,squeeze)})`;
    whiteRoom.style.transform=`scale(${lerp(1.10,1.22,squeeze)})`;

      }else if(frontMode==="chick-column-sync"){

          ry:11+Math.sin(angle-layer*.3)*20
        };
      }

      const nucleusY=-8+layer*.25;
      const nucleusZ=(i%2?-.5:.5)*.8;
      const nucleusScale=.20*densityScale;

      setT(
        el,
        lerp(start.x,nucleusX,squeeze),
        lerp(start.y,nucleusY,squeeze),
        lerp(start.scale,nucleusScale,squeeze),
        lerp(start.rot,0,squeeze),
        lerp(start.rx,0,squeeze),
        lerp(start.ry,0,squeeze),
        lerp(start.z,nucleusZ,squeeze)
      );
      el.style.opacity=String(lerp(.88,.98,coreHold));
      el.style.filter=`brightness(${1+peak*4.4+coreHold*2.2}) blur(${peak*1.6+coreHold*1.6}px)`;

      if(p>.43&&!el.dataset.converted){
        el.textContent=[...motionOut][i]||el.textContent;
        el.style.fontFamily=targetFontFamily;
        el.dataset.converted="1";
      }
    });

    const sparkBirth=easeOut(clamp((p-.58)/.42));
    sparkleSeeds.forEach(s=>{
      const tt=elapsed/1000;
      const ang=s.angle+tt*s.speed;
      const r=lerp(5,7,sparkBirth)*(1-squeeze*.72);
      const pulse=.45+.55*Math.sin(tt*5.2*s.pulse+s.phase)**2;
      setT(
        s.el,
        Math.cos(ang)*r,
        -8+Math.sin(tt*1.6+s.phase)*2*(1-squeeze),
        s.size*(.45+.55*sparkBirth)*pulse,
        0,0,0,
        lerp(8,s.z*.08,sparkBirth)*(1-squeeze*.70)
      );
      s.el.style.opacity=String(sparkBirth*(.45+.55*pulse));
      s.el.style.filter=`blur(${(1-pulse)*.6}px)`;
    });
  },token);
  if(token!==playToken)return;

  const spinFlashEnd=spin;

  // 6) 閃光そのものから次の運動を生む。白の中ですでに移動を開始する。
  const phase6Duration=flashExitMode==="peek"?3600:(flashExitMode==="rain"?2550:(flashExitMode==="radial-extreme"?2450:2350));
  const hiddenPoseMs=70;
  const flashOpenDelayMs=flashExitMode==="rain"||flashExitMode==="peek"?210:105;
  const flashOpenMs=flashExitMode==="radial-extreme"?390:(flashExitMode==="radial"?460:620);
  const phase7Duration=flashExitMode==="peek"?2100:1850;

  const ashPose=(i,timeMs)=>{
    const s=seeds[i];
    const layer=(i-(n-1)/2)/(Math.max(1,n-1)/2);
    const tt=timeMs/1000;
    const scatterBase=stageUsage.x*.67;
    const anchorAngle=baseAngles[i]+s.phase*.18+s.scatterAngleJitter;
    const anchorR=scatterBase*s.scatterRadiusMul+Math.abs(layer)*20;
    const fall=(16*s.fallSpeedMul)*tt+24*s.fallSpeedMul*(1-Math.exp(-tt*1.15));
    return {
      x:Math.cos(anchorAngle)*anchorR+layer*12+s.ashDriftX
        +Math.sin(tt*(.88+s.floatFreqX*.24)+s.phase*1.35)*(29*s.floatAmpX)
        +Math.sin(tt*.43+s.phase*.62)*11,
      y:-30+Math.sin(anchorAngle)*anchorR*.50+layer*22+fall
        +Math.cos(tt*(.78+s.floatFreqY*.20)+s.phase*1.12)*(15*s.floatAmpY)
        +Math.sin(tt*.37+s.phase)*8,
      z:Math.sin(anchorAngle*1.31+s.phase)*Math.min(112,anchorR*.46)+s.ashDriftZ
        +Math.sin(tt*(.96+s.floatFreqZ*.22)+s.phase)*(18*s.floatAmpZ)
        +Math.cos(tt*.47+s.phase*.74)*9,
      rot:Math.sin(tt*1.18+s.phase)*6.4,
      rx:-3+Math.sin(tt*1.34+s.phase)*15,
      ry:Math.cos(tt*1.24+s.phase)*17,
      opacity:.92
    };
  };

  const radialPose=(i,timeMs)=>{
    const s=seeds[i];
    const tt=Math.max(0,timeMs)/1000;
    const extreme=flashExitMode==="radial-extreme";
    const angle=baseAngles[i]+s.scatterAngleJitter+s.phase*.08;
    const extent=.88+Math.min(.14,Math.max(-.08,(s.scatterRadiusMul-1)*.34));
    const targetX=(extreme?stageUsage.radialExtremeX:stageUsage.radialX)*extent;
    const targetY=(extreme?stageUsage.radialExtremeY:stageUsage.radialY)*extent;
    const launch=1-Math.exp(-tt*(extreme?8.8:5.8));
    const fall=(extreme?5:10)*s.fallSpeedMul*tt;
    return {
      x:Math.cos(angle)*targetX*launch
        +Math.sin(tt*.82+s.phase)*(extreme?8:16)
        +s.ashDriftX*.55,
      y:-8+Math.sin(angle)*targetY*launch
        +fall
        +Math.cos(tt*.74+s.phase)*(extreme?6:11),
      z:Math.sin(angle*1.43+s.phase)*Math.min(150,stageUsage.x*.27)*launch
        +Math.sin(tt*.91+s.phase)*16,
      rot:Math.sin(tt*1.05+s.phase)*(extreme?10:7),
      rx:Math.sin(tt*1.22+s.phase)*(extreme?21:15),
      ry:Math.cos(tt*1.16+s.phase)*(extreme?24:18),
      opacity:.95
    };
  };
  const rainPose=(i,timeMs)=>{
    const s=seeds[i];
    const delay=130+(i%5)*115+(s.phase/(Math.PI*2))*170;
    const local=Math.max(0,timeMs-delay);
    const tt=local/1000;
    const appear=easeOut(clamp(local/260));
    const xBase=(i/(Math.max(1,n-1))-.5)*Math.min(innerWidth*.78,620)
      +s.ashDriftX*2.2;
    const fall=Math.min(innerHeight*.88,520)*(1-Math.exp(-tt*.72));
    return {
      x:xBase+Math.sin(tt*1.18+s.phase)*26,
      y:-Math.min(innerHeight*.55,360)+fall,
      z:s.ashDriftZ*2+Math.sin(tt*.86+s.phase)*34,
      rot:Math.sin(tt*1.6+s.phase)*10,
      rx:Math.sin(tt*1.34+s.phase)*22,
      ry:Math.cos(tt*1.22+s.phase)*20,
      opacity:appear*.94
    };
  };

  const peekPose=(i,timeMs)=>{
    const s=seeds[i];
    const delay=240+(i%6)*210+(s.phase/(Math.PI*2))*280;
    const local=Math.max(0,timeMs-delay);
    const tt=local/1000;
    const appear=easeInOut(clamp(local/520));
    const enterBase=easeInOut(clamp(local/1750));
    const side=i%4;

    const edgeX=side===0
      ?-Math.min(innerWidth*.51,440)
      :side===1
        ?Math.min(innerWidth*.51,440)
        :(i/(Math.max(1,n-1))-.5)*innerWidth*.72;
    const edgeY=side===2
      ?-Math.min(innerHeight*.44,300)
      :side===3
        ?Math.min(innerHeight*.44,300)
        :(i%5-2)*48;

    const targetX=(i-(n-1)/2)*Math.min(42,Math.max(10,innerWidth*.68/Math.max(1,n)))+Math.sin(s.phase)*15;
    const targetY=-8+Math.cos(s.phase)*38;

    // A small shy retreat before committing to the entrance.
    const shyEnvelope=(1-enterBase)*Math.sin(clamp(local/1500)*Math.PI*3);
    const shy=shyEnvelope*18;
    let x=lerp(edgeX,targetX,enterBase);
    let y=lerp(edgeY,targetY,enterBase);
    if(side===0)x-=shy;
    else if(side===1)x+=shy;
    else if(side===2)y-=shy;
    else y+=shy;

    return {
      x,y,
      z:lerp(-42,Math.sin(s.phase)*38,enterBase),
      rot:Math.sin(tt*1.55+s.phase)*3.2,
      rx:Math.sin(tt*1.12+s.phase)*6,
      ry:Math.cos(tt*1.06+s.phase)*8,
      opacity:appear*.96
    };
  };
  const postFlashPose=(i,timeMs)=>{
    if(flashExitMode==="radial"||flashExitMode==="radial-extreme")return radialPose(i,timeMs);
    if(flashExitMode==="rain")return rainPose(i,timeMs);
    if(flashExitMode==="peek")return peekPose(i,timeMs);
    return ashPose(i,timeMs);
  };

  const postFlashSparkPose=(s,timeMs)=>{
    const tt=Math.max(0,timeMs)/1000;
    const pulse=.45+.55*Math.sin(tt*5.0*s.pulse+s.phase)**2;
    const r=stageUsage.x*(.58+Math.min(.28,s.radius/420));
    let x=Math.cos(s.angle)*r+Math.sin(tt*.91+s.phase)*22;
    let y=-18+Math.sin(s.angle)*r*.56+14*tt+Math.sin(tt*1.03+s.phase)*12;
    let z=Math.sin(s.angle*1.47+s.phase)*Math.min(138,r*.50)+Math.cos(tt*.83+s.phase)*22;
    if(flashExitMode==="radial"||flashExitMode==="radial-extreme"){
      const extreme=flashExitMode==="radial-extreme";
      const launch=1-Math.exp(-tt*(extreme?8.4:5.5));
      x=Math.cos(s.angle)*(extreme?stageUsage.radialExtremeX:stageUsage.radialX)*launch;
      y=-8+Math.sin(s.angle)*(extreme?stageUsage.radialExtremeY:stageUsage.radialY)*launch+8*tt;
      z=Math.sin(s.angle*1.3+s.phase)*shot*.33;
    }
    return {x,y,z,pulse};
  };

  await frameTween(phase6Duration,(p,elapsed)=>{
    const visibleTime=Math.max(0,elapsed-hiddenPoseMs);
    const flashOpen=easeInOut(clamp((visibleTime-flashOpenDelayMs)/flashOpenMs));
    const soften=easeInOut(clamp((visibleTime-100)/1850));
    const blastGlow=1-easeInOut(clamp((visibleTime-70)/520));
    const quakeFade=1-easeOut(clamp(visibleTime/760));
    const qAmp=11.5*quakeFade;
    const qx=(Math.sin(elapsed*.155)+Math.sin(elapsed*.337)*.52)*qAmp;
    const qy=(Math.cos(elapsed*.193)+Math.sin(elapsed*.283)*.45)*qAmp*.78;
    stage.style.transform=quakeFade>.001
      ?`translate3d(${qx}px,${qy}px,0) scale(${1+.010*quakeFade})`
      :"none";

    flash.style.opacity=String(
      elapsed<hiddenPoseMs
        ?.985
        :Math.min(.985,Math.max((1-flashOpen)*.985,blastGlow*.76))
    );
    setWhiteLevel(1);
    portalGlow.style.opacity=String(lerp(1,.16,soften));
    portalGlow.style.transform=`translate(-50%,-50%) scale(${lerp(.10,1.52,easeOut(clamp(visibleTime/260)))})`;
    rushLines.style.opacity=String(lerp(.98,.10,soften));

    g.forEach((el,i)=>{
      const layer=(i-(n-1)/2)/(Math.max(1,n-1)/2);
      const startX=(i-(n-1)/2)*.08;
      const startY=-8+layer*.25;
      const startZ=(i%2?-.5:.5)*.8;
      const startScale=.20*densityScale;
      const pose=postFlashPose(i,visibleTime);

      // Ash/radial visibly burst out of the light. Rain/peek relocate while the glare still hides them.
      const burst=flashExitMode==="ash"
        ?easeOut(clamp(visibleTime/190))
        :(flashExitMode==="radial"||flashExitMode==="radial-extreme")
          ?easeOut(clamp(visibleTime/(flashExitMode==="radial-extreme"?105:150)))
          :easeOut(clamp((visibleTime-80)/210));
      const hiddenTeleport=flashExitMode==="rain"||flashExitMode==="peek";
      const mix=hiddenTeleport?easeOut(clamp((visibleTime-40)/150)):burst;
      const depth=.5+.5*Math.sin(seeds[i].phase+visibleTime*.0009);
      const targetScale=(.55+depth*.15)*densityScale;

      setT(
        el,
        lerp(startX,pose.x,mix),
        lerp(startY,pose.y,mix),
        lerp(startScale,targetScale,mix),
        pose.rot*mix,
        pose.rx*mix,
        pose.ry*mix,
        lerp(startZ,pose.z,mix)
      );
      el.style.opacity=String(clamp(pose.opacity*mix));
      const radialStreak=flashExitMode==="radial-extreme"
        ?1-easeOut(clamp(visibleTime/430))
        :0;
      el.style.filter=radialStreak>0
        ?`brightness(${1+radialStreak*1.4}) blur(${radialStreak*1.3}px)`
        :"none";
    });

    sparkleSeeds.forEach(s=>{
      const pose=postFlashSparkPose(s,visibleTime);
      const mix=easeOut(clamp(visibleTime/180));
      setT(s.el,pose.x*mix,lerp(-8,pose.y,mix),s.size*(.78+.70*pose.pulse),0,0,0,pose.z*mix);
      s.el.style.opacity=String(mix*(.50+.46*pose.pulse));
      s.el.style.filter=`blur(${(1-pose.pulse)*.6}px)`;
    });
  },token);
  if(token!==playToken)return;
  flash.style.opacity="0";
  stage.style.transform="none";

  // 7) 閃光後の固有運動をそのまま継続。ここではまだ無理に中心へ集めない。
  await frameTween(phase7Duration,(p,elapsed)=>{
    const postTime=phase6Duration+elapsed;
    g.forEach((el,i)=>{
      const pose=postFlashPose(i,postTime);
      const depth=.5+.5*Math.sin(seeds[i].phase+postTime*.0009);
      const scale=(.55+depth*.15)*densityScale;
      setT(el,pose.x,pose.y,scale,pose.rot,pose.rx,pose.ry,pose.z);
      el.style.opacity=String(clamp(pose.opacity));
      el.style.filter="none";
    });

    sparkleSeeds.forEach(s=>{
      const pose=postFlashSparkPose(s,postTime);
      setT(s.el,pose.x,pose.y,s.size*(.70+.58*pose.pulse),0,0,0,pose.z);
      s.el.style.opacity=String(.44+.48*pose.pulse);
      s.el.style.filter=`blur(${(1-pose.pulse)*.7}px)`;
    });

    setWhiteLevel(1);
    portalGlow.style.opacity=String(lerp(.16,.11,easeInOut(p)));
    rushLines.style.opacity=String(lerp(.10,.07,easeInOut(p)));
  },token);
  if(token!==playToken)return;

  // 8) 漂流から今回の「集団演技」へ。円・円環・龍・ぴょこぴょこ整列を毎回ひとつ選ぶ。
  const phase8Duration=3300;
  const petalBaseTime=phase6Duration+phase7Duration;
  const groupOmegaStart=Math.PI*2*.035;
  const groupOmegaEnd=ensembleMode==="chick"
    ? Math.PI*2*.13
    : Math.PI*2*(ensembleMode==="dragon"?1.10:.48);
  const groupAccel=(groupOmegaEnd-groupOmegaStart)/(phase8Duration/1000);
  const groupR=stageUsage.x*.46;
  const groupRY=stageUsage.y*.35;
  const groupVertical=28;
  const groupCenterAmpX=7;
  const groupCenterAmpY=6;
  const chickSpacing=Math.min(80,Math.max(9,(stageUsage.x*1.45)/Math.max(1,n-1)));
  let groupTheta=0;

  const ensemblePose=(i,theta,timeSec)=>{
    const s=seeds[i];
    const layer=(i-(n-1)/2)/(Math.max(1,n-1)/2);
    const angle=baseAngles[i]+theta;
    const depth=(Math.sin(angle)+1)/2;

    if(ensembleMode==="circle"){
      return {
        x:Math.cos(angle)*groupR,
        y:-10+Math.sin(angle)*groupR*.72,
        z:Math.sin(timeSec*.83+s.phase)*8,
        scale:(.58+depth*.08)*densityScale,
        rot:Math.sin(angle)*5,
        rx:Math.sin(timeSec*.91+s.phase)*5,
        ry:Math.cos(timeSec*.88+s.phase)*7
      };
    }

    if(ensembleMode==="ring"){
      return {
        x:Math.cos(angle)*groupR,
        y:-12+Math.sin(angle)*groupRY,
        z:Math.sin(angle)*92,
        scale:(.55+depth*.28)*densityScale,
        rot:Math.sin(angle)*7,
        rx:-8+Math.cos(angle)*14,
        ry:Math.sin(angle)*18
      };
    }

    if(ensembleMode==="dragon"){
      const trail=layer*.78;
      const t=theta-trail;
      const ampX=stageUsage.dragonX;
      const ampY=stageUsage.dragonY;
      return {
        x:Math.sin(t)*ampX
          +Math.sin(t*3.4+s.phase)*Math.min(34,stageUsage.x*.07)
          +Math.cos(t*5.2+s.phase*.7)*Math.min(16,stageUsage.x*.035),
        y:-6+Math.sin(t*2.22+.52)*ampY
          +Math.cos(t*4.05+s.phase)*Math.min(28,stageUsage.y*.08),
        z:Math.cos(t*1.31)*108+Math.sin(t*3.0+s.phase)*28,
        scale:(.54+(.5+.5*Math.sin(t))*.30)*densityScale,
        rot:Math.cos(t*1.4)*16,
        rx:-12+Math.cos(t*1.7)*30,
        ry:Math.sin(t*1.35)*38
      };
    }

    // "Chick" mode: no grand orbit. Characters hop one after another into a neat row.
    const hopPhase=timeSec*8.8-i*.62;
    const hop=Math.pow(Math.max(0,Math.sin(hopPhase)),1.72);
    return {
      x:(i-(n-1)/2)*chickSpacing,
      y:26-hop*42+Math.sin(timeSec*1.2+s.phase)*2.5,
      z:Math.sin(hopPhase*.45)*8,
      scale:.68*densityScale*(1+hop*.05),
      rot:Math.sin(hopPhase)*4.5,
      rx:-hop*8,
      ry:Math.cos(hopPhase*.55)*5
    };
  };

  await frameTween(phase8Duration,(p,elapsed)=>{
    const tSec=elapsed/1000;
    groupTheta=groupOmegaStart*tSec+.5*groupAccel*tSec*tSec;
    const groupBlend=easeInOut(clamp((p-.02)/.98));
    const time=petalBaseTime+elapsed;

    g.forEach((el,i)=>{
      const s=seeds[i];
      const petal=postFlashPose(i,time);
      let gatherStart=.02+s.gatherLag;
      if(i===rogueIndex&&rogueType==="early")gatherStart=Math.max(0,gatherStart-.20);
      const charBlend=easeInOut(clamp((p-gatherStart)/Math.max(.001,1-gatherStart)));
      const pose=ensemblePose(i,groupTheta,tSec);

      let extraX=0,extraY=0,extraZ=0;
      const rogueBeat=Math.sin(Math.PI*clamp((p-.28)/.50));
      if(i===rogueIndex){
        if(rogueType==="reverse"){
          extraX=-Math.sin(groupTheta*1.7+s.whimPhase)*110*rogueBeat;
          extraY=Math.cos(groupTheta*1.2+s.whimPhase)*26*rogueBeat;
        }else if(rogueType==="drop"){
          extraY=126*rogueBeat;
          extraX=s.whimSign*20*rogueBeat;
        }else if(rogueType==="wander"){
          extraX=s.whimSign*120*rogueBeat;
          extraZ=80*Math.sin(p*Math.PI*2)*rogueBeat;
        }
      }

      const x=lerp(petal.x,pose.x+extraX,charBlend);
      const y=lerp(petal.y,pose.y+extraY,charBlend);
      const z=lerp(petal.z,pose.z+extraZ,charBlend);

      const petalDepth=.5+.5*Math.sin(s.phase+time*.0009);
      const petalScale=(.55+petalDepth*.15)*densityScale;
      const scale=lerp(petalScale,pose.scale,charBlend);
      const rot=lerp(petal.rot,pose.rot,charBlend);
      const rx=lerp(petal.rx,pose.rx,charBlend);
      const ry=lerp(petal.ry,pose.ry,charBlend);

      setT(el,x,y,scale,rot,rx,ry,z);
      el.style.opacity=String(lerp(.92,.98,charBlend));
      el.style.filter="none";
    });

    sparkleSeeds.forEach((s,i)=>{
      const petal=postFlashSparkPose(s,time);
      const fakeIndex=Math.min(n-1,Math.floor((i/sparkleCount)*Math.max(1,n)));
      const pose=ensemblePose(fakeIndex,groupTheta,tSec);
      const spread=18+(i%5)*4;
      const x=lerp(petal.x,pose.x+Math.sin(s.angle)*spread,groupBlend);
      const y=lerp(petal.y,pose.y+Math.cos(s.angle)*spread*.55,groupBlend);
      const z=lerp(petal.z,pose.z+Math.sin(s.phase)*28,groupBlend);
      setT(s.el,x,y,s.size*(.66+.54*petal.pulse),0,0,0,z);
      s.el.style.opacity=String((.42+.48*petal.pulse)*lerp(1,.82,groupBlend));
    });

    setWhiteLevel(1);
    portalGlow.style.opacity=String(lerp(.11,.24,groupBlend));
    rushLines.style.opacity=String(lerp(.07,.20,groupBlend));
  },token);
  if(token!==playToken)return;

  // 9) 今回の退場パターン。集団演技の終端からそのまま連続し、最後だけ大きく加速する。
  const phase9Duration=exitMode==="camera"?2500:(exitMode==="far"?2250:2050);
  const finalOmegaStart=groupOmegaEnd;
  const finalOmegaEnd=ensembleMode==="chick"
    ? Math.PI*2*.85
    : Math.PI*2*(ensembleMode==="dragon"?9.0:10.2);
  const finalAccel=(finalOmegaEnd-finalOmegaStart)/(phase9Duration/1000);

  await frameTween(phase9Duration,(p,elapsed)=>{
    const tSec=elapsed/1000;
    const theta=groupTheta+finalOmegaStart*tSec+.5*finalAccel*tSec*tSec;
    const sceneTime=phase8Duration/1000+tSec*1.35;

    g.forEach((el,i)=>{
      const s=seeds[i];
      const pose=ensemblePose(i,theta,sceneTime);
      const order=n<=1?0:i/(n-1);

      // Small stagger keeps the group organic. The far-away late chaser intentionally waits much longer.
      let start=.20+order*.10+s.rushLag*.18;
      if(i===lateChaserIndex)start=.64;
      const depart=easeIn(clamp((p-start)/Math.max(.001,1-start)));

      let tx=pose.x,ty=pose.y,tz=pose.z,targetScale=pose.scale,targetOpacity=1;
      const dirAngle=baseAngles[i]+s.scatterAngleJitter;

      if(exitMode==="up"){
        tx=pose.x*.70+s.ashDriftX*2;
        ty=-innerHeight*.72-(i%4)*28;
        tz=120+s.ashDriftZ*2;
        targetScale=.36*densityScale;
        targetOpacity=0;
      }else if(exitMode==="down"){
        tx=pose.x*.68+s.ashDriftX*2;
        ty=innerHeight*.74+(i%4)*26;
        tz=80+s.ashDriftZ*2;
        targetScale=.38*densityScale;
        targetOpacity=0;
      }else if(exitMode==="far"){
        tx=pose.x*.16;
        ty=pose.y*.16-16;
        tz=-1250;
        targetScale=.07*densityScale;
        targetOpacity=0;
      }else if(exitMode==="burst"){
        tx=Math.cos(dirAngle)*innerWidth*.82;
        ty=Math.sin(dirAngle)*innerHeight*.70;
        tz=s.ashDriftZ*4+Math.sin(dirAngle*1.7)*180;
        targetScale=.42*densityScale;
        targetOpacity=0;
      }else if(exitMode==="diagonal"){
        tx=diagonalSign*innerWidth*.82+(i-(n-1)/2)*22;
        ty=-innerHeight*.42+(i%3)*54;
        tz=180+(i%4)*42;
        targetScale=.34*densityScale;
        targetOpacity=0;
      }else{
        // Camera: preserve glyph form much longer than before.
        tx=(i-(n-1)/2)*3+s.ashDriftX*.22;
        ty=-4+(i%3-1)*5;
        tz=780;
        targetScale=6.45;
        targetOpacity=0;
      }

      let x=lerp(pose.x,tx,depart);
      let y=lerp(pose.y,ty,depart);
      let z=lerp(pose.z,tz,depart);
      let scale=lerp(pose.scale,targetScale,depart);
      let rot=lerp(pose.rot,(i%2?-1:1)*28,depart);
      let rx=lerp(pose.rx,0,depart);
      let ry=lerp(pose.ry,0,depart);
      let opacity=lerp(.98,targetOpacity,easeIn(clamp((depart-.72)/.28)));
      let blur=exitMode==="camera"?depart*2.1:depart*5.5;

      // Rare camera splat: one or two glyphs hit the "glass", panic, then scramble after the group.
      const slapSlot=slapIndices.indexOf(i);
      if(exitMode==="camera"&&slapSlot>=0){
        const approach=easeIn(clamp((p-.22-slapSlot*.035)/.34));
        const hitStart=.54+slapSlot*.035;
        const panic=easeInOut(clamp((p-hitStart)/.19));
        const escape=easeIn(clamp((p-(hitStart+.18))/.28));
        const slapX=(slapSlot===0?-1:1)*(28+slapSlot*16);
        const slapY=-8+slapSlot*30;

        x=lerp(pose.x,slapX,approach);
        y=lerp(pose.y,slapY,approach);
        z=lerp(pose.z,900,approach);
        scale=lerp(pose.scale,8.25,approach);
        rot=lerp(pose.rot,(slapSlot===0?-7:8),approach);
        rx=lerp(pose.rx,0,approach);
        ry=lerp(pose.ry,0,approach);
        opacity=1;
        blur=approach*1.1;

        // Nervous little shiver after impact.
        x+=Math.sin(p*150+s.whimPhase)*8*panic*(1-escape);
        y+=Math.cos(p*128+s.whimPhase)*5*panic*(1-escape);

        if(i===slapDropIndex){
          // One rare splat peels downward first, then realizes the group has left and bolts after it.
          const peelDrop=easeInOut(clamp((p-(hitStart+.07))/.18));
          y+=peelDrop*116*(1-escape);
          rot+=peelDrop*18*s.whimSign;
        }

        // Panic chase through/away from the camera.
        x=lerp(x,0,escape);
        y=lerp(y,0,escape);
        z=lerp(z,1120,escape);
        scale=lerp(scale,10.2,escape);
        opacity=1-easeIn(clamp((escape-.68)/.32));
        blur=lerp(1.1,2.8,escape);
      }

      // Left-behind glyph hovers while everyone else disappears, then sprints after them.
      if(exitMode==="far"&&i===lateChaserIndex){
        const waiting=clamp((p-.18)/.44);
        const chase=easeIn(clamp((p-.64)/.36));
        if(p<.64){
          x=pose.x+Math.sin(p*34+s.whimPhase)*8*waiting;
          y=pose.y+Math.cos(p*27+s.whimPhase)*5*waiting;
          z=pose.z;
          scale=pose.scale;
          opacity=.98;
          blur=0;
        }else{
          x=lerp(pose.x,0,chase);
          y=lerp(pose.y,-18,chase);
          z=lerp(pose.z,-1650,chase);
          scale=lerp(pose.scale,.035,chase);
          opacity=1-easeIn(clamp((chase-.74)/.26));
          blur=chase*4.2;
          rot+=Math.sin(p*90)*11*(1-chase);
        }
      }

      setT(el,x,y,scale,rot,rx,ry,z);
      el.style.opacity=String(clamp(opacity));
      el.style.filter=`blur(${blur}px) brightness(${1+(exitMode==="camera"?depart*.65:depart*.22)})`;
    });

    sparkleSeeds.forEach((s,i)=>{
      const fakeIndex=Math.min(n-1,Math.floor((i/sparkleCount)*Math.max(1,n)));
      const pose=ensemblePose(fakeIndex,theta,sceneTime);
      const fade=1-easeIn(clamp((p-.38)/.62));
      let sx=pose.x+Math.sin(s.angle)*24;
      let sy=pose.y+Math.cos(s.angle)*14;
      let sz=pose.z+Math.sin(s.phase)*32;
      if(exitMode==="camera"){
        const q=easeIn(clamp((p-.25)/.75));
        sx=lerp(sx,0,q); sy=lerp(sy,0,q); sz=lerp(sz,720,q);
      }else if(exitMode==="far"){
        const q=easeIn(clamp((p-.25)/.75));
        sx*=1-q*.85; sy*=1-q*.85; sz=lerp(sz,-950,q);
      }
      const pulse=.45+.55*Math.sin((petalBaseTime+phase8Duration+elapsed)*.005*s.pulse+s.phase)**2;
      setT(s.el,sx,sy,s.size*(.65+.52*pulse),0,0,0,sz);
      s.el.style.opacity=String((.35+.48*pulse)*fade);
    });

    setWhiteLevel(1);
    rushLines.style.opacity=String(lerp(exitMode==="camera"?.44:.28,0,p));
    portalGlow.style.opacity=String(lerp(exitMode==="camera"?.34:.22,0,p));
  },token);
  if(token!==playToken)return;

  sparkleSeeds.forEach(s=>s.el.remove());
  g.forEach(el=>el.remove());

  // 10) 重量級刻印。突進後は白背景で一拍置き、それから「ダン、ダン、ダン！」へ。
  whiteRoom.style.opacity="1";
  whiteRoom.style.transform="none";
  whiteRoom.style.background="#fff";
  rushLines.style.opacity="0";
  portalGlow.style.opacity="0";
  flash.style.opacity="0";
  await sleep(420);
  if(token!==playToken)return;
  const stamps=populateStampBoard(out,false);
  board.style.opacity=1;
  label.style.opacity=0;
  await sleep(90);
  if(token!==playToken)return;

  const stampCount=stamps.length;
  const shakeStrength=stampCount<=3?1:(stampCount<=8?.72:(stampCount<=14?.46:.25));
  const stampBeat=stampCount<=3?520:(stampCount<=8?450:(stampCount<=14?340:250));
  for(let i=0;i<stamps.length;i++){
    if(token!==playToken)return;
    const stamp=stamps[i];
    const wave=document.createElement("div");
    wave.className="impactWave";

    // offsetLeft/offsetTop are the untransformed final layout box.
    // getBoundingClientRect() was wrong here because .stamp starts translated/scaled.
    const cx=stamp.offsetLeft+stamp.offsetWidth/2;
    const cy=stamp.offsetTop+stamp.offsetHeight/2;
    wave.style.left=`${cx}px`;
    wave.style.top=`${cy}px`;

    const waveSize=Math.max(104,Math.min(154,stamp.offsetHeight*1.55));
    wave.style.width=`${waveSize}px`;
    wave.style.height=`${waveSize}px`;
    wave.style.marginLeft=`${-waveSize/2}px`;
    wave.style.marginTop=`${-waveSize/2}px`;

    board.appendChild(wave);
    setTimeout(()=>wave.remove(),820);

    stamp.classList.add("hit");

    const sx=shakeStrength;
    stage.animate([
      {transform:"translate3d(0,0,0) scale(1)"},
      {offset:.12,transform:`translate3d(0,${(20*sx).toFixed(2)}px,0) scale(${(1-.020*sx).toFixed(4)})`},
      {offset:.30,transform:`translate3d(${(-3*sx).toFixed(2)}px,${(-8*sx).toFixed(2)}px,0) scale(${(1+.012*sx).toFixed(4)})`},
      {offset:.52,transform:`translate3d(${(2*sx).toFixed(2)}px,${(4*sx).toFixed(2)}px,0) scale(${(1-.007*sx).toFixed(4)})`},
      {offset:.74,transform:`translate3d(${(-1*sx).toFixed(2)}px,${(-2*sx).toFixed(2)}px,0) scale(${(1+.003*sx).toFixed(4)})`},
      {transform:"translate3d(0,0,0) scale(1)"}
    ],{duration:500,easing:"cubic-bezier(.06,.70,.08,1)"});

    flash.animate(
      [{opacity:0},{opacity:.42,offset:.10},{opacity:.14,offset:.34},{opacity:0}],
      {duration:460,fill:"forwards",easing:"ease-out"}
    );

    if(navigator.vibrate){
      navigator.vibrate(stampCount<=3?[65,28,110]:(stampCount<=8?[48,22,78]:(stampCount<=14?[34,16,52]:[24])));
    }
    await sleep(stampBeat);
  }

  label.animate(
    [{opacity:0,transform:"translate(-50%,8px)"},{opacity:1,transform:"translate(-50%,0)"}],
    {duration:420,fill:"forwards",easing:"cubic-bezier(.16,.84,.22,1)"}
  );
  glow.animate(
    [{opacity:0,transform:"translate(-50%,-50%) scale(.45)"},{opacity:1,transform:"translate(-50%,-50%) scale(1)"}],
    {duration:620,fill:"forwards",easing:"cubic-bezier(.16,.84,.22,1)"}
  );

  await sleep(1050);
  if(token!==playToken)return;
  input.value=out;
  input.style.fontFamily=targetFontFamily;
  input.style.color="";
  input.style.caretColor="";
  clearStage(false);
}
btn.addEventListener("click",()=>{nextPreset=null;play()});
debugButtons.forEach(debugButton=>{
  debugButton.addEventListener("click",()=>{
    if(running)return;
    nextPreset=debugButton.dataset.preset||null;
    play();
  });
});
conversionModeInputs.forEach(el=>el.addEventListener("change",updateConversionUi));
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){
    e.preventDefault();
    nextPreset=null;
    play();
  }
});
updateConversionUi();
skip.addEventListener("click",()=>{
  const mode=getConversionMode();
  const src=(input.value.replace(/\r\n?/g,"\n").trim()||"あさきゆめみし");
  const out=transformText(src,mode);
  playToken++;
  input.style.color="";
  input.style.caretColor="";
  finishInstant(out,mode);
  setTimeout(()=>{
    input.value=out;
    input.style.fontFamily=targetFontFor(mode);
    clearStage(false);
  },700);
});
</script>
</body>
</html>
