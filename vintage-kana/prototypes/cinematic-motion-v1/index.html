<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>変体仮名メーカー・変換演出プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Noto+Serif+Hentaigana:400,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f0e8;
    --paper2:#ebe2d4;
    --ink:#1d1a17;
    --muted:#766f68;
    --gold:#b08a4a;
    --gold2:#e6c987;
    --glass:rgba(255,255,255,.58);
    --shadow:0 22px 60px rgba(42,31,20,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 50% 12%, rgba(255,255,255,.9), transparent 34%),
      linear-gradient(160deg,var(--paper),var(--paper2));
    overflow:hidden;
  }
  body:before{
    content:"";
    position:fixed; inset:0; pointer-events:none; opacity:.15;
    background-image:
      linear-gradient(90deg, rgba(80,60,40,.07) 1px, transparent 1px),
      linear-gradient(rgba(80,60,40,.05) 1px, transparent 1px);
    background-size:28px 28px;
    mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent);
  }
  .app{
    height:100%;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:max(20px,env(safe-area-inset-top)) clamp(18px,4vw,44px) max(20px,env(safe-area-inset-bottom));
    position:relative;
    z-index:2;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    max-width:980px; width:100%; margin:0 auto;
  }
  .brand{display:flex; align-items:center; gap:12px}
  .seal{
    width:38px;height:38px;border-radius:12px;border:1px solid rgba(29,26,23,.18);
    display:grid;place-items:center;font-family:serif;font-size:18px;background:rgba(255,255,255,.34);
  }
  .brand b{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:600;letter-spacing:.08em}
  .mode{font-size:12px;color:var(--muted);letter-spacing:.08em}
  main{
    display:grid;place-items:center;position:relative;min-height:0;
  }
  .panel{
    width:min(860px,100%);
    border:1px solid rgba(70,55,40,.12);
    background:var(--glass);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:30px;
    box-shadow:var(--shadow);
    padding:clamp(26px,5vw,56px);
    position:relative;
    overflow:hidden;
  }
  .panel:before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(120deg,rgba(255,255,255,.32),transparent 28%,transparent 70%,rgba(176,138,74,.05));
  }
  .eyebrow{font-size:12px;letter-spacing:.16em;color:var(--muted);margin-bottom:14px}
  h1{
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:clamp(28px,5vw,52px);
    margin:0 0 14px; font-weight:600; letter-spacing:.06em;
  }
  .lead{color:var(--muted);font-size:14px;line-height:1.8;margin-bottom:28px}
  .composer{
    display:grid;grid-template-columns:1fr auto;gap:12px;
    background:rgba(255,255,255,.48);
    border:1px solid rgba(52,42,32,.12);
    border-radius:20px;padding:10px;
  }
  input{
    min-width:0;border:0;background:transparent;outline:none;
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:clamp(22px,4vw,34px);padding:12px 14px;color:var(--ink);
    letter-spacing:.12em;
  }
  button{
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    border:0;border-radius:14px;padding:0 22px;min-height:56px;
    background:var(--ink);color:#fff;font-weight:700;letter-spacing:.08em;
    box-shadow:0 8px 22px rgba(29,26,23,.22);
    cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;
  }
  button:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(29,26,23,.25)}
  button:active{transform:translateY(1px) scale(.99)}
  button:disabled{opacity:.45;cursor:default}
  .options{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    margin-top:12px;padding:0 4px;color:var(--muted);font-size:13px;
  }
  .options label{display:flex;align-items:center;gap:6px}
  .options input{accent-color:var(--ink)}
  .optLabel{font-size:12px;letter-spacing:.08em;color:rgba(65,56,48,.76)}
  .hint{margin-top:14px;font-size:12px;color:var(--muted)}
  footer{font-size:11px;color:rgba(65,56,48,.55);text-align:center}
  #stage{
    position:fixed;inset:0;z-index:20;pointer-events:none;
    display:grid;place-items:center;perspective:1100px;
    opacity:0;visibility:hidden;
  }
  #stage.active{opacity:1;visibility:visible}
  .veil{
    position:absolute;inset:0;background:
      radial-gradient(circle at 50% 48%,rgba(255,255,255,.08),rgba(22,18,15,.38));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;
  }
  .stage-core{
    position:relative;width:min(96vw,900px);height:min(68vh,620px);
    perspective:1200px;
    -webkit-perspective:1200px;
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
  }
  .glyph{
    position:absolute;left:50%;top:50%;
    width:70px;height:90px;margin:-45px 0 0 -35px;
    display:grid;place-items:center;
    font-family:"Noto Serif Hentaigana","Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:58px;line-height:1;color:#fff;
    text-shadow:0 3px 22px rgba(0,0,0,.26);
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    backface-visibility:visible;
    -webkit-backface-visibility:visible;
    will-change:transform,opacity,filter;
    opacity:0;
  }
  .glyph:after{
    content:"";position:absolute;inset:4px 9px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.3),transparent 68%);
    filter:blur(8px);z-index:-1;opacity:.6;
  }
  .orbitRig{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    will-change:transform;
    pointer-events:none;
  }
  .orbitRig .glyph{
    backface-visibility:visible;
    -webkit-backface-visibility:visible;
  }
  .orbitRig.spinning{
    animation:orbitSpin 3.6s linear both;
    -webkit-animation:orbitSpin 3.6s linear both;
  }
  @keyframes orbitSpin{
    0%{transform:rotateX(-9deg) rotateY(0deg) rotateZ(0deg)}
    25%{transform:rotateX(-6deg) rotateY(360deg) rotateZ(.8deg)}
    50%{transform:rotateX(-11deg) rotateY(720deg) rotateZ(-.7deg)}
    75%{transform:rotateX(-7deg) rotateY(1080deg) rotateZ(.5deg)}
    100%{transform:rotateX(-9deg) rotateY(1440deg) rotateZ(0deg)}
  }
  @-webkit-keyframes orbitSpin{
    0%{-webkit-transform:rotateX(-9deg) rotateY(0deg) rotateZ(0deg)}
    25%{-webkit-transform:rotateX(-6deg) rotateY(360deg) rotateZ(.8deg)}
    50%{-webkit-transform:rotateX(-11deg) rotateY(720deg) rotateZ(-.7deg)}
    75%{-webkit-transform:rotateX(-7deg) rotateY(1080deg) rotateZ(.5deg)}
    100%{-webkit-transform:rotateX(-9deg) rotateY(1440deg) rotateZ(0deg)}
  }
  .spark{
    position:absolute;left:50%;top:50%;
    width:6px;height:6px;margin:-3px 0 0 -3px;
    border-radius:50%;
    background:#fffdf4;
    box-shadow:
      0 0 8px 2px rgba(255,255,255,.96),
      0 0 18px 5px rgba(255,236,166,.62);
    opacity:0;pointer-events:none;
    will-change:transform,opacity,filter;
    mix-blend-mode:screen;
  }
  .spark:before,.spark:after{
    content:"";position:absolute;left:50%;top:50%;
    background:rgba(255,255,255,.92);
    transform:translate(-50%,-50%);
    border-radius:2px;
  }
  .spark:before{width:18px;height:1px}
  .spark:after{width:1px;height:18px}
  .flash{
    position:fixed;inset:-10%;z-index:40;opacity:0;
    background:radial-gradient(circle at 50% 50%,#fff 0%,#fff 18%,rgba(255,250,228,.98) 30%,rgba(255,244,192,.72) 48%,transparent 72%);
    mix-blend-mode:screen;
  }
  .stampboard{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    gap:var(--stamp-gap,clamp(2px,1.2vw,12px));padding:20px;
    opacity:0;transform:translateZ(80px);
    --stamp-size:clamp(46px,8.8vw,90px);
    --stamp-gap:clamp(2px,1.2vw,12px);
  }
  .stampboard.horizontal{
    flex-direction:row;flex-wrap:wrap;align-content:center;
    max-width:min(90vw,780px);margin-inline:auto;
  }
  .stampboard.vertical{
    display:grid;grid-auto-flow:column;
    grid-template-rows:repeat(var(--stamp-rows,8),auto);
    justify-content:center;align-content:center;justify-items:center;
    max-height:min(82vh,720px);direction:rtl;
  }
  .stamp{
    font-family:"Noto Serif Hentaigana","Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:var(--stamp-size);font-weight:600;
    color:var(--ink);opacity:0;transform:translateY(-210px) scale(2.55);position:relative;z-index:2;
    filter:blur(18px);
    text-shadow:0 1px 0 rgba(255,255,255,.7);
    will-change:transform,opacity,filter;
  }
  .stamp.hit{animation:stampHit .82s cubic-bezier(.035,.78,.07,1) forwards}
  @keyframes stampHit{
    0%{
      opacity:0;
      transform:translateY(-228px) scale(2.72);
      filter:blur(20px);
      text-shadow:0 28px 46px rgba(29,26,23,.06)
    }
    20%{
      opacity:1;
      transform:translateY(34px) scale(.62,.46);
      filter:blur(0);
      text-shadow:0 22px 34px rgba(29,26,23,.50)
    }
    36%{
      transform:translateY(-18px) scale(1.18,1.30);
      text-shadow:0 7px 14px rgba(29,26,23,.30)
    }
    52%{
      transform:translateY(11px) scale(.88,.80);
      text-shadow:0 13px 20px rgba(29,26,23,.34)
    }
    68%{
      transform:translateY(-6px) scale(1.075,1.10);
      text-shadow:0 5px 10px rgba(29,26,23,.22)
    }
    82%{
      transform:translateY(3px) scale(.975,.95);
    }
    92%{
      transform:translateY(-1px) scale(1.018,1.025);
    }
    100%{
      opacity:1;
      transform:translateY(0) scale(1);
      filter:blur(0);
      text-shadow:0 1px 0 rgba(255,255,255,.7)
    }
  }
  .impactWave{
    position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;
    border-radius:50%;pointer-events:none;z-index:1;
    border:5px solid rgba(255,244,209,.96);
    box-shadow:
      0 0 36px 11px rgba(255,229,151,.62),
      inset 0 0 28px rgba(255,255,255,.72);
    animation:impactWave .62s .13s cubic-bezier(.06,.66,.12,1) both;
  }
  @keyframes impactWave{
    0%{opacity:.98;transform:scale(.14);filter:blur(0)}
    34%{opacity:.74;transform:scale(1.36);filter:blur(.2px)}
    68%{opacity:.28;transform:scale(2.55);filter:blur(1.2px)}
    100%{opacity:0;transform:scale(4.10);filter:blur(4px)}
  }
  .stampboard:after{
    content:"";position:absolute;width:min(86%,720px);height:1px;bottom:28%;
    background:linear-gradient(90deg,transparent,rgba(70,53,32,.25),transparent);
  }
  .done-glow{
    position:absolute;left:50%;top:54%;width:55%;aspect-ratio:1;border-radius:50%;
    transform:translate(-50%,-50%) scale(.5);
    background:radial-gradient(circle,rgba(230,201,135,.24),transparent 68%);
    opacity:0;filter:blur(8px);
  }
  .skip{
    position:fixed;right:20px;bottom:20px;z-index:60;pointer-events:auto;
    border:1px solid rgba(255,255,255,.34);background:rgba(24,20,17,.52);
    color:#fff;min-height:0;padding:9px 12px;font-size:11px;border-radius:999px;
    box-shadow:none;opacity:0;
  }
  #stage.active .skip{opacity:.8}
  .resultLabel{
    position:absolute;left:50%;top:22%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.22em;color:rgba(29,26,23,.58);
    opacity:0;white-space:nowrap;
  }
  .shake{animation:shake .58s cubic-bezier(.08,.72,.10,1)}
  @keyframes shake{
    0%{transform:translate3d(0,0,0) scale(1)}
    9%{transform:translate3d(-16px,14px,0) scale(.968)}
    20%{transform:translate3d(13px,-9px,0) scale(1.026)}
    34%{transform:translate3d(-10px,8px,0) scale(.982)}
    49%{transform:translate3d(8px,-5px,0) scale(1.016)}
    64%{transform:translate3d(-5px,4px,0) scale(.991)}
    78%{transform:translate3d(3px,-2px,0) scale(1.007)}
    90%{transform:translate3d(-1px,1px,0) scale(.998)}
    100%{transform:translate3d(0,0,0) scale(1)}
  }

  /* MOTION STUDY 24: source-peel -> white ascent -> orbit -> vortex */
  .veil{
    background:transparent;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  .white-room{
    position:absolute;inset:0;z-index:0;opacity:0;overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 46%,rgba(255,255,255,1) 0%,rgba(255,255,255,.99) 34%,rgba(250,249,246,.98) 68%,rgba(238,234,226,.96) 100%);
    will-change:opacity,transform;
  }
  .white-room:before{
    content:"";position:absolute;left:50%;top:50%;
    width:130vmax;height:130vmax;border-radius:50%;
    transform:translate(-50%,-50%) scale(.42);
    background:
      repeating-conic-gradient(from 0deg,
        rgba(185,174,154,.00) 0deg,
        rgba(185,174,154,.00) 7deg,
        rgba(185,174,154,.075) 7.5deg,
        rgba(185,174,154,.00) 8.8deg);
    mask-image:radial-gradient(circle,black 0 15%,rgba(0,0,0,.76) 34%,transparent 68%);
    -webkit-mask-image:radial-gradient(circle,black 0 15%,rgba(0,0,0,.76) 34%,transparent 68%);
    opacity:.62;will-change:transform,opacity;
  }
  .white-room:after{
    content:"";position:absolute;left:50%;top:50%;
    width:min(88vw,720px);height:min(88vw,720px);border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,255,255,1) 0 8%,rgba(255,255,255,.88) 22%,rgba(230,223,210,.16) 48%,transparent 72%);
    filter:blur(7px);
  }
  .rush-lines{position:absolute;inset:0;overflow:hidden;opacity:0;will-change:opacity}
  .rush-line{
    position:absolute;top:-38vh;width:1.5px;height:32vh;border-radius:999px;
    background:linear-gradient(to bottom,transparent,rgba(156,143,122,.08) 18%,rgba(156,143,122,.34) 56%,transparent);
    filter:blur(.15px);will-change:transform,opacity;
  }
  .portal-glow{
    position:absolute;left:50%;top:50%;width:min(72vw,560px);aspect-ratio:1;border-radius:50%;
    transform:translate(-50%,-50%) scale(.4);opacity:0;
    background:radial-gradient(circle,rgba(255,255,255,.98) 0 12%,rgba(255,248,228,.72) 32%,rgba(215,199,165,.15) 54%,transparent 72%);
    filter:blur(8px);will-change:transform,opacity;
  }
  .stage-core{z-index:2}
  .glyph{
    color:var(--ink);
    text-shadow:none;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  .glyph:after{display:none}

  @media (max-width:620px){
    .composer{grid-template-columns:1fr}
    button{width:100%}
    .panel{border-radius:24px}
    .glyph{font-size:48px}
    .stage-core{height:62vh}
  }
  @media (prefers-reduced-motion:reduce){
    .mode:after{content:" / 省アニメ環境"}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><div class="seal">変</div><b>変体仮名メーカー</b></div>
    <div class="mode">MOTION STUDY 24</div>
  </header>
  <main>
    <section class="panel">
      <div class="eyebrow">HIRAGANA → HENTAIGANA</div>
      <h1>文字を、ほどく。</h1>
      <div class="lead">変換そのものは一瞬。そこへ、必要以上の儀式を足した実験版です。</div>
      <div class="composer">
        <input id="input" maxlength="20" value="あさきゆめみし" aria-label="変換するひらがな">
        <button id="convert">変換する</button>
      </div>
      <div class="options" role="group" aria-label="刻印方向の選択">
        <span class="optLabel">刻印方向</span>
        <label><input type="radio" name="stampDirection" value="horizontal" checked> 横</label>
        <label><input type="radio" name="stampDirection" value="vertical"> 縦</label>
      </div>
      <div class="hint">※ 演出検証用。灰の漂流後は「円・円環・龍・ぴょこぴょこ整列」×「上・奥・爆散・正面・下・斜め」を毎回組み替え。低確率ではぐれ者やビターン演出も発生します。</div>
    </section>
  </main>
  <footer>prototype / cinematic conversion motion</footer>
</div>
<div id="stage" aria-hidden="true">
  <div class="veil"></div>
  <div class="white-room" id="whiteRoom">
    <div class="rush-lines" id="rushLines"></div>
    <div class="portal-glow" id="portalGlow"></div>
  </div>
  <div class="stage-core" id="core">
    <div class="done-glow" id="doneGlow"></div>
    <div class="resultLabel" id="resultLabel">HENTAIGANA</div>
    <div class="stampboard" id="stampboard"></div>
  </div>
  <div class="flash" id="flash"></div>
  <button class="skip" id="skip">演出を飛ばす</button>
</div>
<script>
const firstVariant = {
  "あ":"𛀂","い":"𛀆","う":"𛀊","え":"𛀏","お":"𛀔",
  "か":"𛀗","き":"𛀣","く":"𛀫","け":"𛀲","こ":"𛀸",
  "さ":"𛀼","し":"𛁄","す":"𛁊","せ":"𛁒","そ":"𛁗",
  "た":"𛁞","ち":"𛁢","つ":"𛁩","て":"𛁮","と":"𛁷",
  "な":"𛁾","に":"𛂇","ぬ":"𛂏","ね":"𛂒","の":"𛂙",
  "は":"𛂞","ひ":"𛂩","ふ":"𛂰","へ":"𛂳","ほ":"𛂺",
  "ま":"𛃂","み":"𛃉","む":"𛃐","め":"𛃔","も":"𛃗",
  "や":"𛃝","ゆ":"𛃣","よ":"𛃧",
  "ら":"𛃭","り":"𛃱","る":"𛃸","れ":"𛃾","ろ":"𛄂",
  "わ":"𛄈","ゐ":"𛄍","ゑ":"𛄒","を":"𛄖","ん":"𛄝"
};
const stage=document.getElementById("stage"),
core=document.getElementById("core"),
flash=document.getElementById("flash"),
board=document.getElementById("stampboard"),
glow=document.getElementById("doneGlow"),
label=document.getElementById("resultLabel"),
btn=document.getElementById("convert"),
input=document.getElementById("input"),
skip=document.getElementById("skip"),
whiteRoom=document.getElementById("whiteRoom"),
rushLines=document.getElementById("rushLines"),
portalGlow=document.getElementById("portalGlow");
const stampDirectionInputs=[...document.querySelectorAll('input[name="stampDirection"]')];

let running=false,timers=[],playToken=0;
const sleep=ms=>new Promise(r=>{const t=setTimeout(r,ms);timers.push(t)});
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
const easeSoft=t=>t*t*(3-2*t);
const pick=list=>list[Math.floor(Math.random()*list.length)];
const randomIndex=n=>n>0?Math.floor(Math.random()*n):-1;

function spinProgress(spin0,omega0,omega1,elapsedMs,durationMs){
  const t=elapsedMs/1000;
  const dur=durationMs/1000;
  const accel=(omega1-omega0)/Math.max(dur,.0001);
  return {
    spin:spin0+omega0*t+.5*accel*t*t,
    omega:omega0+accel*t
  };
}

function frameTween(duration,onFrame,token){
  return new Promise(resolve=>{
    const start=performance.now();
    const step=now=>{
      if(token!==playToken){resolve(false);return;}
      const p=clamp((now-start)/duration);
      onFrame(p,now-start);
      if(p<1)requestAnimationFrame(step);else resolve(true);
    };
    requestAnimationFrame(step);
  });
}
function setT(el,x,y,scale=1,rot=0,rx=0,ry=0,z=0){
  el.style.transform=`translate3d(${x}px,${y}px,${z}px) scale(${scale}) rotateZ(${rot}deg) rotateX(${rx}deg) rotateY(${ry}deg)`;
}
function getStampDirection(){
  const checked=stampDirectionInputs.find(el=>el.checked);
  return checked?checked.value:"horizontal";
}
function setupStampBoard(text){
  const len=[...text].length;
  const direction=getStampDirection();
  board.className="stampboard "+direction;
  board.style.removeProperty("--stamp-rows");
  let size="clamp(46px,8.8vw,90px)";
  let gap="clamp(2px,1.2vw,12px)";
  if(direction==="horizontal"){
    if(len<=8){
      size="clamp(46px,8.8vw,90px)";
      gap="clamp(2px,1.2vw,12px)";
    }else if(len<=14){
      size="clamp(40px,7.2vw,74px)";
      gap="clamp(2px,1vw,10px)";
    }else{
      size="clamp(32px,5.8vw,58px)";
      gap="clamp(1px,.8vw,8px)";
    }
  }else{
    const rows=len<=8?len:(len<=14?Math.ceil(len/2):Math.min(10,Math.ceil(len/2)));
    size=len<=8
      ?"clamp(46px,8.4vw,86px)"
      :(len<=14?"clamp(38px,6.8vw,66px)":"clamp(30px,5.2vw,52px)");
    gap=len<=8?"clamp(2px,1.1vw,10px)":"clamp(1px,.7vw,8px)";
    board.style.setProperty("--stamp-rows",String(rows));
  }
  board.style.setProperty("--stamp-size",size);
  board.style.setProperty("--stamp-gap",gap);
}
function ensureRushLines(){
  if(rushLines.children.length)return;
  const count=18;
  for(let i=0;i<count;i++){
    const line=document.createElement("i");
    line.className="rush-line";
    line.style.left=`${4+Math.random()*92}%`;
    line.dataset.speed=(.78+Math.random()*.7).toFixed(3);
    line.dataset.phase=Math.random().toFixed(3);
    line.style.opacity=(.34+Math.random()*.46).toFixed(2);
    rushLines.appendChild(line);
  }
}
function measureOrigins(text){
  const ir=input.getBoundingClientRect();
  const cr=core.getBoundingClientRect();
  const cs=getComputedStyle(input);
  const wrap=document.createElement("div");
  Object.assign(wrap.style,{
    position:"fixed",left:ir.left+"px",top:ir.top+"px",width:ir.width+"px",height:ir.height+"px",
    padding:cs.padding,display:"flex",alignItems:"center",whiteSpace:"pre",visibility:"hidden",
    pointerEvents:"none",fontFamily:cs.fontFamily,fontSize:cs.fontSize,fontWeight:cs.fontWeight,
    letterSpacing:cs.letterSpacing,lineHeight:cs.lineHeight
  });
  const spans=[...text].map(ch=>{
    const s=document.createElement("span");
    s.textContent=ch;
    wrap.appendChild(s);
    return s;
  });
  document.body.appendChild(wrap);
  const pts=spans.map(s=>{
    const r=s.getBoundingClientRect();
    return {x:r.left+r.width/2-(cr.left+cr.width/2),y:r.top+r.height/2-(cr.top+cr.height/2)};
  });
  wrap.remove();
  return {pts,fontSize:parseFloat(cs.fontSize)||32,color:cs.color,fontFamily:cs.fontFamily};
}
function makeGlyphs(text){
  return [...text].map((ch,i)=>{
    const e=document.createElement("div");
    e.className="glyph";
    e.textContent=ch;
    e.dataset.i=i;
    core.appendChild(e);
    return e;
  });
}
function resetVisuals(){
  [stage,flash,glow,label,whiteRoom,portalGlow].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
  core.querySelectorAll(".glyph,.spark,.impactWave,.orbitRig").forEach(n=>n.remove());
  board.innerHTML="";
  board.style.opacity=0;
  glow.style.opacity=0;
  label.style.opacity=0;
  flash.style.opacity=0;
  whiteRoom.style.opacity=0;
  whiteRoom.style.transform="none";
  whiteRoom.style.background="";
  rushLines.style.opacity=0;
  portalGlow.style.opacity=0;
  portalGlow.style.transform="translate(-50%,-50%) scale(.4)";
  [...rushLines.children].forEach(l=>l.style.transform="translate3d(0,-40vh,0)");
}
function clearStage(cancel=true){
  if(cancel)playToken++;
  timers.forEach(clearTimeout);timers=[];
  resetVisuals();
  stage.classList.remove("active");
  input.style.color="";
  input.style.caretColor="";
  running=false;
  btn.disabled=false;
}
function finishInstant(text){
  resetVisuals();
  board.innerHTML="";
  setupStampBoard(text);
  [...text].forEach(ch=>{
    const s=document.createElement("div");
    s.className="stamp hit";
    s.textContent=ch;
    board.appendChild(s);
  });
  board.style.opacity=1;
  label.style.opacity=1;
  glow.style.opacity=.8;
  input.style.fontFamily='"Noto Serif Hentaigana","Yu Mincho","Hiragino Mincho ProN",serif';
}
async function play(){
  if(running)return;
  running=true;
  btn.disabled=true;
  const token=++playToken;
  const src=input.value.trim()||"あさきゆめみし";
  const out=[...src].map(c=>firstVariant[c]||c).join("");

  stage.classList.add("active");
  ensureRushLines();
  resetVisuals();

  const metrics=measureOrigins(src);
  const g=makeGlyphs(src);
  const n=g.length;
  const densityScale=n>16?.72:n>12?.80:n>9?.90:1;
  const baseScale=clamp(metrics.fontSize/58,.42,.78);
  const ink=metrics.color||"#1d1a17";

  // One stable random plan per play. Randomness is never re-rolled per frame.
  const ensembleMode=pick(["circle","ring","dragon","chick"]);
  const exitMode=pick(["up","far","burst","camera","down","diagonal"]);

  // Most plays have no special troublemaker. When one appears, it keeps the same role for the whole play.
  const rogueIndex=n>2&&Math.random()<.38?randomIndex(n):-1;
  const rogueType=rogueIndex>=0?pick(["reverse","drop","wander","early"]):"none";

  // Sometimes one glyph refuses to peel until the others have already started moving.
  const stickyIndex=n>2&&Math.random()<.16?randomIndex(n):-1;

  // "Left behind, then panic chase" is meaningful only when the group flies away into the distance.
  const lateChaserIndex=exitMode==="far"&&n>2&&Math.random()<.28
    ? randomIndex(n)
    : -1;

  // Camera splats are intentionally rare. Two simultaneous splats are very rare.
  let slapCount=0;
  if(exitMode==="camera"&&n>1){
    const slapRoll=Math.random();
    slapCount=slapRoll<.045?2:(slapRoll<.32?1:0);
  }
  const slapIndices=[];
  while(slapIndices.length<slapCount){
    const idx=randomIndex(n);
    if(!slapIndices.includes(idx))slapIndices.push(idx);
  }
  const slapDropIndex=slapCount===2&&Math.random()<.70
    ? slapIndices[1]
    :(slapCount===1&&Math.random()<.18?slapIndices[0]:-1);

  const diagonalSign=Math.random()<.5?-1:1;
  const motionPlan={
    ensembleMode,exitMode,rogueIndex,rogueType,stickyIndex,
    lateChaserIndex,slapIndices:[...slapIndices],slapDropIndex,diagonalSign
  };
  stage.dataset.motionPlan=JSON.stringify(motionPlan);
  console.debug("[hentaigana-motion]",motionPlan);

  const seeds=g.map((el,i)=>{
    el.style.color=ink;
    el.style.fontFamily=metrics.fontFamily;
    el.style.opacity="1";
    el.style.filter="none";
    const p=metrics.pts[i]||{x:(i-(n-1)/2)*40,y:95};
    setT(el,p.x,p.y,baseScale,0,0);
    const whimsical=Math.random()<.14;
    return {
      x:p.x,y:p.y,
      sway:(Math.random()<.5?-1:1)*(8+Math.random()*12),
      phase:Math.random()*Math.PI*2,
      tilt:(Math.random()<.5?-1:1)*(3+Math.random()*5),
      rxSpeed:(Math.random()<.5?-1:1)*(82+Math.random()*54),
      rySpeed:(Math.random()<.5?-1:1)*(94+Math.random()*68),
      rzSpeed:(Math.random()<.5?-1:1)*(24+Math.random()*30),
      zAmp:22+Math.random()*28,
      peelJitter:(Math.random()-.5)*34,
      liftAmp:148+Math.random()*54,
      floatAmpX:.72+Math.random()*.62,
      floatAmpY:.72+Math.random()*.66,
      floatAmpZ:.74+Math.random()*.66,
      floatFreqX:.90+Math.random()*.38,
      floatFreqY:.88+Math.random()*.42,
      floatFreqZ:.92+Math.random()*.36,
      orbitLag:Math.random()*260,

      // Per-play individuality for the ash/petal phases.
      scatterAngleJitter:(Math.random()-.5)*.46,
      scatterRadiusMul:.86+Math.random()*.34,
      fallSpeedMul:.72+Math.random()*.62,
      ashDriftX:(Math.random()-.5)*18,
      ashDriftZ:(Math.random()-.5)*22,
      gatherLag:Math.random()*.09+(whimsical?(.13+Math.random()*.14):0),
      rushLag:Math.random()*.06,
      whimsical,
      whimSign:Math.random()<.5?-1:1,
      whimAmp:whimsical?(22+Math.random()*34):0,
      whimPhase:Math.random()*Math.PI*2
    };
  });

  // 元の入力文字を透明にし、同じ位置の複製だけが剥がれて見えるようにする。
  input.style.color="transparent";
  input.style.caretColor="transparent";

  // 1-2) 一文字ずつ「ぺり、ぺり、ぺり」と剥離し、そのまま浮遊→崩れた円環→回転へ連続接続。
  //      各文字が個別の時計を持つので、剥がれる前の文字が先に浮いたり整列したりしない。
  const ringR=Math.min(170,Math.max(118,innerWidth*.30));
  const ringRY=Math.min(54,ringR*.32);
  const phase12Duration=8900;
  const spinStartMs=3300;
  const spinDurationMs=phase12Duration-spinStartMs;
  const omega2Start=Math.PI*2*.38;
  const omega2End=Math.PI*2*3.55;
  const spinAccel=(omega2End-omega2Start)/(spinDurationMs/1000);
  let spinBase=0;

  await frameTween(phase12Duration,(p,elapsed)=>{
    const tSec=elapsed/1000;
    const globalOrbit=easeInOut(clamp((elapsed-2500)/6400));
    const whiteBlend=easeInOut(clamp((elapsed-3400)/3800));

    const spinElapsed=Math.max(0,elapsed-spinStartMs);
    const spinSec=spinElapsed/1000;
    spinBase=spinElapsed>0
      ? omega2Start*spinSec+.5*spinAccel*spinSec*spinSec
      : 0;

    whiteRoom.style.opacity=String(clamp(.10*globalOrbit+whiteBlend*.90));
    whiteRoom.style.transform=`scale(${lerp(1,1.15,whiteBlend)})`;
    portalGlow.style.opacity=String(clamp((whiteBlend-.05)*1.22));
    portalGlow.style.transform=`translate(-50%,-50%) scale(${lerp(.42,1.25,easeOut(whiteBlend))})`;
    rushLines.style.opacity=String(clamp((whiteBlend-.04)*1.30));

    [...rushLines.children].forEach(line=>{
      const speed=parseFloat(line.dataset.speed),phase=parseFloat(line.dataset.phase);
      const travel=((whiteBlend*speed+phase)%1)*165-45;
      line.style.transform=`translate3d(0,${travel}vh,0) scaleY(${1+whiteBlend*1.95})`;
    });

    g.forEach((el,i)=>{
      const s=seeds[i];
      const base=(i/n)*Math.PI*2;

      const peelStagger=n>16?88:n>12?108:n>8?130:158;
      const sticky=i===stickyIndex;
      const peelDelay=150+i*peelStagger+s.peelJitter+(sticky?980:0);
      const peelT=easeInOut(clamp((elapsed-peelDelay)/(sticky?390:520)));
      const localRise=easeSoft(clamp((elapsed-(peelDelay+120))/(sticky?1800:3000)));
      // Keep the glyph face completely flat through the peel and first lift.
      // A rare sticky glyph waits behind, then springs out and catches the flock.
      const localFloat=easeInOut(clamp((elapsed-(peelDelay+(sticky?520:720)))/(sticky?680:1080)));
      const orbitStart=sticky?1120:1900;
      const orbitDuration=sticky?1050:2400;
      const charOrbit=globalOrbit*easeInOut(clamp((elapsed-(peelDelay+orbitStart+s.orbitLag*.45))/orbitDuration));

      const lift=s.liftAmp*localRise;

      // Peel and first ascent remain a flat sheet: translate only, no 3D tilt or depth.
      const planarDriftX=Math.sin(tSec*.88+s.phase)*2.2*(1-charOrbit);
      const planarDriftY=Math.cos(tSec*1.02+s.phase)*1.1*(1-charOrbit);
      const peelSkew=(i-(n-1)/2)*1.4;
      const peelX=s.sway*.18*peelT+peelSkew*peelT*.24;
      const peelY=-13*peelT;

      // After the flat glyph has risen, it gradually acquires leaf-like 3D floating.
      const floatEnvelope=.20+.80*Math.sin(Math.min(localRise,.985)*Math.PI);
      const floatStrength=floatEnvelope*localFloat;
      const freeX=s.x+planarDriftX+peelX
        +Math.sin(tSec*2.18*s.floatFreqX+s.phase)*s.sway*s.floatAmpX*1.34*floatStrength
        +Math.cos(tSec*.84+s.phase*.63)*10*s.floatAmpX*floatStrength;
      const freeY=s.y-lift+planarDriftY+peelY
        +Math.sin(tSec*3.05*s.floatFreqY+s.phase)*8.8*s.floatAmpY*floatStrength
        +Math.cos(tSec*.76+s.phase*.82)*7*s.floatAmpY*floatStrength;
      const freeZ=(
        Math.sin(tSec*2.55*s.floatFreqZ+s.phase)*34
        +Math.cos(tSec*.92+s.phase*.71)*12
      )*s.floatAmpZ*floatStrength;

      // The imperfect ring is already rotating while glyphs are still being attracted.
      const angle=base+spinBase;
      const depth=(Math.sin(angle)+1)/2;
      const residual=1-charOrbit;
      const wobbleX=Math.sin(tSec*1.75+s.phase)*20*residual;
      const wobbleY=Math.cos(tSec*1.42+s.phase)*10*residual;
      const wobbleZ=Math.sin(tSec*1.88+s.phase)*12*residual;

      const orbitX=Math.cos(angle)*ringR+wobbleX;
      const orbitY=-104+Math.sin(angle)*ringRY+wobbleY;
      const orbitZ=10+depth*34+wobbleZ;

      const x=lerp(freeX,orbitX,charOrbit);
      const y=lerp(freeY,orbitY,charOrbit);
      const z=lerp(freeZ,orbitZ,charOrbit);

      const freeScale=lerp(baseScale,.92,localRise);
      const orbitScale=(.72+depth*.50)*densityScale;
      const scale=lerp(freeScale,orbitScale,charOrbit);

      const flutterRZ=Math.sin(tSec*1.55+s.phase)*s.tilt*(1-p*.18);
      const freeRZ=flutterRZ*localFloat;
      const orbitRZ=(spinBase*180/Math.PI)*(i%2?-.26:.26)+Math.sin(angle)*8;
      const rotZ=lerp(freeRZ,orbitRZ,charOrbit);

      const freeRX=(
        Math.sin(tSec*2.45+s.phase)*38
        +Math.cos(tSec*.86+s.phase*.54)*11
      )*floatStrength;
      const freeRY=(
        Math.cos(tSec*2.25+s.phase)*43
        +Math.sin(tSec*.79+s.phase*.68)*12
      )*floatStrength;
      const orbitRX=-12+Math.cos(angle)*10;
      const orbitRY=10+Math.sin(angle)*12;
      const rotX=lerp(freeRX,orbitRX,charOrbit);
      const rotY=lerp(freeRY,orbitRY,charOrbit);

      setT(el,x,y,scale,rotZ,rotX,rotY,z);
      el.style.opacity=String(clamp((elapsed-peelDelay+160)/430));
      el.style.textShadow=`0 0 ${8+depth*14*charOrbit}px rgba(139,125,101,${.08+depth*.16*charOrbit})`;
    });
  },token);
  if(token!==playToken)return;

  // 4) 崩れた円環から竜巻へ。phase12終端の位置・姿勢・角速度をそのまま引き継ぐ。
  const baseAngles=[...Array(n)].map((_,i)=>(i/n)*Math.PI*2);
  const omega4Start=omega2End;
  const omega4End=Math.PI*2*31.15;
  const phase4Duration=3100;
  let spin=spinBase;

  await frameTween(phase4Duration,(p,elapsed)=>{
    const e=easeInOut(p);
    const prog=spinProgress(spinBase,omega4Start,omega4End,elapsed,phase4Duration);
    spin=prog.spin;

    const radius=lerp(ringR,24,e);
    const ellipse=lerp(ringRY,10,e);
    const baseY=lerp(-104,-86,e);
    const vertical=lerp(0,196,e);
    const axisAmp=lerp(0,16,e);
    const axisTwist=Math.sin(spin*.18)*axisAmp;

    portalGlow.style.opacity=String(lerp(.98,.92,e));
    portalGlow.style.transform=`translate(-50%,-50%) scale(${lerp(1.18,.82,e)})`;
    rushLines.style.opacity=String(lerp(.92,1,e));

    [...rushLines.children].forEach(line=>{
      const speed=parseFloat(line.dataset.speed),phase=parseFloat(line.dataset.phase);
      const travel=((e*speed*7.8+phase)%1)*172-48;
      line.style.transform=`translate3d(0,${travel}vh,0) scaleY(${2.15+e*1.55})`;
    });

    g.forEach((el,i)=>{
      const angle=baseAngles[i]+spin;
      const depth=(Math.sin(angle)+1)/2;
      const layer=(i-(n-1)/2)/(Math.max(1,n-1)/2);

      const axisX=Math.sin(layer*1.8+spin*.22)*axisAmp+axisTwist*.12;
      const axisY=Math.cos(layer*1.25+spin*.18)*axisAmp*.16;
      const x=axisX+Math.cos(angle)*radius;
      const y=baseY+axisY+Math.sin(angle)*ellipse+layer*vertical;

      const zStart=10+depth*34;
      const zEnd=(depth-.5)*54+Math.sin(layer*2.2+spin*.16)*8;
      const z=lerp(zStart,zEnd,e);

      const scaleStart=(.72+depth*.50)*densityScale;
      const scaleEnd=(.58+depth*.42)*densityScale;
      const scale=lerp(scaleStart,scaleEnd,e);

      const rotStart=(spin*180/Math.PI)*(i%2?-.26:.26)+Math.sin(angle)*8;
      const rotEnd=(spin*180/Math.PI)*(i%2?-.24:.24)+Math.sin(angle)*9;
      const rot=lerp(rotStart,rotEnd,e);
      const rx=lerp(-12+Math.cos(angle)*10,-14+Math.cos(angle+layer*.4)*17,e);
      const ry=lerp(10+Math.sin(angle)*12,11+Math.sin(angle-layer*.3)*20,e);

      setT(el,x,y,scale,rot,rx,ry,z);
      el.style.opacity=String(.64+depth*.36);
    });
  },token);
  if(token!==playToken)return;

  const spinVortexEnd=spin;

  // 5) 超高速竜巻の勢いを保ったまま中心へギュッと圧縮し、その圧縮エネルギーを閃光として見せる。
  const omega5Start=omega4End;
  const omega5End=Math.PI*2*34.0;
  const phase5Duration=1540;

  const sparkleCount=Math.min(38,Math.max(20,n*3));
  const sparkleSeeds=Array.from({length:sparkleCount},(_,i)=>({
    el:(()=>{
      const s=document.createElement("div");
      s.className="spark";
      core.appendChild(s);
      return s;
    })(),
    angle:(i/sparkleCount)*Math.PI*2+Math.random()*.45,
    radius:34+Math.random()*92,
    y:-72+Math.random()*144,
    z:-24+Math.random()*70,
    phase:Math.random()*Math.PI*2,
    speed:(Math.random()<.5?-1:1)*(.35+Math.random()*.45),
    pulse:.75+Math.random()*1.4,
    size:.55+Math.random()*.95
  }));

  await frameTween(phase5Duration,(p,elapsed)=>{
    const e=easeInOut(p);
    const prog=spinProgress(spinVortexEnd,omega5Start,omega5End,elapsed,phase5Duration);
    spin=prog.spin;

    // The flash and the squeeze are the same event: light is born from the compression.
    const squeeze=easeInOut(clamp((p-.12)/.62));
    const coreHold=easeInOut(clamp((p-.72)/.18));
    const flashRise=easeOut(clamp((p-.20)/.28));
    const flashHold=1-.02*easeInOut(clamp((p-.92)/.08));
    const peak=flashRise*flashHold;

    // Collapse the whole vortex to an unmistakably tiny luminous nucleus.
    const radius=lerp(24,.65,squeeze);
    const ellipse=lerp(10,.34,squeeze);
    const vertical=lerp(196,1.2,squeeze);
    const axisAmp=lerp(16,.22,squeeze);
    const baseY5=lerp(-86,-8,squeeze);

    flash.style.opacity=String(peak*.99);
    portalGlow.style.opacity=String(.86+peak*.14);
    portalGlow.style.transform=`translate(-50%,-50%) scale(${lerp(1.02,.12,squeeze)})`;
    whiteRoom.style.transform=`scale(${lerp(1.10,1.22,squeeze)})`;

    g.forEach((el,i)=>{
      const angle=baseAngles[i]+spin;
      const depth=(Math.sin(angle)+1)/2;
      const layer=(i-(n-1)/2)/(Math.max(1,n-1)/2);

      const axisX=Math.sin(layer*1.8+spin*.22)*axisAmp;
      const axisY=Math.cos(layer*1.25+spin*.18)*axisAmp*.14;
      const x=axisX+Math.cos(angle)*radius;
      const y=baseY5+axisY+Math.sin(angle)*ellipse+layer*vertical;

      const zStart=(depth-.5)*54+Math.sin(layer*2.2+spin*.16)*8;
      const zEnd=(depth-.5)*2.4;
      const z=lerp(zStart,zEnd,squeeze);

      const scaleStart=(.58+depth*.42)*densityScale;
      const scaleEnd=(.18+depth*.05)*densityScale;
      const scale=lerp(scaleStart,scaleEnd,squeeze);

      const rotStart=(spin*180/Math.PI)*(i%2?-.24:.24)+Math.sin(angle)*9;
      const rotEnd=(spin*180/Math.PI)*(i%2?-.26:.26)+Math.sin(angle)*9;
      const rot=lerp(rotStart,rotEnd,e);
      const rx=lerp(-14+Math.cos(angle+layer*.4)*17,-16+Math.cos(angle+layer*.35)*15,e);
      const ry=lerp(11+Math.sin(angle-layer*.3)*20,12+Math.sin(angle-layer*.25)*18,e);

      setT(el,x,y,scale,rot,rx,ry,z);
      el.style.opacity=String(lerp(.72+depth*.28,.96,coreHold));
      el.style.filter=`brightness(${1+peak*4.2+coreHold*2.1}) blur(${peak*1.6+coreHold*1.8}px)`;

      if(p>.43&&!el.dataset.converted){
        el.textContent=[...out][i]||el.textContent;
        el.style.fontFamily='"Noto Serif Hentaigana","Yu Mincho","Hiragino Mincho ProN",serif';
        el.dataset.converted="1";
      }
    });

    const sparkBirth=easeOut(clamp((p-.58)/.42));
    sparkleSeeds.forEach((s,i)=>{
      const tt=elapsed/1000;
      const ang=s.angle+tt*s.speed;
      const r=lerp(5,7,sparkBirth)*(1-squeeze*.72);
      const x=Math.cos(ang)*r;
      const y=lerp(-10,-7,squeeze)+Math.sin(tt*1.6+s.phase)*2*(1-squeeze);
      const z=lerp(8,s.z*.08,sparkBirth)*(1-squeeze*.70);
      const pulse=.45+.55*Math.sin(tt*5.2*s.pulse+s.phase)**2;
      setT(s.el,x,y,s.size*(.45+.55*sparkBirth)*pulse,0,0,0,z);
      s.el.style.opacity=String(sparkBirth*(.45+.55*pulse));
      s.el.style.filter=`blur(${(1-pulse)*.6}px)`;
    });
  },token);
  if(token!==playToken)return;

  const spinFlashEnd=spin;

  // 6) 閃光が明ける瞬間そのものを「誕生の破裂光」にする。
  //    強い白光の中で花火のようにぱっと散り、その勢いを失いながら、ひらひら自由落下へ連続移行。
  const phase6Duration=2350;
  const hiddenPoseMs=95;
  const birthBurstMs=185;
  const flashOpenDelayMs=165;
  const flashOpenMs=620;

  const petalState=(i,timeMs)=>{
    const s=seeds[i];
    const layer=(i-(n-1)/2)/(Math.max(1,n-1)/2);
    const tt=timeMs/1000;

    // The burst landing position IS the new home position.
    // Nothing here moves the glyph back toward the center.
    const scatterBase=Math.min(246,Math.max(158,innerWidth*.35));
    const anchorAngle=baseAngles[i]+s.phase*.18+s.scatterAngleJitter;
    const anchorR=scatterBase*s.scatterRadiusMul+Math.abs(layer)*20;

    // Slow ash-like fall. Individual speed differences make the cloud feel alive.
    const fall=(16*s.fallSpeedMul)*tt
      +24*s.fallSpeedMul*(1-Math.exp(-tt*1.15));

    const anchorX=Math.cos(anchorAngle)*anchorR+layer*12+s.ashDriftX;
    const anchorY=-30+Math.sin(anchorAngle)*anchorR*.50+layer*22+fall;
    const anchorZ=Math.sin(anchorAngle*1.31+s.phase)*Math.min(112,anchorR*.46)+s.ashDriftZ;

    const swayX=Math.sin(tt*(.88+s.floatFreqX*.24)+s.phase*1.35)*(29*s.floatAmpX)
      +Math.sin(tt*.43+s.phase*.62)*11;
    const swayY=Math.cos(tt*(.78+s.floatFreqY*.20)+s.phase*1.12)*(15*s.floatAmpY)
      +Math.sin(tt*.37+s.phase)*8;
    const swayZ=Math.sin(tt*(.96+s.floatFreqZ*.22)+s.phase)*(18*s.floatAmpZ)
      +Math.cos(tt*.47+s.phase*.74)*9;

    // Rare whimsical glyphs wander against the flow or hover oddly,
    // but the offset stays bounded so they can still rejoin the finale.
    const whimX=s.whimsical
      ? Math.sin(tt*.57+s.whimPhase)*s.whimAmp*s.whimSign
      : 0;
    const whimY=s.whimsical
      ? -Math.sin(Math.min(tt/3.2,1)*Math.PI)*s.whimAmp*.42
      : 0;
    const whimZ=s.whimsical
      ? Math.cos(tt*.49+s.whimPhase)*s.whimAmp*.78
      : 0;

    return {
      x:anchorX+swayX+whimX,
      y:anchorY+swayY+whimY,
      z:anchorZ+swayZ+whimZ,
      rot:Math.sin(tt*1.18+s.phase)*6.4+(s.whimsical?Math.sin(tt*.52+s.whimPhase)*4.5:0),
      rx:-3+Math.sin(tt*1.34+s.phase)*15+(s.whimsical?Math.cos(tt*.61+s.whimPhase)*7:0),
      ry:Math.cos(tt*1.24+s.phase)*17+(s.whimsical?Math.sin(tt*.55+s.whimPhase)*8:0)
    };
  };

  const sparkPetalState=(s,timeMs)=>{
    const tt=timeMs/1000;
    const fall=14*tt+20*(1-Math.exp(-tt*1.12));
    const ang=s.angle+Math.sin(tt*.23+s.phase)*.18;
    const spreadR=Math.min(285,Math.max(184,innerWidth*.41))*(.78+s.radius/260);
    return {
      x:Math.cos(ang)*spreadR+Math.sin(tt*.91+s.phase)*22,
      y:-18+Math.sin(ang)*spreadR*.58+fall+Math.sin(tt*1.03+s.phase)*12,
      z:Math.sin(ang*1.47+s.phase)*Math.min(138,spreadR*.50)+Math.cos(tt*.83+s.phase)*22,
      pulse:.45+.55*Math.sin(tt*5.0*s.pulse+s.phase)**2
    };
  };

  await frameTween(phase6Duration,(p,elapsed)=>{
    const visibleTime=Math.max(0,elapsed-hiddenPoseMs);
    const burst=easeOut(clamp(visibleTime/birthBurstMs));
    // Keep the first expansion hidden inside the glare, then reveal the overshoot as the light opens.
    const flashOpen=easeInOut(clamp((visibleTime-flashOpenDelayMs)/flashOpenMs));
    const soften=easeInOut(clamp((visibleTime-120)/1850));

    const blastGlow=1-easeInOut(clamp((visibleTime-80)/520));
    flash.style.opacity=String(elapsed<hiddenPoseMs ? .995 : Math.max((1-flashOpen)*.995,blastGlow*.72));
    whiteRoom.style.opacity=String(lerp(1,.85,soften));
    portalGlow.style.opacity=String(lerp(1,.16,soften));
    portalGlow.style.transform=`translate(-50%,-50%) scale(${lerp(.12,1.48,easeOut(clamp(visibleTime/260)))})`;
    rushLines.style.opacity=String(lerp(.98,.10,soften));

    g.forEach((el,i)=>{
      const s=seeds[i];
      const layer=(i-(n-1)/2)/(Math.max(1,n-1)/2);

      // Exact phase-5 endpoint, hidden inside the birth flash.
      const endAngle=baseAngles[i]+spinFlashEnd;
      const endDepth=(Math.sin(endAngle)+1)/2;
      const endAxisX=Math.sin(layer*1.8+spinFlashEnd*.22)*.22;
      const endAxisY=Math.cos(layer*1.25+spinFlashEnd*.18)*.22*.14;
      const startX=endAxisX+Math.cos(endAngle)*.65;
      const startY=-8+endAxisY+Math.sin(endAngle)*.34+layer*1.2;
      const startZ=(endDepth-.5)*2.4;
      const startScale=(.18+endDepth*.05)*densityScale;

      const petal=petalState(i,visibleTime);

      // Tiny nucleus -> dispersed ash trajectory. No overshoot-and-return.
      const x=lerp(startX,petal.x,burst);
      const y=lerp(startY,petal.y,burst);
      const z=lerp(startZ,petal.z,burst);

      const targetDepth=.5+.5*Math.sin(s.phase+visibleTime*.0009);
      const targetScale=(.55+targetDepth*.15)*densityScale;
      const scale=lerp(startScale,targetScale*1.14,burst);

      setT(
        el,x,y,scale,
        petal.rot*burst,
        petal.rx*burst,
        petal.ry*burst,
        z
      );
      el.style.opacity=String(lerp(.78,.92,soften));
      el.style.filter="none";
    });

    sparkleSeeds.forEach((s,i)=>{
      const petal=sparkPetalState(s,visibleTime);
      const startR=3.5;
      const startX=Math.cos(s.angle)*startR;
      const startY=-8+Math.sin(s.angle)*startR*.25;
      const startZ=2;

      setT(
        s.el,
        lerp(startX,petal.x,burst),
        lerp(startY,petal.y,burst),
        s.size*(.84+.72*petal.pulse),
        0,0,0,
        lerp(startZ,petal.z,burst)
      );
      s.el.style.opacity=String(burst*(.56+.44*petal.pulse));
      s.el.style.filter=`blur(${(1-petal.pulse)*.6}px)`;
    });
  },token);
  if(token!==playToken)return;
  flash.style.opacity="0";

  // 7) ひらひら自由落下の余韻。そのまま無重力寄りの漂いへ移り、まだ集団運動には戻さない。
  const phase7Duration=1900;

  await frameTween(phase7Duration,(p,elapsed)=>{
    const petalTime=phase6Duration+elapsed;

    g.forEach((el,i)=>{
      const s=seeds[i];
      const pos=petalState(i,petalTime);
      const depth=.5+.5*Math.sin(s.phase+petalTime*.0009);
      const scale=(.55+depth*.15)*densityScale;
      setT(el,pos.x,pos.y,scale,pos.rot,pos.rx,pos.ry,pos.z);
      el.style.opacity=".92";
    });

    sparkleSeeds.forEach(s=>{
      const pos=sparkPetalState(s,petalTime);
      setT(s.el,pos.x,pos.y,s.size*(.72+.58*pos.pulse),0,0,0,pos.z);
      s.el.style.opacity=String(.48+.48*pos.pulse);
      s.el.style.filter=`blur(${(1-pos.pulse)*.7}px)`;
    });

    whiteRoom.style.opacity=String(lerp(.85,.81,easeInOut(p)));
    portalGlow.style.opacity=String(lerp(.16,.11,easeInOut(p)));
    rushLines.style.opacity=String(lerp(.10,.07,easeInOut(p)));
  },token);
  if(token!==playToken)return;

  // 8) 漂流から今回の「集団演技」へ。円・円環・龍・ぴょこぴょこ整列を毎回ひとつ選ぶ。
  const phase8Duration=3300;
  const petalBaseTime=phase6Duration+phase7Duration;
  const groupOmegaStart=Math.PI*2*.035;
  const groupOmegaEnd=ensembleMode==="chick"
    ? Math.PI*2*.13
    : Math.PI*2*(ensembleMode==="dragon"?1.10:.48);
  const groupAccel=(groupOmegaEnd-groupOmegaStart)/(phase8Duration/1000);
  const groupR=Math.min(156,Math.max(96,innerWidth*.24));
  const groupRY=Math.min(74,groupR*.50);
  const groupVertical=28;
  const groupCenterAmpX=7;
  const groupCenterAmpY=6;
  const chickSpacing=Math.min(72,Math.max(34,(innerWidth*.72)/Math.max(1,n-1)));
  let groupTheta=0;

  const ensemblePose=(i,theta,timeSec)=>{
    const s=seeds[i];
    const layer=(i-(n-1)/2)/(Math.max(1,n-1)/2);
    const angle=baseAngles[i]+theta;
    const depth=(Math.sin(angle)+1)/2;

    if(ensembleMode==="circle"){
      return {
        x:Math.cos(angle)*groupR,
        y:-10+Math.sin(angle)*groupR*.72,
        z:Math.sin(timeSec*.83+s.phase)*8,
        scale:(.58+depth*.08)*densityScale,
        rot:Math.sin(angle)*5,
        rx:Math.sin(timeSec*.91+s.phase)*5,
        ry:Math.cos(timeSec*.88+s.phase)*7
      };
    }

    if(ensembleMode==="ring"){
      return {
        x:Math.cos(angle)*groupR,
        y:-12+Math.sin(angle)*groupRY,
        z:Math.sin(angle)*92,
        scale:(.55+depth*.28)*densityScale,
        rot:Math.sin(angle)*7,
        rx:-8+Math.cos(angle)*14,
        ry:Math.sin(angle)*18
      };
    }

    if(ensembleMode==="dragon"){
      const trail=layer*.78;
      const t=theta-trail;
      const ampX=Math.min(270,innerWidth*.46);
      const ampY=Math.min(168,innerHeight*.24);
      return {
        x:Math.sin(t)*ampX
          +Math.sin(t*3.4+s.phase)*24
          +Math.cos(t*5.2+s.phase*.7)*10,
        y:-6+Math.sin(t*2.22+.52)*ampY
          +Math.cos(t*4.05+s.phase)*18,
        z:Math.cos(t*1.31)*108+Math.sin(t*3.0+s.phase)*28,
        scale:(.54+(.5+.5*Math.sin(t))*.30)*densityScale,
        rot:Math.cos(t*1.4)*16,
        rx:-12+Math.cos(t*1.7)*30,
        ry:Math.sin(t*1.35)*38
      };
    }

    // "Chick" mode: no grand orbit. Characters hop one after another into a neat row.
    const hopPhase=timeSec*8.8-i*.62;
    const hop=Math.pow(Math.max(0,Math.sin(hopPhase)),1.72);
    return {
      x:(i-(n-1)/2)*chickSpacing,
      y:26-hop*42+Math.sin(timeSec*1.2+s.phase)*2.5,
      z:Math.sin(hopPhase*.45)*8,
      scale:.68*densityScale*(1+hop*.05),
      rot:Math.sin(hopPhase)*4.5,
      rx:-hop*8,
      ry:Math.cos(hopPhase*.55)*5
    };
  };

  await frameTween(phase8Duration,(p,elapsed)=>{
    const tSec=elapsed/1000;
    groupTheta=groupOmegaStart*tSec+.5*groupAccel*tSec*tSec;
    const groupBlend=easeInOut(clamp((p-.02)/.98));
    const time=petalBaseTime+elapsed;

    g.forEach((el,i)=>{
      const s=seeds[i];
      const petal=petalState(i,time);
      let gatherStart=.02+s.gatherLag;
      if(i===rogueIndex&&rogueType==="early")gatherStart=Math.max(0,gatherStart-.20);
      const charBlend=easeInOut(clamp((p-gatherStart)/Math.max(.001,1-gatherStart)));
      const pose=ensemblePose(i,groupTheta,tSec);

      let extraX=0,extraY=0,extraZ=0;
      const rogueBeat=Math.sin(Math.PI*clamp((p-.28)/.50));
      if(i===rogueIndex){
        if(rogueType==="reverse"){
          extraX=-Math.sin(groupTheta*1.7+s.whimPhase)*110*rogueBeat;
          extraY=Math.cos(groupTheta*1.2+s.whimPhase)*26*rogueBeat;
        }else if(rogueType==="drop"){
          extraY=126*rogueBeat;
          extraX=s.whimSign*20*rogueBeat;
        }else if(rogueType==="wander"){
          extraX=s.whimSign*120*rogueBeat;
          extraZ=80*Math.sin(p*Math.PI*2)*rogueBeat;
        }
      }

      const x=lerp(petal.x,pose.x+extraX,charBlend);
      const y=lerp(petal.y,pose.y+extraY,charBlend);
      const z=lerp(petal.z,pose.z+extraZ,charBlend);

      const petalDepth=.5+.5*Math.sin(s.phase+time*.0009);
      const petalScale=(.55+petalDepth*.15)*densityScale;
      const scale=lerp(petalScale,pose.scale,charBlend);
      const rot=lerp(petal.rot,pose.rot,charBlend);
      const rx=lerp(petal.rx,pose.rx,charBlend);
      const ry=lerp(petal.ry,pose.ry,charBlend);

      setT(el,x,y,scale,rot,rx,ry,z);
      el.style.opacity=String(lerp(.92,.98,charBlend));
      el.style.filter="none";
    });

    sparkleSeeds.forEach((s,i)=>{
      const petal=sparkPetalState(s,time);
      const fakeIndex=Math.min(n-1,Math.floor((i/sparkleCount)*Math.max(1,n)));
      const pose=ensemblePose(fakeIndex,groupTheta,tSec);
      const spread=18+(i%5)*4;
      const x=lerp(petal.x,pose.x+Math.sin(s.angle)*spread,groupBlend);
      const y=lerp(petal.y,pose.y+Math.cos(s.angle)*spread*.55,groupBlend);
      const z=lerp(petal.z,pose.z+Math.sin(s.phase)*28,groupBlend);
      setT(s.el,x,y,s.size*(.66+.54*petal.pulse),0,0,0,z);
      s.el.style.opacity=String((.42+.48*petal.pulse)*lerp(1,.82,groupBlend));
    });

    whiteRoom.style.opacity=String(lerp(.81,.86,groupBlend));
    portalGlow.style.opacity=String(lerp(.11,.24,groupBlend));
    rushLines.style.opacity=String(lerp(.07,.20,groupBlend));
  },token);
  if(token!==playToken)return;

  // 9) 今回の退場パターン。集団演技の終端からそのまま連続し、最後だけ大きく加速する。
  const phase9Duration=exitMode==="camera"?2500:(exitMode==="far"?2250:2050);
  const finalOmegaStart=groupOmegaEnd;
  const finalOmegaEnd=ensembleMode==="chick"
    ? Math.PI*2*.85
    : Math.PI*2*(ensembleMode==="dragon"?9.0:10.2);
  const finalAccel=(finalOmegaEnd-finalOmegaStart)/(phase9Duration/1000);

  await frameTween(phase9Duration,(p,elapsed)=>{
    const tSec=elapsed/1000;
    const theta=groupTheta+finalOmegaStart*tSec+.5*finalAccel*tSec*tSec;
    const sceneTime=phase8Duration/1000+tSec*1.35;

    g.forEach((el,i)=>{
      const s=seeds[i];
      const pose=ensemblePose(i,theta,sceneTime);
      const order=n<=1?0:i/(n-1);

      // Small stagger keeps the group organic. The far-away late chaser intentionally waits much longer.
      let start=.20+order*.10+s.rushLag*.18;
      if(i===lateChaserIndex)start=.64;
      const depart=easeIn(clamp((p-start)/Math.max(.001,1-start)));

      let tx=pose.x,ty=pose.y,tz=pose.z,targetScale=pose.scale,targetOpacity=1;
      const dirAngle=baseAngles[i]+s.scatterAngleJitter;

      if(exitMode==="up"){
        tx=pose.x*.70+s.ashDriftX*2;
        ty=-innerHeight*.72-(i%4)*28;
        tz=120+s.ashDriftZ*2;
        targetScale=.36*densityScale;
        targetOpacity=0;
      }else if(exitMode==="down"){
        tx=pose.x*.68+s.ashDriftX*2;
        ty=innerHeight*.74+(i%4)*26;
        tz=80+s.ashDriftZ*2;
        targetScale=.38*densityScale;
        targetOpacity=0;
      }else if(exitMode==="far"){
        tx=pose.x*.16;
        ty=pose.y*.16-16;
        tz=-1250;
        targetScale=.07*densityScale;
        targetOpacity=0;
      }else if(exitMode==="burst"){
        tx=Math.cos(dirAngle)*innerWidth*.82;
        ty=Math.sin(dirAngle)*innerHeight*.70;
        tz=s.ashDriftZ*4+Math.sin(dirAngle*1.7)*180;
        targetScale=.42*densityScale;
        targetOpacity=0;
      }else if(exitMode==="diagonal"){
        tx=diagonalSign*innerWidth*.82+(i-(n-1)/2)*22;
        ty=-innerHeight*.42+(i%3)*54;
        tz=180+(i%4)*42;
        targetScale=.34*densityScale;
        targetOpacity=0;
      }else{
        // Camera: preserve glyph form much longer than before.
        tx=(i-(n-1)/2)*3+s.ashDriftX*.22;
        ty=-4+(i%3-1)*5;
        tz=780;
        targetScale=6.45;
        targetOpacity=0;
      }

      let x=lerp(pose.x,tx,depart);
      let y=lerp(pose.y,ty,depart);
      let z=lerp(pose.z,tz,depart);
      let scale=lerp(pose.scale,targetScale,depart);
      let rot=lerp(pose.rot,(i%2?-1:1)*28,depart);
      let rx=lerp(pose.rx,0,depart);
      let ry=lerp(pose.ry,0,depart);
      let opacity=lerp(.98,targetOpacity,easeIn(clamp((depart-.72)/.28)));
      let blur=exitMode==="camera"?depart*2.1:depart*5.5;

      // Rare camera splat: one or two glyphs hit the "glass", panic, then scramble after the group.
      const slapSlot=slapIndices.indexOf(i);
      if(exitMode==="camera"&&slapSlot>=0){
        const approach=easeIn(clamp((p-.22-slapSlot*.035)/.34));
        const hitStart=.54+slapSlot*.035;
        const panic=easeInOut(clamp((p-hitStart)/.19));
        const escape=easeIn(clamp((p-(hitStart+.18))/.28));
        const slapX=(slapSlot===0?-1:1)*(28+slapSlot*16);
        const slapY=-8+slapSlot*30;

        x=lerp(pose.x,slapX,approach);
        y=lerp(pose.y,slapY,approach);
        z=lerp(pose.z,900,approach);
        scale=lerp(pose.scale,8.25,approach);
        rot=lerp(pose.rot,(slapSlot===0?-7:8),approach);
        rx=lerp(pose.rx,0,approach);
        ry=lerp(pose.ry,0,approach);
        opacity=1;
        blur=approach*1.1;

        // Nervous little shiver after impact.
        x+=Math.sin(p*150+s.whimPhase)*8*panic*(1-escape);
        y+=Math.cos(p*128+s.whimPhase)*5*panic*(1-escape);

        if(i===slapDropIndex){
          // One rare splat peels downward first, then realizes the group has left and bolts after it.
          const peelDrop=easeInOut(clamp((p-(hitStart+.07))/.18));
          y+=peelDrop*116*(1-escape);
          rot+=peelDrop*18*s.whimSign;
        }

        // Panic chase through/away from the camera.
        x=lerp(x,0,escape);
        y=lerp(y,0,escape);
        z=lerp(z,1120,escape);
        scale=lerp(scale,10.2,escape);
        opacity=1-easeIn(clamp((escape-.68)/.32));
        blur=lerp(1.1,2.8,escape);
      }

      // Left-behind glyph hovers while everyone else disappears, then sprints after them.
      if(exitMode==="far"&&i===lateChaserIndex){
        const waiting=clamp((p-.18)/.44);
        const chase=easeIn(clamp((p-.64)/.36));
        if(p<.64){
          x=pose.x+Math.sin(p*34+s.whimPhase)*8*waiting;
          y=pose.y+Math.cos(p*27+s.whimPhase)*5*waiting;
          z=pose.z;
          scale=pose.scale;
          opacity=.98;
          blur=0;
        }else{
          x=lerp(pose.x,0,chase);
          y=lerp(pose.y,-18,chase);
          z=lerp(pose.z,-1650,chase);
          scale=lerp(pose.scale,.035,chase);
          opacity=1-easeIn(clamp((chase-.74)/.26));
          blur=chase*4.2;
          rot+=Math.sin(p*90)*11*(1-chase);
        }
      }

      setT(el,x,y,scale,rot,rx,ry,z);
      el.style.opacity=String(clamp(opacity));
      el.style.filter=`blur(${blur}px) brightness(${1+(exitMode==="camera"?depart*.65:depart*.22)})`;
    });

    sparkleSeeds.forEach((s,i)=>{
      const fakeIndex=Math.min(n-1,Math.floor((i/sparkleCount)*Math.max(1,n)));
      const pose=ensemblePose(fakeIndex,theta,sceneTime);
      const fade=1-easeIn(clamp((p-.38)/.62));
      let sx=pose.x+Math.sin(s.angle)*24;
      let sy=pose.y+Math.cos(s.angle)*14;
      let sz=pose.z+Math.sin(s.phase)*32;
      if(exitMode==="camera"){
        const q=easeIn(clamp((p-.25)/.75));
        sx=lerp(sx,0,q); sy=lerp(sy,0,q); sz=lerp(sz,720,q);
      }else if(exitMode==="far"){
        const q=easeIn(clamp((p-.25)/.75));
        sx*=1-q*.85; sy*=1-q*.85; sz=lerp(sz,-950,q);
      }
      const pulse=.45+.55*Math.sin((petalBaseTime+phase8Duration+elapsed)*.005*s.pulse+s.phase)**2;
      setT(s.el,sx,sy,s.size*(.65+.52*pulse),0,0,0,sz);
      s.el.style.opacity=String((.35+.48*pulse)*fade);
    });

    whiteRoom.style.opacity=String(lerp(.86,1,p));
    rushLines.style.opacity=String(lerp(exitMode==="camera"?.44:.28,0,p));
    portalGlow.style.opacity=String(lerp(exitMode==="camera"?.34:.22,0,p));
  },token);
  if(token!==playToken)return;

  sparkleSeeds.forEach(s=>s.el.remove());
  g.forEach(el=>el.remove());

  // 10) 重量級刻印。突進後は白背景で一拍置き、それから「ダン、ダン、ダン！」へ。
  whiteRoom.style.opacity="1";
  whiteRoom.style.transform="none";
  whiteRoom.style.background="#fff";
  rushLines.style.opacity="0";
  portalGlow.style.opacity="0";
  flash.style.opacity="0";
  await sleep(420);
  if(token!==playToken)return;
  board.innerHTML="";
  setupStampBoard(out);
  [...out].forEach(ch=>{
    const s=document.createElement("div");
    s.className="stamp";
    s.textContent=ch;
    board.appendChild(s);
  });
  board.style.opacity=1;
  label.style.opacity=0;
  await sleep(90);
  if(token!==playToken)return;

  const stamps=[...board.children];
  for(let i=0;i<stamps.length;i++){
    if(token!==playToken)return;
    const stamp=stamps[i];
    const wave=document.createElement("div");
    wave.className="impactWave";

    // offsetLeft/offsetTop are the untransformed final layout box.
    // getBoundingClientRect() was wrong here because .stamp starts translated/scaled.
    const cx=stamp.offsetLeft+stamp.offsetWidth/2;
    const cy=stamp.offsetTop+stamp.offsetHeight/2;
    wave.style.left=`${cx}px`;
    wave.style.top=`${cy}px`;

    const waveSize=Math.max(104,Math.min(154,stamp.offsetHeight*1.55));
    wave.style.width=`${waveSize}px`;
    wave.style.height=`${waveSize}px`;
    wave.style.marginLeft=`${-waveSize/2}px`;
    wave.style.marginTop=`${-waveSize/2}px`;

    board.appendChild(wave);
    setTimeout(()=>wave.remove(),820);

    stamp.classList.add("hit");

    core.classList.remove("shake");
    void core.offsetWidth;
    core.classList.add("shake");

    stage.animate([
      {transform:"translate3d(0,0,0) scale(1)"},
      {offset:.10,transform:"translate3d(0,24px,0) scale(.974)"},
      {offset:.24,transform:"translate3d(-4px,-11px,0) scale(1.014)"},
      {offset:.42,transform:"translate3d(3px,8px,0) scale(.989)"},
      {offset:.62,transform:"translate3d(-2px,-4px,0) scale(1.006)"},
      {offset:.80,transform:"translate3d(1px,2px,0) scale(.998)"},
      {transform:"translate3d(0,0,0) scale(1)"}
    ],{duration:660,easing:"cubic-bezier(.06,.70,.08,1)"});

    flash.animate(
      [{opacity:0},{opacity:.42,offset:.10},{opacity:.14,offset:.34},{opacity:0}],
      {duration:460,fill:"forwards",easing:"ease-out"}
    );

    if(navigator.vibrate)navigator.vibrate([65,28,110]);
    const stampBeat=n<=8?480:(n<=14?390:310);
    await sleep(stampBeat);
  }

  label.animate(
    [{opacity:0,transform:"translate(-50%,8px)"},{opacity:1,transform:"translate(-50%,0)"}],
    {duration:420,fill:"forwards",easing:"cubic-bezier(.16,.84,.22,1)"}
  );
  glow.animate(
    [{opacity:0,transform:"translate(-50%,-50%) scale(.45)"},{opacity:1,transform:"translate(-50%,-50%) scale(1)"}],
    {duration:620,fill:"forwards",easing:"cubic-bezier(.16,.84,.22,1)"}
  );

  await sleep(1050);
  if(token!==playToken)return;
  input.value=out;
  input.style.fontFamily='"Noto Serif Hentaigana","Yu Mincho","Hiragino Mincho ProN",serif';
  input.style.color="";
  input.style.caretColor="";
  clearStage(false);
}
btn.addEventListener("click",play);
input.addEventListener("keydown",e=>{if(e.key==="Enter")play()});
skip.addEventListener("click",()=>{
  const src=input.value.trim()||"あさきゆめみし";
  const out=[...src].map(c=>firstVariant[c]||c).join("");
  playToken++;
  input.style.color="";
  input.style.caretColor="";
  finishInstant(out);
  setTimeout(()=>{input.value=out;clearStage(false)},700);
});
</script>
</body>
