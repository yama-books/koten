<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>変体仮名メーカー・変換演出プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Noto+Serif+Hentaigana:400,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f0e8;
    --paper2:#ebe2d4;
    --ink:#1d1a17;
    --muted:#766f68;
    --gold:#b08a4a;
    --gold2:#e6c987;
    --glass:rgba(255,255,255,.58);
    --shadow:0 22px 60px rgba(42,31,20,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 50% 12%, rgba(255,255,255,.9), transparent 34%),
      linear-gradient(160deg,var(--paper),var(--paper2));
    overflow:hidden;
  }
  body:before{
    content:"";
    position:fixed; inset:0; pointer-events:none; opacity:.15;
    background-image:
      linear-gradient(90deg, rgba(80,60,40,.07) 1px, transparent 1px),
      linear-gradient(rgba(80,60,40,.05) 1px, transparent 1px);
    background-size:28px 28px;
    mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent);
  }
  .app{
    height:100%;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:max(20px,env(safe-area-inset-top)) clamp(18px,4vw,44px) max(20px,env(safe-area-inset-bottom));
    position:relative;
    z-index:2;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    max-width:980px; width:100%; margin:0 auto;
  }
  .brand{display:flex; align-items:center; gap:12px}
  .seal{
    width:38px;height:38px;border-radius:12px;border:1px solid rgba(29,26,23,.18);
    display:grid;place-items:center;font-family:serif;font-size:18px;background:rgba(255,255,255,.34);
  }
  .brand b{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:600;letter-spacing:.08em}
  .mode{font-size:12px;color:var(--muted);letter-spacing:.08em}
  main{
    display:grid;place-items:center;position:relative;min-height:0;
  }
  .panel{
    width:min(860px,100%);
    border:1px solid rgba(70,55,40,.12);
    background:var(--glass);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:30px;
    box-shadow:var(--shadow);
    padding:clamp(26px,5vw,56px);
    position:relative;
    overflow:hidden;
  }
  .panel:before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(120deg,rgba(255,255,255,.32),transparent 28%,transparent 70%,rgba(176,138,74,.05));
  }
  .eyebrow{font-size:12px;letter-spacing:.16em;color:var(--muted);margin-bottom:14px}
  h1{
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:clamp(28px,5vw,52px);
    margin:0 0 14px; font-weight:600; letter-spacing:.06em;
  }
  .lead{color:var(--muted);font-size:14px;line-height:1.8;margin-bottom:28px}
  .composer{
    display:grid;grid-template-columns:1fr auto;gap:12px;
    background:rgba(255,255,255,.48);
    border:1px solid rgba(52,42,32,.12);
    border-radius:20px;padding:10px;
  }
  input{
    min-width:0;border:0;background:transparent;outline:none;
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:clamp(22px,4vw,34px);padding:12px 14px;color:var(--ink);
    letter-spacing:.12em;
  }
  button{
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    border:0;border-radius:14px;padding:0 22px;min-height:56px;
    background:var(--ink);color:#fff;font-weight:700;letter-spacing:.08em;
    box-shadow:0 8px 22px rgba(29,26,23,.22);
    cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;
  }
  button:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(29,26,23,.25)}
  button:active{transform:translateY(1px) scale(.99)}
  button:disabled{opacity:.45;cursor:default}
  .hint{margin-top:14px;font-size:12px;color:var(--muted)}
  footer{font-size:11px;color:rgba(65,56,48,.55);text-align:center}
  #stage{
    position:fixed;inset:0;z-index:20;pointer-events:none;
    display:grid;place-items:center;perspective:1100px;
    opacity:0;visibility:hidden;
  }
  #stage.active{opacity:1;visibility:visible}
  .veil{
    position:absolute;inset:0;background:
      radial-gradient(circle at 50% 48%,rgba(255,255,255,.08),rgba(22,18,15,.38));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;
  }
  .stage-core{
    position:relative;width:min(96vw,900px);height:min(68vh,620px);
    transform-style:preserve-3d;
  }
  .glyph{
    position:absolute;left:50%;top:50%;
    width:70px;height:90px;margin:-45px 0 0 -35px;
    display:grid;place-items:center;
    font-family:"Noto Serif Hentaigana","Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:58px;line-height:1;color:#fff;
    text-shadow:0 3px 22px rgba(0,0,0,.26);
    transform-style:preserve-3d;
    will-change:transform,opacity,filter;
    opacity:0;
  }
  .glyph:after{
    content:"";position:absolute;inset:4px 9px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.3),transparent 68%);
    filter:blur(8px);z-index:-1;opacity:.6;
  }
  .spark{
    position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;
    background:#fff;box-shadow:0 0 12px 4px rgba(255,241,198,.8);
    opacity:0;
  }
  .flash{
    position:fixed;inset:-10%;z-index:40;opacity:0;
    background:radial-gradient(circle at 50% 50%,#fff 0%,#fff 18%,rgba(255,250,228,.98) 30%,rgba(255,244,192,.72) 48%,transparent 72%);
    mix-blend-mode:screen;
  }
  .stampboard{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    gap:clamp(2px,1.2vw,12px);padding:20px;
    opacity:0;transform:translateZ(80px);
  }
  .stamp{
    font-family:"Noto Serif Hentaigana","Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:clamp(46px,8.8vw,90px);font-weight:600;
    color:var(--ink);opacity:0;transform:translateY(-138px) scale(2.15);
    filter:blur(14px);
    text-shadow:0 1px 0 rgba(255,255,255,.7);
  }
  .stamp.hit{animation:stampHit .46s cubic-bezier(.08,.78,.10,1.20) forwards}
  @keyframes stampHit{
    0%{opacity:0;transform:translateY(-138px) scale(2.15);filter:blur(14px)}
    34%{opacity:1;transform:translateY(18px) scale(.74,.60);filter:blur(0);text-shadow:0 12px 24px rgba(29,26,23,.36)}
    51%{transform:translateY(-11px) scale(1.15,1.24);text-shadow:0 3px 8px rgba(29,26,23,.20)}
    68%{transform:translateY(5px) scale(.95,.90)}
    82%{transform:translateY(-2px) scale(1.025,1.045)}
    100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);text-shadow:0 1px 0 rgba(255,255,255,.7)}
  }
  .impactWave{
    position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;
    border-radius:50%;pointer-events:none;z-index:8;
    border:4px solid rgba(255,244,209,.94);
    box-shadow:0 0 30px 9px rgba(255,229,151,.58),inset 0 0 22px rgba(255,255,255,.68);
    animation:impactWave .42s cubic-bezier(.08,.70,.14,1) forwards;
  }
  @keyframes impactWave{
    0%{opacity:.98;transform:scale(.20);filter:blur(0)}
    45%{opacity:.62;transform:scale(1.45);filter:blur(.4px)}
    100%{opacity:0;transform:scale(3.45);filter:blur(3px)}
  }
  .stampboard:after{
    content:"";position:absolute;width:min(86%,720px);height:1px;bottom:28%;
    background:linear-gradient(90deg,transparent,rgba(70,53,32,.25),transparent);
  }
  .done-glow{
    position:absolute;left:50%;top:54%;width:55%;aspect-ratio:1;border-radius:50%;
    transform:translate(-50%,-50%) scale(.5);
    background:radial-gradient(circle,rgba(230,201,135,.24),transparent 68%);
    opacity:0;filter:blur(8px);
  }
  .skip{
    position:fixed;right:20px;bottom:20px;z-index:60;pointer-events:auto;
    border:1px solid rgba(255,255,255,.34);background:rgba(24,20,17,.52);
    color:#fff;min-height:0;padding:9px 12px;font-size:11px;border-radius:999px;
    box-shadow:none;opacity:0;
  }
  #stage.active .skip{opacity:.8}
  .resultLabel{
    position:absolute;left:50%;top:22%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.22em;color:rgba(29,26,23,.58);
    opacity:0;white-space:nowrap;
  }
  .shake{animation:shake .38s cubic-bezier(.10,.78,.12,1)}
  @keyframes shake{
    0%{transform:translate3d(0,0,0) scale(1)}
    10%{transform:translate3d(-12px,10px,0) scale(.978)}
    23%{transform:translate3d(10px,-7px,0) scale(1.024)}
    39%{transform:translate3d(-8px,6px,0) scale(.988)}
    55%{transform:translate3d(6px,-4px,0) scale(1.014)}
    72%{transform:translate3d(-3px,2px,0) scale(.996)}
    86%{transform:translate3d(2px,-1px,0) scale(1.003)}
    100%{transform:translate3d(0,0,0) scale(1)}
  }
  @media (max-width:620px){
    .composer{grid-template-columns:1fr}
    button{width:100%}
    .panel{border-radius:24px}
    .glyph{font-size:48px}
    .stage-core{height:62vh}
  }
  @media (prefers-reduced-motion:reduce){
    .mode:after{content:" / 省アニメ環境"}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><div class="seal">変</div><b>変体仮名メーカー</b></div>
    <div class="mode">MOTION STUDY 03</div>
  </header>
  <main>
    <section class="panel">
      <div class="eyebrow">HIRAGANA → HENTAIGANA</div>
      <h1>文字を、ほどく。</h1>
      <div class="lead">変換そのものは一瞬。そこへ、必要以上の儀式を足した実験版です。</div>
      <div class="composer">
        <input id="input" maxlength="10" value="あさきゆめみし" aria-label="変換するひらがな">
        <button id="convert">変換する</button>
      </div>
      <div class="hint">※ 演出検証用。iPhone Safari対応。入力できるのは清音のひらがな中心です。未対応文字はそのまま表示します。</div>
    </section>
  </main>
  <footer>prototype / cinematic conversion motion</footer>
</div>
<div id="stage" aria-hidden="true">
  <div class="veil"></div>
  <div class="stage-core" id="core">
    <div class="done-glow" id="doneGlow"></div>
    <div class="resultLabel" id="resultLabel">HENTAIGANA</div>
    <div class="stampboard" id="stampboard"></div>
  </div>
  <div class="flash" id="flash"></div>
  <button class="skip" id="skip">演出を飛ばす</button>
</div>
<script>
const firstVariant = {
  "あ":"𛀂","い":"𛀆","う":"𛀊","え":"𛀏","お":"𛀔",
  "か":"𛀗","き":"𛀣","く":"𛀫","け":"𛀲","こ":"𛀸",
  "さ":"𛀼","し":"𛁄","す":"𛁊","せ":"𛁒","そ":"𛁗",
  "た":"𛁞","ち":"𛁢","つ":"𛁩","て":"𛁮","と":"𛁷",
  "な":"𛁾","に":"𛂇","ぬ":"𛂏","ね":"𛂒","の":"𛂙",
  "は":"𛂞","ひ":"𛂩","ふ":"𛂰","へ":"𛂳","ほ":"𛂺",
  "ま":"𛃂","み":"𛃉","む":"𛃐","め":"𛃔","も":"𛃗",
  "や":"𛃝","ゆ":"𛃣","よ":"𛃧",
  "ら":"𛃭","り":"𛃱","る":"𛃸","れ":"𛃾","ろ":"𛄂",
  "わ":"𛄈","ゐ":"𛄍","ゑ":"𛄒","を":"𛄖","ん":"𛄝"
};
const stage=document.getElementById("stage"),core=document.getElementById("core"),flash=document.getElementById("flash"),board=document.getElementById("stampboard"),glow=document.getElementById("doneGlow"),label=document.getElementById("resultLabel"),btn=document.getElementById("convert"),input=document.getElementById("input"),skip=document.getElementById("skip");
let running=false,timers=[];
const sleep=ms=>new Promise(r=>{const t=setTimeout(r,ms);timers.push(t)}),easeOut="cubic-bezier(.16,.84,.22,1)",easeInOut="cubic-bezier(.64,0,.36,1)";
function clearStage(){timers.forEach(clearTimeout);timers=[];core.querySelectorAll(".glyph,.spark").forEach(n=>n.remove());board.innerHTML="";board.style.opacity=0;glow.style.opacity=0;label.style.opacity=0;flash.style.opacity=0;stage.classList.remove("active");running=false;btn.disabled=false}
function finishInstant(text){core.querySelectorAll(".glyph,.spark").forEach(n=>n.remove());board.innerHTML="";[...text].forEach(ch=>{const s=document.createElement("div");s.className="stamp hit";s.textContent=ch;board.appendChild(s)});board.style.opacity=1;label.style.opacity=1;glow.style.opacity=.8}
function makeGlyphs(text,cls="glyph"){return [...text].map((ch,i)=>{const e=document.createElement("div");e.className=cls;e.textContent=ch;e.dataset.i=i;core.appendChild(e);return e})}
function animate(el,frames,options){return el.animate(frames,options).finished.catch(()=>{})}
async function play(){
  if(running)return;
  running=true;
  btn.disabled=true;

  const src=input.value.trim()||"あさきゆめみし";
  const out=[...src].map(c=>firstVariant[c]||c).join("");
  stage.classList.add("active");
  stage.querySelector(".veil").animate(
    [{opacity:0},{opacity:1}],
    {duration:360,fill:"forwards",easing:easeOut}
  );

  const g=makeGlyphs(src);
  const n=g.length;
  const compact=n>7;
  const spacing=compact?46:60;
  const radius=Math.min(compact?220:250,innerWidth*.31);
  const floatX=Math.min(innerWidth*.30,220);
  const floatY=Math.min(innerHeight*.16,120);

  // 1) 一文字ずつ、葉が水面へ浮いてくるようにふわふわ上昇。
  //    直線移動ではなく、左右の揺れ・傾き・前後の深度を少しずつずらす。
  const rise=g.map((el,i)=>{
    const x=(i-(n-1)/2)*spacing;
    const sway=(Math.random()<.5?-1:1)*(14+Math.random()*24);
    const sway2=-sway*(.55+Math.random()*.45);
    const tilt=(Math.random()<.5?-1:1)*(10+Math.random()*15);
    const depth=38+Math.random()*48;
    const duration=1180+Math.random()*260;
    const delay=i*105;
    animate(el,[
      {opacity:0,transform:`translate3d(${x-sway*.45}px,112px,-24px) rotateX(72deg) rotateY(${-tilt*.35}deg) rotateZ(${-tilt}deg) scale(.72)`,filter:"blur(6px)"},
      {offset:.22,opacity:.72,transform:`translate3d(${x+sway}px,72px,12px) rotateX(46deg) rotateY(${tilt*.20}deg) rotateZ(${tilt*.72}deg) scale(.88)`,filter:"blur(2.5px)"},
      {offset:.47,opacity:1,transform:`translate3d(${x+sway2}px,34px,${depth*.65}px) rotateX(20deg) rotateY(${-tilt*.26}deg) rotateZ(${-tilt*.48}deg) scale(1.02)`,filter:"blur(.4px)"},
      {offset:.70,opacity:1,transform:`translate3d(${x+sway*.40}px,-7px,${depth}px) rotateX(-7deg) rotateY(${tilt*.14}deg) rotateZ(${tilt*.25}deg) scale(.985)`,filter:"blur(0)"},
      {offset:.86,opacity:1,transform:`translate3d(${x-sway*.20}px,5px,${depth+12}px) rotateX(4deg) rotateY(${-tilt*.10}deg) rotateZ(${-tilt*.12}deg) scale(1.01)`},
      {opacity:1,transform:`translate3d(${x}px,0,${depth}px) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1)`,filter:"blur(0)"}
    ],{duration,delay,fill:"forwards",easing:"cubic-bezier(.22,.62,.24,1)"});
    return {el,i,x,depth};
  });

  // Safari の animation.finished は待たない。最大遅延＋最大尺だけ時間で進行する。
  await sleep(1580+n*105);

  // 2) 浮いた文字が「葉」の隊列をほどき、ふわふわ漂いながら各自360度以上回転。
  const wander=rise.map(w=>{
    const dx1=(Math.random()-.5)*floatX*1.35;
    const dy1=(Math.random()-.5)*floatY*1.25;
    const dz1=80+Math.random()*180;
    const dx2=(Math.random()-.5)*floatX*1.75;
    const dy2=(Math.random()-.5)*floatY*1.65;
    const dz2=55+Math.random()*250;
    const dx3=(Math.random()-.5)*floatX*1.55;
    const dy3=(Math.random()-.5)*floatY*1.45;
    const dz3=90+Math.random()*220;
    const sx=Math.random()<.5?-1:1;
    const sy=Math.random()<.5?-1:1;
    const sz=Math.random()<.5?-1:1;
    const rx=sx*(360+Math.random()*300);
    const ry=sy*(420+Math.random()*440);
    const rz=sz*(220+Math.random()*360);
    return {...w,dx1,dy1,dz1,dx2,dy2,dz2,dx3,dy3,dz3,rx,ry,rz};
  });

  wander.forEach((w,i)=>{
    animate(w.el,[
      {transform:`translate3d(${w.x}px,0,${w.depth}px) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1)`},
      {offset:.28,transform:`translate3d(${w.dx1}px,${w.dy1}px,${w.dz1}px) rotateX(${w.rx*.25}deg) rotateY(${w.ry*.25}deg) rotateZ(${w.rz*.25}deg) scale(.96)`},
      {offset:.56,transform:`translate3d(${w.dx2}px,${w.dy2}px,${w.dz2}px) rotateX(${w.rx*.56}deg) rotateY(${w.ry*.56}deg) rotateZ(${w.rz*.56}deg) scale(1.08)`},
      {offset:.80,transform:`translate3d(${w.dx3}px,${w.dy3}px,${w.dz3}px) rotateX(${w.rx*.82}deg) rotateY(${w.ry*.82}deg) rotateZ(${w.rz*.82}deg) scale(.92)`},
      {transform:`translate3d(${w.dx2*.72}px,${w.dy1*.70}px,${w.dz2}px) rotateX(${w.rx}deg) rotateY(${w.ry}deg) rotateZ(${w.rz}deg) scale(1)`}
    ],{duration:1750+Math.random()*260,delay:i*22,fill:"forwards",easing:"cubic-bezier(.32,.04,.24,1)"});
  });
  await sleep(2140);

  // 3) バラバラの文字が急に秩序を取り戻して立体円環へ吸い込まれる。
  wander.forEach((w,i)=>{
    const a=(360/n)*i-90;
    animate(w.el,[
      {transform:`translate3d(${w.dx2*.72}px,${w.dy1*.70}px,${w.dz2}px) rotateX(${w.rx}deg) rotateY(${w.ry}deg) rotateZ(${w.rz}deg) scale(1)`},
      {offset:.58,transform:`rotateY(${a-46}deg) translateZ(${radius*.72}px) rotateY(${-a+46}deg) translateY(${Math.sin(i*.9)*26}px) scale(.90)`,filter:"blur(1px)"},
      {transform:`rotateY(${a}deg) translateZ(${radius}px) rotateY(${-a}deg) translateY(${Math.sin(i*.9)*16}px) scale(1.03)`,filter:"blur(0)"}
    ],{duration:760,delay:i*24,fill:"forwards",easing:"cubic-bezier(.10,.76,.12,1)"});
  });
  await sleep(980);

  // 4) 立体カルーセルを4周。個々の文字は正面を向きつつ、円環全体がぐるぐる回る。
  g.forEach((el,i)=>{
    const a=(360/n)*i-90;
    const y=Math.sin(i*.9)*16;
    const tf=(deg,yy=y,scale=1)=>`rotateY(${deg}deg) translateZ(${radius}px) rotateY(${-deg}deg) translateY(${yy}px) scale(${scale})`;
    animate(el,[
      {transform:tf(a),filter:"blur(0) brightness(1)"},
      {offset:.125,transform:tf(a+180,-y*.45,1.045),filter:"blur(.2px) brightness(1.06)"},
      {offset:.25,transform:tf(a+360,y*.30,1.08),filter:"blur(.35px) brightness(1.10)"},
      {offset:.50,transform:tf(a+720,-y*.30,.98),filter:"blur(.45px) brightness(1.02)"},
      {offset:.75,transform:tf(a+1080,y*.22,1.06),filter:"blur(.25px) brightness(1.08)"},
      {transform:tf(a+1440,-y*.16,1),filter:"blur(0) brightness(1)"}
    ],{duration:2200,delay:i*8,fill:"forwards",easing:"cubic-bezier(.36,0,.26,1)"});
  });
  await sleep(2350);

  // 5) 回転を維持したまま半径を絞り、縦方向に伸ばして竜巻へ。
  g.forEach((el,i)=>{
    const a=(360/n)*i-90+1440;
    const y=(i-(n-1)/2)*-25;
    const r2=Math.max(45,radius*(.26+((i%3)*.07)));
    animate(el,[
      {transform:`rotateY(${a}deg) translateZ(${radius}px) rotateY(${-a}deg) translateY(${Math.sin(i*.9)*3}px) scale(1)`},
      {offset:.35,transform:`rotateY(${a+420}deg) translateZ(${radius*.68}px) rotateY(${-a-420}deg) translateY(${y*.30}px) scale(.94)`},
      {offset:.68,transform:`rotateY(${a+760}deg) translateZ(${radius*.42}px) rotateY(${-a-760}deg) translateY(${y*.68}px) scale(.78)`},
      {transform:`rotateY(${a+1080}deg) translateZ(${r2}px) rotateY(${-a-1080}deg) translateY(${y}px) scale(.62)`,filter:"blur(1px) brightness(1.18)"}
    ],{duration:1120,delay:i*12,fill:"forwards",easing:"cubic-bezier(.56,.02,.32,.98)"});
  });

  // 竜巻中の粒子。
  for(let i=0;i<22;i++){
    const s=document.createElement("div");
    s.className="spark";
    core.appendChild(s);
    const a=Math.random()*Math.PI*2;
    const r=45+Math.random()*230;
    const y=-170+Math.random()*340;
    animate(s,[
      {opacity:0,transform:"translate3d(0,0,0) scale(.35)"},
      {opacity:1,offset:.28,transform:`translate3d(${Math.cos(a)*r*.35}px,${y*.32}px,${Math.sin(a)*r*.35}px) scale(1)`},
      {opacity:.75,offset:.62,transform:`translate3d(${Math.cos(a+2.1)*r*.72}px,${y*.68}px,${Math.sin(a+2.1)*r*.72}px) scale(.72)`},
      {opacity:0,transform:`translate3d(${Math.cos(a+4.4)*r}px,${y}px,${Math.sin(a+4.4)*r}px) scale(.12)`}
    ],{duration:900+Math.random()*420,delay:Math.random()*180,fill:"forwards",easing:easeOut});
  }

  await sleep(1260);

  // 6) 閃光でひらがなを消す。
  animate(flash,[{opacity:0},{opacity:.98,offset:.48},{opacity:0}],{duration:720,fill:"forwards",easing:easeInOut});
  g.forEach((el,i)=>animate(el,[
    {opacity:1,filter:"blur(1px) brightness(1)"},
    {opacity:0,transform:`translate3d(0,0,0) scale(.06) rotateZ(${i%2?110:-110}deg)`,filter:"blur(14px) brightness(3)"}
  ],{duration:390,fill:"forwards",easing:"cubic-bezier(.7,0,1,.45)"}));
  await sleep(460);
  g.forEach(el=>el.remove());

  // 7) 変体仮名の竜巻が再登場。
  const h=makeGlyphs(out);
  h.forEach((el,i)=>{
    el.style.color=i%2?"#fff":"#f1d9a0";
    const a=(360/n)*i+220;
    const startR=28+(i%3)*17;
    const y=(i-(n-1)/2)*-26;
    animate(el,[
      {opacity:0,transform:`rotateY(${a}deg) translateZ(${startR}px) translateY(${y}px) scale(.38)`,filter:"blur(9px) brightness(2.6)"},
      {opacity:1,offset:.28,filter:"blur(0) brightness(1.5)"},
      {offset:.72,transform:`rotateY(${a+260}deg) translateZ(${radius*.52}px) rotateY(${-a-260}deg) translateY(${Math.sin(i*.8)*30}px) scale(.96)`,filter:"blur(0) brightness(1.15)"},
      {opacity:1,transform:`rotateY(${a+520}deg) translateZ(${radius*.78}px) rotateY(${-a-520}deg) translateY(${Math.sin(i*.8)*22}px) scale(1.06)`,filter:"blur(0) brightness(1)"}
    ],{duration:980,delay:i*24,fill:"forwards",easing:easeOut});
  });
  await sleep(1150);

  h.forEach((el,i)=>animate(el,[
    {opacity:1},
    {opacity:0,transform:`translate3d(${(i-(n-1)/2)*20}px,0,18px) scale(.24)`,filter:"blur(5px)"}
  ],{duration:340,delay:i*10,fill:"forwards",easing:"cubic-bezier(.55,0,.85,.28)"}));
  await sleep(400);
  h.forEach(el=>el.remove());

  // 8) 一文字ずつ重量級に刻印。
  board.innerHTML="";
  [...out].forEach(ch=>{
    const s=document.createElement("div");
    s.className="stamp";
    s.textContent=ch;
    board.appendChild(s);
  });
  board.style.opacity=1;
  label.style.opacity=0;
  await sleep(90);

  const stamps=[...board.children];
  for(let i=0;i<stamps.length;i++){
    stamps[i].classList.add("hit");

    const sr=stamps[i].getBoundingClientRect();
    const cr=core.getBoundingClientRect();
    const wave=document.createElement("div");
    wave.className="impactWave";
    wave.style.left=`${sr.left+sr.width/2-cr.left}px`;
    wave.style.top=`${sr.top+sr.height/2-cr.top}px`;
    core.appendChild(wave);
    setTimeout(()=>wave.remove(),460);

    core.classList.remove("shake");
    void core.offsetWidth;
    core.classList.add("shake");

    stage.animate([
      {transform:"translate3d(0,0,0)"},
      {offset:.12,transform:"translate3d(0,13px,0) scale(.992)"},
      {offset:.30,transform:"translate3d(0,-7px,0) scale(1.006)"},
      {offset:.52,transform:"translate3d(0,4px,0)"},
      {transform:"translate3d(0,0,0)"}
    ],{duration:390,easing:"cubic-bezier(.10,.76,.12,1)"});

    flash.animate(
      [{opacity:0},{opacity:.42,offset:.14},{opacity:0}],
      {duration:280,fill:"forwards",easing:"ease-out"}
    );

    if(navigator.vibrate)navigator.vibrate([34,18,58]);
    await sleep(280);
  }

  animate(label,[
    {opacity:0,transform:"translate(-50%,8px)"},
    {opacity:1,transform:"translate(-50%,0)"}
  ],{duration:420,fill:"forwards",easing:easeOut});
  animate(glow,[
    {opacity:0,transform:"translate(-50%,-50%) scale(.45)"},
    {opacity:1,transform:"translate(-50%,-50%) scale(1)"}
  ],{duration:620,fill:"forwards",easing:easeOut});

  await sleep(1050);
  clearStage();
  input.value=out;
}
btn.addEventListener("click",play);input.addEventListener("keydown",e=>{if(e.key==="Enter")play()});skip.addEventListener("click",()=>{const src=input.value.trim()||"あさきゆめみし",out=[...src].map(c=>firstVariant[c]||c).join("");finishInstant(out);setTimeout(()=>{clearStage();input.value=out},700)});
</script>
</body>
</html>
