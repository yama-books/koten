<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f1e8">
<title>変体仮名を飼う｜観察モード PoC v2</title>
<style>
@font-face {
  font-family: "HentaiganaWeb";
  src:
    local("Noto Serif Hentaigana"),
    url("https://raw.githubusercontent.com/google/fonts/main/ofl/notoserifhentaigana/NotoSerifHentaigana%5Bwght%5D.ttf") format("truetype");
  font-weight: 200 900;
  font-style: normal;
  font-display: block;
}
:root {
  --paper:#f5f1e8;
  --panel:rgba(250,247,239,.93);
  --ink:#2c2c29;
  --muted:#78736b;
  --line:#cfc7ba;
  --line-dark:#aaa093;
  --green:#77956d;
  --shadow:0 10px 30px rgba(54,49,43,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:#e9e4da;
  color:var(--ink);
  font-family:"Yu Gothic UI","Yu Gothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{
  min-height:100%;
  background:
    linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.2)),
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.58),transparent 28%),
    var(--paper);
  padding:12px;
}
.frame{
  min-height:calc(100vh - 24px);
  border:1px solid #bbb3a8;
  border-radius:28px;
  box-shadow:0 16px 45px rgba(44,42,38,.12);
  background:rgba(247,244,237,.96);
  overflow:hidden;
}
.topbar{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 18px;
  border-bottom:1px solid var(--line);
  gap:16px;
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.back{
  width:33px;height:33px;border-radius:50%;
  border:1px solid var(--line);background:#ebe6dd;color:#645f58;
  display:grid;place-items:center;font-size:18px;
}
.brand h1{font-size:22px;margin:0;font-weight:650;letter-spacing:.03em}
.brand .mode{font-size:14px;color:#59554f;margin-left:16px;font-weight:450}
.nav{display:flex;align-items:center;gap:22px;font-size:13px}
.nav button{border:none;background:none;color:#47443f;padding:8px}
.main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 326px;
  grid-template-rows:minmax(510px,1fr) 225px;
  gap:10px;
  padding:10px;
  min-height:calc(100vh - 92px);
}
.card{
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--panel);
  box-shadow:var(--shadow);
}
.stage-card{grid-column:1;grid-row:1;overflow:hidden;position:relative}

.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(247,244,237,.08));
}
.stage-toolbar{
  position:absolute;left:14px;right:14px;top:12px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.observe-pill,.time-pill{
  border:1px solid rgba(175,166,153,.88);
  background:rgba(249,246,239,.9);
  backdrop-filter:blur(8px);
  box-shadow:0 4px 14px rgba(0,0,0,.05);
  border-radius:999px;
  padding:8px 12px;
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:#4d4943;
}
.dot{width:9px;height:9px;border-radius:50%;background:#4c9b67;box-shadow:0 0 0 4px rgba(76,155,103,.12)}
.sun-icon{font-size:18px}
.font-pill{
  position:absolute;left:14px;bottom:13px;z-index:30;
  border:1px solid rgba(175,166,153,.84);
  background:rgba(249,246,239,.86);backdrop-filter:blur(7px);
  border-radius:999px;padding:6px 9px;font-size:10px;color:#6b655d
}
.font-pill.ok::before{content:"●";color:#4d9963;margin-right:5px}
.font-pill.warn::before{content:"●";color:#ba765b;margin-right:5px}
.character{
  position:absolute;
  width:80px;height:100px;
  transform:translate(-50%,-50%);
  z-index:15;
  transition:left .9s cubic-bezier(.22,.72,.28,1), top .9s cubic-bezier(.22,.72,.28,1), opacity .3s, filter .3s;
  cursor:pointer;
  user-select:none;
}
.character .name{
  position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:700;letter-spacing:.03em;
  color:#49453f;white-space:nowrap;
  text-shadow:0 1px 0 rgba(255,255,255,.9);
}
.character .creature{
  position:absolute;left:50%;top:18px;transform:translateX(-50%);
  width:68px;height:67px;
  display:grid;place-items:center;
}
.character .glyph{
  font-family:"HentaiganaWeb","Noto Serif Hentaigana",serif;
  font-variation-settings:"wght" 520;
  font-size:63px;line-height:1;
  color:var(--accent);
  -webkit-text-stroke:1.4px rgba(70,65,59,.45);
  paint-order:stroke fill;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.95)) drop-shadow(0 4px 3px rgba(57,52,45,.12));
  transform-origin:50% 70%;
}
.character .foot{
  position:absolute;top:71px;width:13px;height:2px;background:#4c4944;border-radius:2px
}
.character .foot.l{left:25px;transform:rotate(-18deg)}
.character .foot.r{right:24px;transform:rotate(18deg)}
.character .mood{
  position:absolute;right:4px;top:23px;width:9px;height:9px;border-radius:50%;background:var(--accent);
  border:2px solid #fbf8f1;box-shadow:0 1px 3px rgba(0,0,0,.16)
}
.character.selected .glyph{
  filter:drop-shadow(0 0 0 white) drop-shadow(0 0 5px color-mix(in srgb,var(--accent) 42%,transparent));
}
.character.looking .glyph{animation:look .52s ease-in-out 2}
.character.thinking .glyph{animation:think 1s ease-in-out infinite}
.character.acting .glyph{animation:act .55s ease-in-out infinite alternate}
.character.hidden-char{opacity:.15;filter:blur(.3px)}
@keyframes look{50%{transform:translateX(5px) rotate(2deg)}}
@keyframes think{50%{transform:translateY(-3px) rotate(-2deg)}}
@keyframes act{to{transform:translateY(-6px) scale(1.04)}}
.event-toast{
  position:absolute;left:50%;top:58px;transform:translateX(-50%) translateY(-7px);
  z-index:40;opacity:0;pointer-events:none;
  border-radius:999px;padding:8px 13px;background:rgba(42,42,39,.88);color:#fff;font-size:11px;
  transition:.25s;box-shadow:0 6px 18px rgba(0,0,0,.14);white-space:nowrap
}
.event-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.relation-svg{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none;opacity:0;transition:.2s}
.relation-svg.on{opacity:1}
.relation-svg line{stroke-width:1.6;stroke-dasharray:6 7;opacity:.44}
.info-card{grid-column:2;grid-row:1;padding:14px 16px;overflow:auto}
.info-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.info-head h2{margin:0;font-size:17px}
.pin{font-size:18px;color:#7d6257}
.hero{display:grid;grid-template-columns:92px 1fr;gap:13px;align-items:center}
.glyph-box{
  height:104px;border:1px solid #a9a095;border-radius:12px;
  display:grid;place-items:center;position:relative;background:#faf8f2;
}
.glyph-box .g{
  font-family:"HentaiganaWeb","Noto Serif Hentaigana",serif;
  font-size:68px;color:var(--hero-accent);font-variation-settings:"wght" 520;
}
.glyph-box .reading{position:absolute;top:5px;font-size:10px;color:#6e6861}
.hero-title{font-size:19px;font-weight:700;margin-bottom:4px}
.hero-sub{font-size:11px;color:var(--muted);line-height:1.5}
.meta{margin-top:14px;display:grid;grid-template-columns:50px 1fr;gap:10px 8px;font-size:12px;line-height:1.5}
.meta .k{color:#706a62}
.divider{height:1px;background:var(--line);margin:15px 0 12px}
.tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{border-radius:999px;padding:5px 9px;font-size:10px;border:1px solid var(--line);background:#f5f0e8}
.tag.green{background:#e2eddc;color:#466c4e;border-color:#d4e1ce}
.tag.orange{background:#f4e1d4;color:#8a5c43;border-color:#ead5c8}
.meters{display:grid;gap:10px;margin-top:14px}
.meter{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;font-size:10px;color:#655e57}
.bar{height:10px;border:1px solid #c6beb3;border-radius:999px;overflow:hidden;background:#eee9e1}
.fill{height:100%;border-radius:inherit;background:#8dad83}
.fill.food{background:#c89e70} .fill.moodbar{background:#d6ad58}
.bottom-left{grid-column:1;grid-row:2;display:grid;grid-template-columns:1.05fr 1.3fr;gap:10px}
.controls-card,.log-card,.event-card{padding:13px 15px}
.section-title{font-size:13px;font-weight:700;margin:0 0 10px}
.control-row{display:flex;align-items:center;gap:13px}
.round-btn{
  width:54px;height:54px;border-radius:50%;border:1px solid #bfb7ab;background:#f7f3ec;
  display:grid;place-items:center;font-size:21px;color:#3f443b
}
.round-btn.primary{background:#dfe9d8}
.speedline{display:flex;align-items:center;gap:8px;flex:1;font-size:11px}
.speedline input{width:100%}
.small-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.small-btn{
  border:1px solid #bdb5aa;border-radius:999px;background:#f9f6ef;padding:7px 10px;font-size:10px;color:#4d4944
}
.log-card{overflow:hidden}
.log-list{height:150px;overflow:auto;display:flex;flex-direction:column;gap:5px}
.log-item{display:grid;grid-template-columns:10px 44px 1fr;gap:7px;font-size:10px;line-height:1.5}
.ldot{width:7px;height:7px;border-radius:50%;margin-top:4px;background:#99a}
.ltime{color:#aaa39a}
.event-card{grid-column:2;grid-row:2}
.form-row{display:grid;gap:5px;margin-bottom:10px}
.form-row label{font-size:10px;color:#655f57}
select{
  border:1px solid #beb5aa;border-radius:10px;background:#fbf8f1;color:#3f3b36;padding:8px;font-size:11px;width:100%
}
.play-event{
  width:100%;border:none;border-radius:999px;background:#595753;color:white;padding:9px 12px;font-size:11px
}
@media (max-width:1050px){
  .main{grid-template-columns:1fr;grid-template-rows:560px auto auto}
  .stage-card{grid-column:1;grid-row:1}
  .info-card{grid-column:1;grid-row:2}
  .bottom-left{grid-column:1;grid-row:3}
  .event-card{grid-column:1;grid-row:4}
}
@media (max-width:720px){
  .app{padding:4px} .frame{border-radius:16px} .topbar{padding:8px 10px}
  .brand h1{font-size:17px} .brand .mode,.nav{display:none}
  .main{padding:6px;grid-template-rows:520px auto auto}
  .bottom-left{grid-template-columns:1fr}
  .character{transform:translate(-50%,-50%) scale(.88)}
}
</style>
</head>
<body>
<div class="app"><div class="frame">
  <header class="topbar">
    <div class="brand">
      <button class="back" aria-label="戻る">←</button>
      <h1>変体仮名を飼う</h1>
      <div class="mode">生成ムービー ／ 観察モード</div>
    </div>
    <nav class="nav">
      <button>ホーム</button><button>図鑑</button><button>設定</button><button aria-label="設定">⚙</button>
    </nav>
  </header>

  <main class="main">
    <section class="card stage-card">
      <div class="stage" id="stage">
        <div class="stage-toolbar">
          <div class="observe-pill"><span class="dot"></span><strong>観察中</strong><span id="countLabel">8 / 8 匹</span></div>
          <div class="time-pill"><span class="sun-icon">☀</span><span>ひる</span><strong id="clock">14:23</strong><span>⌄</span></div>
        </div>
        <div class="event-toast" id="toast"></div>
        <svg id="relations" class="relation-svg"></svg>
        <div id="fontStatus" class="font-pill">変体仮名フォント確認中</div>
      </div>
    </section>

    <aside class="card info-card">
      <div class="info-head"><h2>個体情報</h2><span class="pin">⌖</span></div>
      <div id="info"></div>
    </aside>

    <section class="bottom-left">
      <div class="card controls-card">
        <div class="section-title">コントロール</div>
        <div class="control-row">
          <button class="round-btn primary" id="playBtn">▶</button>
          <button class="round-btn" id="pauseBtn">Ⅱ</button>
          <div class="speedline">
            <span>速度</span><span>0.5x</span><input id="speed" type="range" min=".5" max="2" step=".1" value="1"><span>2x</span>
          </div>
        </div>
        <div class="small-actions">
          <button class="small-btn" id="nextBtn">▷ 次の出来事</button>
          <button class="small-btn" id="relationBtn">⌘ 関係線</button>
          <button class="small-btn" id="resetBtn">↻ カメラリセット</button>
        </div>
      </div>
      <div class="card log-card">
        <div class="section-title">できごとログ</div>
        <div class="log-list" id="log"></div>
      </div>
    </section>

    <section class="card event-card">
      <div class="section-title">イベントを生成</div>
      <div class="form-row">
        <label>できごと</label>
        <select id="sceneSelect">
          <option value="distance">なかよくする？</option>
          <option value="gap">落とし物を見つける</option>
          <option value="hide">隱のいたずら</option>
          <option value="care">転んだ子をいたわる</option>
          <option value="idle">何も起こさない</option>
        </select>
      </div>
      <div class="form-row">
        <label>対象の個体</label>
        <select id="targetSelect"></select>
      </div>
      <button class="play-event" id="runSelected">✦ このできごとを再生</button>
    </section>
  </main>
</div></div>

<script>
const CAST = [{"id": "U+1B003", "glyph": "𛀃", "kana": "あ", "source": "愛", "variant": "", "species": "人懐こい毛玉型", "motive": "他者との距離を縮めたい", "temperament": "社交的・好奇心旺盛・距離感が近い", "ability": "ひきよせ", "abilityDescription": "《ひきよせ》", "limitations": ["頼まれていなくても引き寄せる 惡との永続的な追いかけ関係を形成"], "accent": "#d5707b", "pale": "#f7d8db", "x": 11, "y": 58}, {"id": "U+1B005", "glyph": "𛀅", "kana": "あ", "source": "惡", "variant": "", "species": "単独性小獣型", "motive": "適切な距離を確保したい", "temperament": "マイペース・空気は読むが従わない", "ability": "はじく", "abilityDescription": "《はじく》", "limitations": ["押し返した相手が別個体へ衝突する場合がある 愛から逃げるが、危機では助ける関係が望ましい 「あ」と「を」の双方との関係を将来的に利用できる境界個体候補"], "accent": "#547a91", "pale": "#dceaf1", "x": 19, "y": 76}, {"id": "U+1B008", "glyph": "𛀈", "kana": "い", "source": "意", "variant": "", "species": "観察者型", "motive": "理解してから動きたい", "temperament": "慎重・知的・好奇心旺盛", "ability": "見切る", "abilityDescription": "《見切る》 軌道、転倒、崩落などの次の動きを予測", "limitations": ["観察中に事件が終わることがある 移との代表的補完関係"], "accent": "#8473a8", "pale": "#e9e4f5", "x": 78, "y": 36}, {"id": "U+1B009", "glyph": "𛀉", "kana": "い", "source": "移", "variant": "", "species": "四足高速型", "motive": "何かを動かしたい", "temperament": "せっかち・活動的・働き者", "ability": "運ぶ", "abilityDescription": "《運ぶ》 一体または小物を高速搬送", "limitations": ["不要な物まで運ぶ 意が判断し、移が実行するコンビ"], "accent": "#708a56", "pale": "#e2edd9", "x": 63, "y": 73}, {"id": "U+1B016", "glyph": "𛀖", "kana": "お", "source": "隱", "variant": "", "species": "影生物", "motive": "見つからない状態を楽しむ", "temperament": "いたずら好き・意外と良心的", "ability": "かくれる", "abilityDescription": "《かくれる》 自身と小物一つをほぼ透明化 有の収集物を隠す等の事件源 本当に困る前には返すという一線を持つ 安Ⅰ × 安Ⅱ 同字母。非常に強い協働関係。 愛 × 惡 「接近」と「離隔」の対立。追う／逃げる。ただし危機時には助ける。 意 × 移 観察・判断と実行の補完。 宇Ⅰ × 宇Ⅱ 外から守る／中にしまう兄弟。 安 × 憂 安定させる者が心配性を落ち着かせる。 移 × 江 搬送と流路による高速輸送。 雲 × 憂 空を飛びたい者と事故を心配する者。 有 × 得 「保持したい」と「獲得したい」の競争。 愛 × 縁 他者同士を近づけたい者同士。 惡 × 縁 結びつけたい者と距離を取りたい者。 衣Ⅰ × 衣Ⅱ 保護者的個体と悪戯者。 盈 × 江 流路を盈が塞ぐ等の偶発的対立。 要 × 意 指揮と分析。 阿 × 要 発見と現場指揮。 於Ⅰ × 於Ⅱ 集合地点と案内。 有 × 隱 「無くしたくない」と「隠したい」。 得 × 隱 回収者と隠匿者。", "limitations": [], "accent": "#6b6177", "pale": "#e7e1ec", "x": 89, "y": 49}, {"id": "U+1B09C", "glyph": "𛂜", "kana": "の", "source": "能", "variant": "Ⅱ", "species": "才能発見型の観察者", "motive": "他者の得意なことを見つけたい", "temperament": "励ますより「気づかせる」タイプ", "ability": "できるよ", "abilityDescription": "《できるよ》 一体の能力が今の事件に適している場合、本人がそれに気づく可能性を上げる", "limitations": ["適性がない場合は何も起きない"], "accent": "#cb9d45", "pale": "#f7e8c1", "x": 50, "y": 66}, {"id": "U+1B034", "glyph": "𛀴", "kana": "け", "source": "希", "variant": "", "species": "非常に細い妖精型", "motive": "少ない場所、小さな可能性を試したい", "temperament": "控えめ・粘り強い", "ability": "細る", "abilityDescription": "《細る》 糸ほど細くなり、他個体が入れない隙間を通れる", "limitations": ["細くなりすぎて見失われる"], "accent": "#b97b4f", "pale": "#f3dec8", "x": 30, "y": 55}, {"id": "U+1B089", "glyph": "𛂉", "kana": "に", "source": "仁", "variant": "", "species": "看護獣型", "motive": "弱っている相手を優先したい", "temperament": "穏やか・救助対象優先", "ability": "いたわる", "abilityDescription": "《いたわる》 怪我・疲労・恐怖状態の一体の動揺を下げ、救助を受け入れやすくする", "limitations": ["元気な相手にはあまり反応しない"], "accent": "#6b966d", "pale": "#dcebdc", "x": 42, "y": 58}];
const stage = document.getElementById('stage');
const info = document.getElementById('info');
const log = document.getElementById('log');
const relations = document.getElementById('relations');
const toast = document.getElementById('toast');
const fontStatus = document.getElementById('fontStatus');
let speed = 1, running = false, token = 0, autoTimer = null, selected = CAST[0];
const initial = Object.fromEntries(CAST.map(c=>[c.source,[c.x,c.y]]));
const by = s => CAST.find(c=>c.source===s);
const rels = [['愛','惡','#b76c78'],['能','希','#8b7a56'],['仁','愛','#719276'],['意','移','#766e9c'],['隱','希','#756a81']];

function wait(ms){return new Promise(r=>setTimeout(r,ms/speed))}
function eid(c){return 'c-'+c.id.replace(/[^a-zA-Z0-9_-]/g,'_')}
function el(c){return document.getElementById(eid(c))}
function setState(c,s=''){const e=el(c); if(!e)return; e.classList.remove('looking','thinking','acting','hidden-char'); if(s)e.classList.add(s)}
function pos(c,x,y){c.x=x;c.y=y;const e=el(c);e.style.left=x+'%';e.style.top=y+'%';drawRelations()}
function near(a,b,dx=6,dy=1){pos(a,Math.max(5,Math.min(95,b.x+dx)),Math.max(12,Math.min(90,b.y+dy)))}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1100/speed)}
function addLog(kind,txt,c=null){
  const d=document.createElement('div');d.className='log-item';
  const now=new Date();const time=now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  const col=c?c.accent:'#8c8479';
  d.innerHTML=`<span class="ldot" style="background:${col}"></span><span class="ltime">${time}</span><span>${txt}</span>`;
  log.prepend(d);while(log.children.length>20)log.lastChild.remove();
}
function select(c){
  selected=c;document.querySelectorAll('.character').forEach(x=>x.classList.toggle('selected',x.dataset.id===c.id));
  info.style.setProperty('--hero-accent',c.accent);
  const limit=(c.limitations&&c.limitations.length)?c.limitations.join('／'):'大きな弱点は未設定';
  info.innerHTML=`<div class="hero">
    <div class="glyph-box"><span class="reading">${c.kana}</span><span class="g">${c.glyph}</span></div>
    <div><div class="hero-title">${c.source}${c.variant||''}（${c.kana}）</div><div class="hero-sub">字母 ${c.source} ／ ${c.id}</div></div>
  </div>
  <div class="meta">
    <div class="k">性格</div><div>${c.temperament}</div>
    <div class="k">能力</div><div><strong>《${c.ability}》</strong><br>${c.abilityDescription}</div>
    <div class="k">関係</div><div>${relationText(c.source)}</div>
  </div>
  <div class="divider"></div>
  <div class="tags"><span class="tag green">観察中</span><span class="tag">通常</span><span class="tag orange">一拍</span></div>
  <div class="meters">
    <div class="meter"><span>♥ げんき</span><div class="bar"><div class="fill" style="width:${64+Math.round(Math.random()*22)}%"></div></div></div>
    <div class="meter"><span>♨ まんぷく</span><div class="bar"><div class="fill food" style="width:${40+Math.round(Math.random()*30)}%"></div></div></div>
    <div class="meter"><span>✦ ごきげん</span><div class="bar"><div class="fill moodbar" style="width:${62+Math.round(Math.random()*25)}%"></div></div></div>
  </div>
  <div class="divider"></div><div style="font-size:10px;color:#786f66">弱点：${limit}</div>`;
}
function relationText(s){
  const map={
    '愛':'惡をよく気にしている。仁とは近くにいることが多い。',
    '惡':'愛が近づくと距離を取りたがる。',
    '意':'移の動きをよく観察する。',
    '移':'意と行動のタイミングが合いやすい。',
    '隱':'希に見つかると少し悔しそう。',
    '能':'希の得意なことに気づきやすい。',
    '希':'能Ⅱに見られると、自分の得意技を思い出すことがある。',
    '仁':'弱った個体のそばへ静かに寄る。'
  };return map[s]||'まだ関係は浅い。';
}
function render(){
  CAST.forEach(c=>{
    const d=document.createElement('div');d.className='character';d.dataset.id=c.id;d.id=eid(c);
    d.style.left=c.x+'%';d.style.top=c.y+'%';d.style.setProperty('--accent',c.accent);
    d.innerHTML=`<div class="name">${c.source}${c.variant||''}</div><div class="creature"><span class="glyph">${c.glyph}</span><span class="foot l"></span><span class="foot r"></span><span class="mood"></span></div>`;
    d.onclick=()=>select(c);stage.appendChild(d);
  });
  const target=document.getElementById('targetSelect');
  CAST.forEach(c=>{const o=document.createElement('option');o.value=c.source;o.textContent=`${c.source}（${c.kana}）`;target.appendChild(o)});
  select(CAST[0]);drawRelations();
}
function drawRelations(){
  relations.innerHTML='';if(!relations.classList.contains('on'))return;
  rels.forEach(([a,b,col])=>{const A=by(a),B=by(b);if(!A||!B)return;const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',A.x+'%');l.setAttribute('y1',A.y+'%');l.setAttribute('x2',B.x+'%');l.setAttribute('y2',B.y+'%');l.setAttribute('stroke',col);relations.appendChild(l)});
}
function reset(){
  token++;clearTimeout(autoTimer);CAST.forEach(c=>{setState(c);const p=initial[c.source];pos(c,p[0],p[1])});
  el(by('隱')).classList.remove('hidden-char');addLog('reset','みんながいつもの場所へ戻った');
}
async function observe(c,text){setState(c,'looking');addLog('look',text,c);await wait(430);setState(c,'thinking');await wait(650)}
async function act(c,text,fn){setState(c,'acting');addLog('act',text,c);if(fn)fn();await wait(780);setState(c)}
async function sceneDistance(t){
  const ai=by('愛'),aku=by('惡'),jin=by('仁');
  toastMsg('愛が惡に気づいた');
  await observe(ai,'愛が惡を見つめる');if(t!==token)return;
  await act(ai,'愛が惡の近くへ寄る',()=>near(ai,aku,-7,0));if(t!==token)return;
  await observe(aku,'惡が近づいた愛を見る');if(t!==token)return;
  await act(aku,'惡が《はじく》で少し距離を取る',()=>pos(ai,aku.x-15,aku.y+1));if(t!==token)return;
  setState(jin,'looking');addLog('look','仁が二体の様子を遠くから見ている',jin);await wait(550);setState(jin);
  toastMsg('二体ともその場を離れなかった');
}
async function sceneGap(t){
  const no=by('能'),ki=by('希'),i=by('意'),utsu=by('移');
  toastMsg('ベンチの下に小さな物が入った');
  await observe(i,'意が落ちた方向をじっと見る');if(t!==token)return;
  await act(i,'意が落ちた位置へ向き直る',()=>pos(i,54,53));if(t!==token)return;
  await observe(no,'能Ⅱが希とベンチの隙間を交互に見る');if(t!==token)return;
  setState(ki,'looking');addLog('look','希が隙間を見る。すぐには動かない',ki);await wait(700);if(t!==token)return;
  await act(ki,'希が自分から《細る》を使う',()=>pos(ki,31,60));if(t!==token)return;
  await act(utsu,'移が回収した物を運ぶ',()=>pos(utsu,55,71));toastMsg('希の得意なことが自然に出た');
}
async function sceneHide(t){
  const on=by('隱'),ki=by('希'),i=by('意');
  toastMsg('隱がこっそり物陰へ');
  await act(on,'隱が木陰へ入り《かくれる》',()=>{pos(on,86,57);el(on).classList.add('hidden-char')});if(t!==token)return;
  await observe(i,'意がさっきまで隱がいた場所を見る');if(t!==token)return;
  await observe(ki,'希が木陰の細い隙間を気にする');if(t!==token)return;
  await act(ki,'希が隙間へ近づく',()=>pos(ki,83,60));if(t!==token)return;
  el(on).classList.remove('hidden-char');toastMsg('隱と希の目が合った');addLog('result','隱が観念して姿を見せる',on);
}
async function sceneCare(t){
  const utsu=by('移'),jin=by('仁'),i=by('意');
  toastMsg('移が少し急ぎすぎた');
  await act(utsu,'移が走る',()=>pos(utsu,52,62));if(t!==token)return;
  el(utsu).querySelector('.glyph').style.transform='rotate(15deg)';addLog('result','移が足を滑らせる',utsu);await wait(500);
  await observe(jin,'仁が転んだ移を見る');if(t!==token)return;
  await act(jin,'仁はすぐ持ち上げず、そばへ寄って《いたわる》',()=>near(jin,utsu,7,3));if(t!==token)return;
  el(utsu).querySelector('.glyph').style.transform='';setState(i,'looking');addLog('look','意がその一連を見ている',i);toastMsg('移が自分で起き上がった');
}
async function sceneIdle(t){
  toastMsg('事件のない時間');
  for(let k=0;k<6;k++){if(t!==token)return;const c=CAST[Math.floor(Math.random()*CAST.length)];
    if(c.source==='愛'){const target=CAST[Math.floor(Math.random()*CAST.length)];if(target!==c)near(c,target,-7,1)}
    else if(c.source==='隱'){pos(c,84+Math.random()*6,48+Math.random()*10)}
    else{pos(c,c.x+(Math.random()*6-3),c.y+(Math.random()*5-2.5))}
    addLog('idle',`${c.source}が何となく場所を変えた`,c);await wait(650)
  }toastMsg('何も解決しない時間も生活'); 
}
const scenes={distance:sceneDistance,gap:sceneGap,hide:sceneHide,care:sceneCare,idle:sceneIdle};
const order=['idle','distance','gap','hide','care'];let idx=0;
async function run(name){token++;const t=token;clearTimeout(autoTimer);CAST.forEach(c=>setState(c));await scenes[name](t);if(t!==token)return;
  if(running)autoTimer=setTimeout(()=>{idx=(idx+1)%order.length;run(order[idx])},2600/speed)
}
document.getElementById('playBtn').onclick=()=>{running=true;run(order[idx])};
document.getElementById('pauseBtn').onclick=()=>{running=false;token++;clearTimeout(autoTimer);CAST.forEach(c=>setState(c));addLog('pause','観察を一時停止した')};
document.getElementById('nextBtn').onclick=()=>{running=true;idx=(idx+1)%order.length;run(order[idx])};
document.getElementById('relationBtn').onclick=()=>{relations.classList.toggle('on');drawRelations()};
document.getElementById('resetBtn').onclick=reset;
document.getElementById('speed').oninput=e=>speed=parseFloat(e.target.value);
document.getElementById('runSelected').onclick=()=>{running=false;const name=document.getElementById('sceneSelect').value;run(name)};
document.getElementById('targetSelect').onchange=e=>{const c=by(e.target.value);if(c)select(c)};
setInterval(()=>{const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})},1000);
render();
addLog('start','観察を開始。文字たちは公園で自由に過ごしている');
document.fonts.load('48px "HentaiganaWeb"').then(fonts=>{
  if(fonts.length){fontStatus.textContent='変体仮名フォント読み込み済み';fontStatus.classList.add('ok')}
  else{fontStatus.textContent='フォント読み込みを確認できません';fontStatus.classList.add('warn')}
}).catch(()=>{fontStatus.textContent='フォント読み込み失敗';fontStatus.classList.add('warn')});
</script>
</body>
</html>
