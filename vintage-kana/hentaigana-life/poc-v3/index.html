<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <title>変体仮名を飼う PoC v3</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">HENTAIGANA LIFE LAB / PoC v3</div>
        <h1>変体仮名を飼う <span>観察実験</span></h1>
      </div>
      <div class="top-actions">
        <button id="run-toggle" class="primary">▶ 開始</button>
        <button id="save-now">保存</button>
        <button id="reset-world">実験を初期化</button>
      </div>
    </header>

    <main class="layout">
      <section class="stage-card">
        <div class="stage-toolbar">
          <div class="status-pill"><span id="run-dot"></span><span id="run-label">停止中</span></div>
          <div class="world-pill"><span id="time-phase">昼</span><strong id="world-clock">12:00</strong><span id="weather">晴</span></div>
        </div>
        <div id="stage" class="stage" aria-label="文字たちの生活空間">
          <div class="stage-caption">公園・基準生活エリア</div>
          <div id="world-layer" class="world-layer"></div>
          <div id="punctuation-layer" class="punctuation-layer"></div>
          <div id="actor-layer" class="actor-layer"></div>
          <div id="toast" class="toast"></div>
        </div>
      </section>

      <aside class="side">
        <section class="panel">
          <h2>個体観察</h2>
          <div id="actor-detail" class="actor-detail"></div>
        </section>
        <section class="panel">
          <h2>現在の世界</h2>
          <div id="world-summary" class="summary-grid"></div>
          <div class="speed-row">
            <label for="speed">進行速度</label>
            <input id="speed" type="range" min="0.5" max="3" step="0.5" value="1">
            <span id="speed-label">1x</span>
          </div>
        </section>
      </aside>

      <section class="panel log-panel">
        <div class="panel-head">
          <h2>観察ノート</h2>
          <button id="clear-visible-log">画面表示だけ消す</button>
        </div>
        <div id="observation-log" class="log-list"></div>
      </section>

      <section class="panel experiment-panel">
        <h2>軽い介入</h2>
        <p>命令ではなく、世界へ小さなきっかけを置きます。</p>
        <div class="experiment-buttons">
          <button data-intervention="period">。を置く</button>
          <button data-intervention="comma">、を置く</button>
          <button data-intervention="rain">少し雨</button>
          <button data-intervention="quiet">静かな時間</button>
        </div>
        <details>
          <summary>開発用内部ログ</summary>
          <pre id="debug-log"></pre>
        </details>
      </section>
    </main>
  </div>

  <!-- データ → Core → Sim → UI → main の順でロード。ビルド不要。 -->
  <script defer src="js/data/version-info.js"></script>
  <script defer src="js/data/poc-cast.js"></script>
  <script defer src="js/data/world-config.js"></script>
  <script defer src="js/data/action-catalog.js"></script>
  <script defer src="js/data/punctuation-catalog.js"></script>
  <script defer src="js/core/utils.js"></script>
  <script defer src="js/core/event-bus.js"></script>
  <script defer src="js/core/logger.js"></script>
  <script defer src="js/core/storage.js"></script>
  <script defer src="js/core/world-state.js"></script>
  <script defer src="js/sim/punctuation.js"></script>
  <script defer src="js/sim/background.js"></script>
  <script defer src="js/sim/population.js"></script>
  <script defer src="js/sim/scoring.js"></script>
  <script defer src="js/sim/actions.js"></script>
  <script defer src="js/sim/step.js"></script>
  <script defer src="js/core/engine.js"></script>
  <script defer src="js/ui/stage.js"></script>
  <script defer src="js/ui/panels.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
