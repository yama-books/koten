<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>敬語訳アシスト</title>
<style>
:root{--bg:#f7f5f0;--paper:#fff;--text:#32372f;--sub:#73796f;--line:#e3e5dc;--accent:#4e7665;--soft:#edf3ee;--focus:#7da791}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--text);font-size:15px;line-height:1.65}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button[hidden],section[hidden],div[hidden],p[hidden]{display:none!important}
main{width:min(720px,100%);margin:auto;padding:28px 18px 64px}
header{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 20px}
h1{font-size:25px;letter-spacing:.02em;margin:0;font-weight:750}
h2{font-size:17px;margin:0}
p{margin:0}
.sheet{border:1px solid var(--line);border-radius:22px;background:var(--paper);padding:20px;margin:0 0 14px;box-shadow:0 5px 22px rgba(46,53,43,.025)}
.section-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px}
.kicker{font-size:12px;color:var(--sub);font-weight:700}
textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 14px;resize:vertical;min-height:88px;line-height:1.8;color:var(--text);background:#fff;font-size:16px}
textarea:focus,input:focus{border-color:var(--accent);outline:2px solid #b8d2c1;outline-offset:0}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.primary{background:var(--accent);color:white}
.secondary{background:var(--soft);color:var(--accent)}
.quiet{background:transparent;color:var(--sub)}
.toolbar button,.nav button,.again{border-radius:999px;padding:9px 17px;font-weight:700;min-height:43px}
.toolbar button:hover,.nav button:hover,.again:hover{filter:brightness(.97)}
#candidateArea{border-top:1px solid var(--line);margin-top:17px;padding-top:16px}
.prompt-label{font-size:12px;color:var(--sub);font-weight:750;margin:0 0 8px}
.words{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.word-choice{background:#f4f5f1;color:#4d544c;padding:7px 12px;border:1px solid #e5e8e1;border-radius:999px;min-height:39px;font-weight:700}
.word-choice[aria-pressed="true"]{background:var(--soft);border-color:#88a999;color:#355e50}
.empty{margin:10px 0 0;color:var(--sub);font-size:13px}
.q-progress{font-size:12px;font-weight:750;color:var(--accent)}
.q-title{font-size:21px;font-weight:750;line-height:1.45;margin:5px 0 19px}
.answers{display:grid;gap:8px}
.answer-choice{text-align:left;min-height:49px;padding:11px 15px;background:#fafbf8;border:1px solid var(--line);border-radius:13px;color:var(--text);font-weight:650}
.answer-choice[aria-pressed="true"]{background:var(--soft);border-color:#77a18e;color:#315e4b}
.entry{display:block;font-size:13px;color:var(--sub);font-weight:650;margin:8px 0 7px}
.text-answer{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 13px;min-height:48px;font-size:16px;background:#fff;color:var(--text)}
.nav{border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:22px;padding-top:15px}
.nav button{min-width:97px}
#previous{background:transparent;color:var(--sub)}
#next{background:var(--accent);color:#fff}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fact{background:#f7f8f5;border-radius:13px;padding:11px 13px;min-width:0}
.fact-label{display:block;color:var(--sub);font-size:12px;margin-bottom:3px}
.fact-value{display:block;font-size:16px;font-weight:750;overflow-wrap:anywhere}
.direction{padding:14px 0;text-align:center;color:var(--accent);font-size:16px;font-weight:750;overflow-wrap:anywhere}
.hint{background:var(--soft);border-radius:15px;padding:15px;margin-top:7px}
.hint-heading{font-size:13px;font-weight:750;color:#3d6956;margin:0 0 7px}
#hintText{font-size:16px;font-weight:650;line-height:1.7}
#glossText{font-size:14px;color:#4f6858;margin-top:10px}
.again{display:block;margin:16px 0 0 auto}
@media(max-width:540px){
 main{padding:17px 10px 36px}
 header{margin-bottom:13px}
 h1{font-size:22px}
 .sheet{padding:15px;border-radius:17px}
 .q-title{font-size:19px}
 .toolbar button{flex:1 1 auto}
 .summary-grid{gap:7px}
 .fact{padding:9px 11px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<header><h1>敬語訳アシスト</h1></header>
<section class="sheet" aria-label="本文と敬語の選択">
  <div class="section-top"><h2>本文</h2></div>
  <textarea id="passage" rows="3" spellcheck="false" aria-label="本文">中宮、女房に仰せ給ふ。</textarea>
  <div class="toolbar">
    <button class="primary" id="analyze" type="button">敬語を探す</button>
    <button class="secondary" id="add-selection" type="button">選択した語を使う</button>
  </div>
  <div id="candidateArea" hidden>
    <div class="prompt-label">考えたい敬語を選ぶ</div>
    <div class="words" id="candidates"></div>
    <p class="empty" id="noCandidates" hidden>見つからない場合は、本文中の語を選択してください。</p>
  </div>
</section>
<section class="sheet" id="wizard" aria-label="敬語についての質問" hidden>
  <div class="section-top"><span class="kicker" id="wordLabel"></span><span class="q-progress" id="stepCount"></span></div>
  <h2 class="q-title" id="question"></h2>
  <div class="answers" id="choices"></div>
  <div id="mainInput" hidden><label class="entry" id="mainLabel" for="answerInput"></label><input class="text-answer" id="answerInput" autocomplete="off"></div>
  <div id="subInputWrap" hidden><label class="entry" id="subLabel" for="subInput"></label><input class="text-answer" id="subInput" autocomplete="off"></div>
  <div class="nav"><button id="previous" type="button">戻る</button><button id="next" type="button">次へ →</button></div>
</section>
<section class="sheet" id="summary" aria-label="回答の整理結果" hidden>
  <div class="section-top"><h2>整理できたこと</h2><span class="kicker" id="resultWord"></span></div>
  <div class="summary-grid">
    <div class="fact"><span class="fact-label">場面</span><strong class="fact-value" id="resultScene"></strong></div>
    <div class="fact"><span class="fact-label">動作主</span><strong class="fact-value" id="resultAgent"></strong></div>
    <div class="fact"><span class="fact-label">用法</span><strong class="fact-value" id="resultKind"></strong></div>
    <div class="fact"><span class="fact-label">高める相手</span><strong class="fact-value" id="resultTarget"></strong></div>
  </div>
  <div class="direction" id="resultArrow"></div>
  <div class="hint"><p class="hint-heading">訳し方のヒント</p><p id="hintText"></p><p id="glossText" hidden></p></div>
  <button class="secondary again" id="editAnswers" type="button">答えを見直す</button>
</section>
</main>
<script type="module">
const REVIEW_STATUS = 'proposed';
const LEXEMES = [
  { id:'tamau', lemma:'給ふ', forms:['給ひ','給へ','給ふ','たまひ','たまへ','たまふ'], senses:[
    {id:'tamau-respect',kind:'respect',label:'四段活用の尊敬用法（候補）',gloss:'お〜になる／〜なさる',clue:'活用型と、前に置かれた語の接続を調べよう。',focus:'四段／下二段の識別'},
    {id:'tamau-humble-special',kind:'humble-special',label:'下二段活用の特殊な謙譲用法（候補）',gloss:'文脈から検討する',clue:'活用型、発話者、誰に向けてへりくだる表現かを調べよう。',focus:'通常の謙譲「動作の相手を高める」と同一視しない'}
  ]},
  { id:'tatematsuru', lemma:'奉る', forms:['奉り','奉る','たてまつり','たてまつる'], senses:[
    {id:'tatematsuru-humble',kind:'humble',label:'謙譲用法（候補）',gloss:'差し上げる／お〜申し上げる',clue:'受け取る人、動作の受益者、本動詞か補助動詞かを考えよう。',focus:'本動詞・補助動詞'},
    {id:'tatematsuru-respect',kind:'respect',label:'尊敬用法（候補）',gloss:'お召しになる／召し上がる など',clue:'何をする動作なのか。衣服・食事などの目的語を確認しよう。',focus:'目的語と多義性'}
  ]},
  { id:'mairu', lemma:'参る', forms:['参り','参る','まゐり','まゐる'], senses:[
    {id:'mairu-humble-move',kind:'humble',label:'謙譲・移動（候補）',gloss:'参上する',clue:'行き先はどこか。そこに誰がいるか。',focus:'行き先と敬意対象'},
    {id:'mairu-other',kind:'unknown',label:'その他の用法（要文脈）',gloss:'文脈による',clue:'移動・授受など、動作自体の意味を文脈から確かめよう。',focus:'意味の多義性'}
  ]},
  { id:'mesu', lemma:'召す', forms:['召し','召す'], senses:[
    {id:'mesu-respect',kind:'respect',label:'尊敬用法（候補）',gloss:'お呼びになる／召し上がる／お召しになる など',clue:'目的語に何が置かれているかを調べよう。',focus:'目的語と訳語の使い分け'}
  ]},
  { id:'haberu', lemma:'侍り', forms:['侍り','侍る','はべり','はべる'], senses:[
    {id:'haberu-polite',kind:'polite',label:'丁寧用法（候補）',gloss:'おります／ございます',clue:'聞き手へ丁寧に存在・状態を述べているか。',focus:'存在と丁寧'},
    {id:'haberu-humble',kind:'humble',label:'謙譲・奉仕の用法（候補）',gloss:'お仕えする',clue:'誰かに仕えている場面か、単なる存在の説明か。',focus:'奉仕／存在'}
  ]},
  { id:'sourau', lemma:'候ふ', forms:['候ひ','候ふ','さうらひ','さうらふ'], senses:[
    {id:'sourau-polite',kind:'polite',label:'丁寧用法（候補）',gloss:'おります／ございます',clue:'誰に丁寧に話しているのかを確認しよう。',focus:'発話相手'},
    {id:'sourau-humble',kind:'humble',label:'謙譲・奉仕の用法（候補）',gloss:'お仕えする',clue:'仕える対象の有無を調べよう。',focus:'奉仕の相手'}
  ]},
  { id:'kikoyu', lemma:'聞こゆ', forms:['聞こえ','聞こゆ','きこえ','きこゆ'], senses:[
    {id:'kikoyu-humble',kind:'humble',label:'謙譲用法（候補）',gloss:'申し上げる',clue:'誰に発話・伝達しているか。',focus:'発話の相手'},
    {id:'kikoyu-non',kind:'nonhonorific',label:'非敬語用法（候補）',gloss:'聞こえる／評判になる',clue:'音声が聞こえる意味ではないか。',focus:'非敬語との識別'}
  ]},
  { id:'kikoe-sasu', lemma:'聞こえさす', forms:['聞こえさせ','聞こえさす','きこえさせ','きこえさす'], senses:[
    {id:'kikoe-sasu-humble',kind:'humble',label:'謙譲用法（候補）',gloss:'申し上げる',clue:'発話・伝達の相手を確認しよう。',focus:'発話の相手'}
  ]},
  { id:'mousu', lemma:'申す', forms:['申し','申す','まうし','まうす'], senses:[
    {id:'mousu-humble',kind:'humble',label:'謙譲用法（候補）',gloss:'申し上げる',clue:'誰に何を伝えるのか。',focus:'伝達の相手'}
  ]},
  { id:'sousu', lemma:'奏す', forms:['奏し','奏す'], senses:[
    {id:'sousu-humble',kind:'humble',label:'謙譲用法（候補）',gloss:'天皇に申し上げる',clue:'発話の相手とその身分を確認しよう。',focus:'奏上の相手'}
  ]},
  { id:'keisu', lemma:'啓す', forms:['啓し','啓す'], senses:[
    {id:'keisu-humble',kind:'humble',label:'謙譲用法（候補）',gloss:'中宮などに申し上げる',clue:'発話の相手とその身分を確認しよう。',focus:'啓上の相手'}
  ]},
  { id:'oosu', lemma:'仰す', forms:['仰せ','仰す','おほせ','おほす'], senses:[
    {id:'oosu-respect',kind:'respect',label:'尊敬用法（候補）',gloss:'おっしゃる',clue:'言葉を発している動作主は誰か。',focus:'話す人'}
  ]},
  { id:'goran', lemma:'御覧ず', forms:['御覧じ','御覧ず','ごらんじ','ごらんず'], senses:[
    {id:'goran-respect',kind:'respect',label:'尊敬用法（候補）',gloss:'ご覧になる',clue:'見ているのは誰か。',focus:'見る人'}
  ]},
  { id:'oboshimesu', lemma:'思し召す', forms:['思し召し','思し召す','おぼしめし','おぼしめす'], senses:[
    {id:'oboshimesu-respect',kind:'respect',label:'尊敬用法（候補）',gloss:'お思いになる',clue:'考え・感情を抱いているのは誰か。',focus:'思う人'}
  ]},
  { id:'tamawaru', lemma:'賜る／給はる', forms:['賜り','賜る','給はり','給はる','たまはり','たまはる'], senses:[
    {id:'tamawaru-humble',kind:'humble',label:'謙譲用法（候補）',gloss:'いただく',clue:'誰から何を受け取っているか。',focus:'授受の相手'},
    {id:'tamawaru-respect',kind:'respect',label:'尊敬用法など（要確認）',gloss:'文脈による',clue:'誰の動作で、どの意味で使われているか。',focus:'授受と意味の識別'}
  ]}
];

const LEXEME_BY_ID = Object.fromEntries(LEXEMES.map(x=>[x.id,x]));
const SENSE_BY_ID = Object.fromEntries(LEXEMES.flatMap(x=>x.senses.map(s=>[s.id,s])));



/** Returns candidates, never certainties. Offsets use JavaScript UTF-16 indices. */
function detectCandidates(input) {
  const text=String(input ?? '');
  const raw=[];
  for (const lexeme of LEXEMES) {
    for (const form of lexeme.forms) {
      let start=text.indexOf(form);
      while (start!==-1) {
        raw.push({start,end:start+form.length,form,lexemeId:lexeme.id,manual:false});
        start=text.indexOf(form,start+Math.max(1,form.length));
      }
    }
  }
  // Longest first at a given offset, prevent shorter contained forms from masking longer ones.
  raw.sort((a,b)=>a.start-b.start || (b.end-b.start)-(a.end-a.start) || a.lexemeId.localeCompare(b.lexemeId));
  const out=[];
  for (const item of raw) {
    if (!out.some(prev=>item.start<prev.end && prev.start<item.end)) out.push(item);
  }
  return out.map((item,i)=>({...item,id:`auto-${item.start}-${item.end}-${item.lexemeId}-${i}`}));
}

function addManualCandidate(items, text, start, end) {
  if (!Number.isInteger(start)||!Number.isInteger(end)||start<0||end>text.length||start>=end) return items;
  if (items.some(x=>start<x.end && x.start<end)) return items; // no double-count or overwrite
  const proposed={id:`manual-${start}-${end}`,start,end,form:text.slice(start,end),lexemeId:null,manual:true};
  return [...items,proposed].sort((a,b)=>a.start-b.start);
}

function availableSenses(occurrence) {
  return occurrence?.lexemeId ? LEXEME_BY_ID[occurrence.lexemeId]?.senses ?? [] : [];
}

const trim=v=>String(v ?? '').trim();
/**
 * All arrows are learner hypotheses. Never outputs a 'correct' judgement.
 * Context: {layer, speaker, listener}. Per occurrence: {agent, counterpart, beneficiary, senseId, manualKind}
 */
function deriveHypothesis(occurrence, context={}, response={}) {
  const sense=SENSE_BY_ID[response.senseId] ?? null;
  const kind=sense?.kind ?? (occurrence.manual ? response.manualKind || 'unknown':'unknown');
  const layer=context.layer ?? 'unknown';
  const source=(layer==='narration' ? '語り手' : layer==='letter' ? trim(context.speaker)||'書き手（未特定）' :
    (layer==='dialogue'||layer==='quotation') ? trim(context.speaker)||'話し手（未特定）' : '敬意を示す側（未特定）');
  let target='未確定';
  let note='用法と人物関係を確認してから方向を考えましょう。';
  const missing=[];
  if (layer==='unknown') missing.push('地の文か会話文か');
  if ((layer==='dialogue'||layer==='quotation')&&!trim(context.speaker)) missing.push('話し手');
  if (kind==='respect') {
    target=trim(response.agent)||'動作主（未特定）';
    note='尊敬語という仮説なら、原則として動作主を高める。';
    if (!trim(response.agent)) missing.push('動作主');
  } else if (kind==='humble') {
    target=trim(response.counterpart)||trim(response.beneficiary)||'動作の相手・受益者など（未特定）';
    note='謙譲語という仮説なら、受け手・行き先・受益者などを確かめる。動作の相手と敬意対象は同一と断定しない。';
    if (!trim(response.counterpart)&&!trim(response.beneficiary)) missing.push('動作の相手・受益者・行き先');
  } else if (kind==='humble-special') {
    target='用法・聞き手を確認（自動確定しない）';
    note='下二段「給ふ」の特殊な謙譲用法候補。通常の謙譲語の矢印を当てはめず、活用と話者・聞き手を検討する。';
    missing.push('活用型と話者・聞き手');
  } else if (kind==='polite') {
    target=trim(context.listener)||'聞き手／読み手（未特定）';
    note='丁寧語は話し手から聞き手への配慮として扱う。尊敬・謙譲の対象図と分ける。';
    if (!trim(context.listener)) missing.push('聞き手');
  } else if (kind==='nonhonorific') {
    target='敬意の矢印なし';
    note='非敬語用法という仮説です。敬意を表さない可能性を残します。';
  } else {
    missing.push('敬語の用法');
  }
  return {source,target,kind,note,missing,sense,reviewStatus:'hypothesis-only'};
}

/** Suggest a small next step, not a quiz verdict. */
function nextQuestions(occurrence, context={}, response={}) {
  const rel=deriveHypothesis(occurrence,context,response);
  const prompts=[];
  if ((context.layer??'unknown')==='unknown') prompts.push('ここは地の文ですか、会話文ですか。前後の区切りも確認してみましょう。');
  if (['dialogue','quotation'].includes(context.layer)&&!trim(context.speaker)) prompts.push('この言葉を発しているのは誰でしょうか。');
  if (!trim(response.agent)) prompts.push('この動作をしているのは誰でしょうか。省略されている可能性もあります。');
  if (!rel.sense&&!occurrence.manual) prompts.push('候補の用法を比べる前に、活用・接続・動作内容の手掛かりを見てみましょう。');
  if (occurrence.manual&&(!response.manualKind||response.manualKind==='unknown')) prompts.push('辞書未登録の語です。手動で敬語の種類を仮置きするか、保留できます。');
  if (rel.kind==='humble'&&!trim(response.counterpart)&&!trim(response.beneficiary)) prompts.push('誰に対して、誰のために、どこへ向かっている動作でしょうか。');
  if (rel.kind==='humble-special') prompts.push('「給ふ」の活用型を確認し、一般の謙譲用法と区別しましょう。');
  if (rel.kind==='polite'&&!trim(context.listener)) prompts.push('誰に向けた発言かを確認しましょう。');
  if (rel.sense) prompts.push(rel.sense.clue);
  prompts.push('この人物関係だと、どのような現代語訳が自然になるでしょうか。');
  return [...new Set(prompts)].slice(0,4);
}

function labelForKind(kind) {
  return ({respect:'尊敬',humble:'謙譲',polite:'丁寧','humble-special':'特殊な謙譲',nonhonorific:'非敬語',unknown:'未確定'})[kind] || '未確定';
}





const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={passage:'',items:[],activeId:null,step:0,finished:false,context:{layer:'unknown',speaker:'',listener:''},answers:{}};
const picked=()=>state.items.find(x=>x.id===state.activeId)||null;
const currentAnswer=()=>state.answers[state.activeId]||{};
function useItem(id){
  if(!state.items.some(x=>x.id===id))return;
  state.activeId=id;state.step=0;state.finished=false;
  render();
}
function analyze(){
  state.passage=$('passage').value;
  state.items=detectCandidates(state.passage);
  state.activeId=state.items[0]?.id||null;
  state.answers={};state.context={layer:'unknown',speaker:'',listener:''};
  state.step=0;state.finished=false;
  render();
}
function addSelection(){
  const t=$('passage').value,start=$('passage').selectionStart,end=$('passage').selectionEnd;
  if(t!==state.passage)analyze();
  if(!Number.isInteger(start)||!Number.isInteger(end)||start===end){$('passage').focus();return;}
  const known=state.items.find(x=>start<x.end&&x.start<end);
  if(known){useItem(known.id);return;}
  const next=addManualCandidate(state.items,state.passage,start,end);
  if(next.length===state.items.length)return;
  state.items=next;
  useItem('manual-'+start+'-'+end);
}
function kindOf(){
  const a=currentAnswer();
  return SENSE_BY_ID[a.senseId]?.kind||(picked()?.manual?(a.manualKind||'unknown'):'unknown');
}
function steps(){
  const kind=kindOf();
  return ['scene','agent','sense',...(['humble','polite'].includes(kind)?['target']:[])];
}
function labelForItem(o){
  return o?.lexemeId?(LEXEME_BY_ID[o.lexemeId]?.lemma||o.form):o?.form||'';
}
function renderWords(){
  const has=state.passage.length>0;
  $('candidateArea').hidden=!has;
  if(!has)return;
  $('candidates').innerHTML=state.items.map((o,i)=>
    '<button type="button" class="word-choice" aria-pressed="'+(o.id===state.activeId)+'" data-id="'+esc(o.id)+'">'+
    (state.items.filter(x=>x.form===o.form).length>1?(i+1)+'. ':'')+esc(o.form)+'</button>'
  ).join('');
  $('noCandidates').hidden=state.items.length>0;
}
function choices(items,selected){
  $('choices').innerHTML=items.map(([value,label])=>'<button type="button" class="answer-choice" data-value="'+esc(value)+'" aria-pressed="'+(value===selected)+'">'+esc(label)+'</button>').join('');
}
function entry(wrapper,label,input,value,placeholder){
  $(wrapper).hidden=false;$(label).textContent=input==='subInput'?'誰の言葉？':'答え';
  if(input==='answerInput')$(label).textContent=label;
  $(input).value=value||'';$(input).placeholder=placeholder||'分からなければ空欄で進めます';
}
function renderStep(){
  const o=picked();if(!o)return;
  const seq=steps(),q=seq[state.step]||seq[0],a=currentAnswer();
  $('wordLabel').textContent='「'+o.form+'」';
  $('stepCount').textContent=(state.step+1)+' / '+seq.length;
  $('choices').innerHTML='';$('mainInput').hidden=true;$('subInputWrap').hidden=true;
  $('previous').disabled=state.step===0;
  $('previous').style.visibility=state.step===0?'hidden':'';
  $('next').textContent=state.step===seq.length-1?'整理する →':'次へ →';
  if(q==='scene'){
    $('question').textContent='この文は誰の言葉？';
    choices([['narration','地の文'],['dialogue','会話・引用'],['letter','手紙'],['unknown','まだ分からない']],state.context.layer);
    if(['dialogue','letter'].includes(state.context.layer)){
      $('subInputWrap').hidden=false;
      $('subLabel').textContent='話し手・書き手は？';
      $('subInput').value=state.context.speaker||'';
      $('subInput').placeholder='分からなければ空欄';
    }
  }else if(q==='agent'){
    $('question').textContent='この動作をしているのは誰？';
    $('mainInput').hidden=false;$('mainLabel').textContent='動作主';
    $('answerInput').value=a.agent||'';$('answerInput').placeholder='例：中宮（不明なら空欄）';
  }else if(q==='sense'){
    $('question').textContent='この敬語の働きは？';
    const senses=availableSenses(o);
    if(senses.length){
      const opts=[['','まだ決めない']].concat(senses.map(s=>[s.id,s.label.replace(/（候補）|（要文脈）|（要確認）/g,'')]));
      choices(opts,a.senseId||'');
    }else{
      choices([['unknown','まだ決めない'],['respect','尊敬'],['humble','謙譲'],['polite','丁寧'],['nonhonorific','敬語ではない']],a.manualKind||'unknown');
    }
  }else if(q==='target'){
    const polite=kindOf()==='polite';
    $('question').textContent=polite?'誰に向けた言葉？':'誰に対しての動作？';
    $('mainInput').hidden=false;$('mainLabel').textContent=polite?'聞き手':'相手・行き先';
    $('answerInput').value=polite?(state.context.listener||''):(a.counterpart||'');
    $('answerInput').placeholder='分からなければ空欄';
  }
}
function renderSummary(){
  const o=picked();if(!o)return;
  const a=currentAnswer(),r=deriveHypothesis(o,state.context,a),kind=r.kind;
  $('resultWord').textContent='「'+o.form+'」';
  $('resultScene').textContent=({narration:'地の文',dialogue:'会話・引用',letter:'手紙',unknown:'未確定'})[state.context.layer]||'未確定';
  $('resultAgent').textContent=a.agent?.trim()||'未確定';
  $('resultKind').textContent=labelForKind(kind);
  $('resultTarget').textContent=r.target;
  $('resultArrow').textContent=kind==='nonhonorific'?'敬意の方向：なし':r.source+' → '+r.target;
  let hint=r.sense?.clue||'前後の語と人物関係から、訳し方を考えましょう。';
  if(kind==='respect'&&!a.agent?.trim())hint='まず、この動作をした人物を確認しましょう。';
  if(kind==='humble'&&!a.counterpart?.trim())hint='動作の相手や行き先を本文から探しましょう。';
  if(kind==='polite'&&!state.context.listener?.trim())hint='誰に向けて話しているかを確認しましょう。';
  $('hintText').textContent=hint;
  const gloss=r.sense?.gloss||'';
  $('glossText').hidden=!gloss;
  $('glossText').textContent=gloss?'訳語の候補：'+gloss:'';
}
function render(){
  renderWords();
  const exists=!!picked();
  $('wizard').hidden=!exists||state.finished;
  $('summary').hidden=!exists||!state.finished;
  if(exists){if(state.finished)renderSummary();else renderStep();}
}
$('analyze').addEventListener('click',analyze);
$('add-selection').addEventListener('click',addSelection);
$('candidates').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)useItem(b.dataset.id);});
$('choices').addEventListener('click',e=>{
  const b=e.target.closest('button[data-value]');if(!b)return;
  const q=steps()[state.step],a=currentAnswer(),v=b.dataset.value;
  if(q==='scene'){state.context.layer=v;if(v==='narration'||v==='unknown')state.context.speaker='';}
  if(q==='sense'){if(picked().manual)a.manualKind=v;else a.senseId=v;state.answers[state.activeId]=a;}
  renderStep();
});
$('answerInput').addEventListener('input',e=>{
  const q=steps()[state.step],a=currentAnswer();
  if(q==='agent')a.agent=e.target.value;
  if(q==='target'){if(kindOf()==='polite')state.context.listener=e.target.value;else a.counterpart=e.target.value;}
  state.answers[state.activeId]=a;
});
$('subInput').addEventListener('input',e=>{state.context.speaker=e.target.value;});
$('previous').addEventListener('click',()=>{if(state.step>0){state.step--;render();}});
$('next').addEventListener('click',()=>{
  const seq=steps();
  if(state.step>=seq.length-1){state.finished=true;render();}
  else {state.step++;render();}
});
$('editAnswers').addEventListener('click',()=>{state.finished=false;state.step=0;render();});
window.addEventListener('message',event=>{
  if(event.source!==window.parent || event.origin!==window.location.origin)return;
  if(event.data?.type!=='keigo-assist:load')return;
  const p=event.data.payload;
  if(!p||typeof p.text!=='string'||p.text.length>10000)return;
  $('passage').value=p.text;analyze();
  if(typeof p.layer==='string')state.context.layer=['unknown','narration','dialogue','letter'].includes(p.layer)?p.layer:'unknown';
  if(typeof p.speaker==='string'&&p.speaker.length<=200)state.context.speaker=p.speaker;
  if(typeof p.listener==='string'&&p.listener.length<=200)state.context.listener=p.listener;
  if(Number.isInteger(p.selectedStart)&&Number.isInteger(p.selectedEnd)&&p.selectedStart>=0&&p.selectedEnd<=state.passage.length&&p.selectedStart<p.selectedEnd){
    const found=state.items.find(o=>p.selectedStart<o.end&&o.start<p.selectedEnd);
    if(found)state.activeId=found.id;
    else{
      const next=addManualCandidate(state.items,state.passage,p.selectedStart,p.selectedEnd);
      if(next.length>state.items.length){state.items=next;state.activeId='manual-'+p.selectedStart+'-'+p.selectedEnd;}
    }
  }
  render();
});
analyze();
</script>
</body></html>
