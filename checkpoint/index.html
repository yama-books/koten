<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>古文予習</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header>
    <h1>古文予習</h1>
  </header>

  <section class="card">
    <div class="label">本文</div>
    <textarea id="input">春はあけぼの。やうやう白くなりゆく山ぎは、すこしあかりて、紫だちたる雲のほそくたなびきたる。</textarea>
    <div class="level-control">
      <label for="checkLevel">見る範囲</label>
      <select id="checkLevel">
        <option value="1">厳選</option>
        <option value="2" selected>ふつう</option>
        <option value="4">細かく</option>
      </select>
    </div>
    <div class="row main-actions">
      <button class="primary" id="analyze">見る</button>
      <button class="ghost" id="clear">消す</button>
    </div>
    <details class="sample-picker">
      <summary>例文</summary>
      <div class="row sample-row">
        <button class="secondary" id="sample1">枕草子</button>
        <button class="secondary" id="sample2">和歌</button>
        <button class="secondary" id="sample3">識別</button>
        <button class="secondary" id="sample4">長文</button>
      </div>
    </details>
  </section>

  <section class="card" id="resultCard">
    <div class="label">ポイント</div>
    <div class="legend">
      <span><i class="demo-line"></i> 文法</span>
      <span><i class="demo-dotted"></i> 識別</span>
      <span><i class="demo-bg"></i> 語彙・表記</span>
      <span><i class="demo-honorific"></i> 敬語</span>
    </div>
    <div class="reading" id="reading"></div>
    <details id="shadowDebugPanel" hidden style="margin-top:12px">
      <summary>開発者用 shadow 監査</summary>
      <div class="status" id="shadowDebugSummary" style="margin-top:8px"></div>
      <pre id="shadowDebugDetails" style="white-space:pre-wrap;overflow:auto;max-height:360px;font-size:12px;line-height:1.5"></pre>
    </details>
  </section>

  <section class="card">
    <div class="label">チェック</div>
    <div class="list" id="checklist"></div>
    <div class="known-history" id="knownHistory" hidden>
      <div class="known-history-head">
        <div>
          <div class="label known-history-label">わかる</div>
          <div class="status known-history-status" id="knownHistoryStatus"></div>
        </div>
        <button class="ghost known-restore-all" id="restoreAllKnown" type="button">全部戻す</button>
      </div>
      <div class="known-list" id="knownList" aria-live="polite"></div>
    </div>
  </section>

</div>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-inner">
    <div class="drawer-head">
      <div>
        <h3 id="drawerWord">語</h3>
        <div class="category" id="drawerCategory"></div>
      </div>
      <button class="close" id="closeDrawer" aria-label="閉じる">×</button>
    </div>

    <div class="focus-overview" id="focusOverview"></div>

    <section class="focus-card">
      <div class="focus-meta" id="focusMeta"></div>
      <div class="focus-question" id="focusQuestion"></div>

      <button class="primary focus-main-action" id="focusMainAction" type="button"></button>

      <div class="focus-guidance" id="focusGuidance"></div>
      <div class="focus-tools" id="focusTools"></div>
      <div class="focus-extra" id="focusExtra"></div>
    </section>

    <div class="focus-footer">
      <button class="known-btn" id="markPointKnown" type="button">✓ わかる</button>
    </div>
  </div>
</div>

<script src="core1.js"></script>
<script src="core2.js"></script>
<script src="core3.js"></script>
<script src="core4.js"></script>
<script src="db-shadow.js"></script>
<script src="detect1.js"></script>
<script src="detect2.js"></script>
<script src="detect3.js"></script>
<script src="ui1.js"></script>
<script src="ui2.js"></script>
<script src="ui3.js"></script>
<script src="events.js"></script></body>
</html>
