name: Checkpoint Public Beta Smoke

on:
  push:
    branches: [checkpoint-main]
    paths:
      - "checkpoint/*.js"
      - "checkpoint/index.html"
      - "checkpoint/styles.css"
      - "checkpoint/data/**"
      - "tests/unit/checkpoint-public-beta.test.mjs"
      - "tests/checkpoint-public-beta-browser.smoke.mjs"
      - ".github/workflows/checkpoint-public-beta.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-public-beta
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Checkpoint DOM and mobile contract smoke
        run: node --test tests/unit/checkpoint-public-beta.test.mjs
      - name: Install WebKit for mobile browser smoke
        run: npx playwright install --with-deps webkit
      - name: Checkpoint WebKit mobile browser smoke
        run: node tests/checkpoint-public-beta-browser.smoke.mjs
