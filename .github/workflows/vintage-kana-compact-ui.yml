name: vintage-kana compact UI cache
on:
  push:
    paths:
      - '.github/workflows/vintage-kana-compact-ui.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact observed hentaigana cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("vintage-kana/data")
          files=["glyph-distribution.json","glyph-distribution-part2.json","glyph-distribution-supplemental.json"]
          agg={}
          for name in files:
              p=base/name
              if not p.exists(): continue
              data=json.loads(p.read_text(encoding="utf-8"))
              rows=data.get("distributions",data.get("records",[]))
              for r in rows:
                  if r.get("diacritic")!="none": continue
                  gid=str(r.get("glyph_id",""))
                  if not gid.startswith("U+1B"): continue
                  key=(r.get("kana"),gid)
                  x=agg.setdefault(key,{
                      "kana":r.get("kana"),"glyph_id":gid,"character":r.get("character"),
                      "jibo":r.get("jibo"),"totalObserved":0,"witnesses":set()
                  })
                  x["totalObserved"]+=int(r.get("count") or 0)
                  if r.get("source_witness"): x["witnesses"].add(r["source_witness"])
          order={k:i for i,k in enumerate("あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわゐゑをん")}
          rows=[]
          for x in agg.values():
              rows.append({
                  "kana":x["kana"],"glyph_id":x["glyph_id"],"character":x["character"],"jibo":x["jibo"],
                  "totalObserved":x["totalObserved"],"witnessCount":len(x["witnesses"])
              })
          rows.sort(key=lambda r:(order.get(r["kana"],999),r["glyph_id"]))
          out={
              "schemaVersion":2,
              "status":"derived-ui-cache-from-phase1",
              "description":"初期15資料のPhase 1分布から、無濁点のU+1B***変体仮名だけをUI用に重複除去・集計した派生キャッシュ。正本はglyph-distribution*.json。",
              "sourceFiles":files,
              "glyphCount":len(rows),
              "kanaCount":len(set(r["kana"] for r in rows)),
              "glyphs":rows
          }
          (base/"ui-glyph-master.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"glyphCount":out["glyphCount"],"kanaCount":out["kanaCount"]}))
          PY
      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vintage-kana/data/ui-glyph-master.json
          git commit -m "vintage-kana: refresh compact UI glyph cache"
          git push
