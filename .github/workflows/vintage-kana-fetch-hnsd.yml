name: vintage-kana temporary NINJAL text fetch

on:
  push:
    paths:
      - '.github/workflows/vintage-kana-fetch-hnsd.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and normalize official NINJAL transcription
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path

          url = "https://www2.ninjal.ac.jp/textdb_dataset/hnsd/txt/hnsd-001.txt"
          raw = urlopen(url, timeout=30).read()
          text = None
          used = None
          for enc in ("utf-8-sig", "cp932", "shift_jis", "euc_jp"):
              try:
                  text = raw.decode(enc)
                  used = enc
                  break
              except UnicodeDecodeError:
                  pass
          if text is None:
              raise SystemExit("Could not decode transcription")
          text = text.replace("\r\n", "\n").replace("\r", "\n")
          out = Path("vintage-kana/tmp/hnsd-001.utf8.txt")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text, encoding="utf-8")
          manifest_url = "https://dglb01.ninjal.ac.jp/ninjaldl/hananosimadai/001/manifest.json"
          manifest_raw = urlopen(manifest_url, timeout=30).read()
          Path("vintage-kana/tmp/hnsd-001.manifest.json").write_bytes(manifest_raw)
          Path("vintage-kana/tmp/hnsd-001.fetch-meta.txt").write_text(
              f"source={url}\ndecoding={used}\nbytes={len(raw)}\nchars={len(text)}\n",
              encoding="utf-8"
          )
          PY
      - name: Commit temporary bridge output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vintage-kana/tmp/hnsd-001.utf8.txt vintage-kana/tmp/hnsd-001.fetch-meta.txt vintage-kana/tmp/hnsd-001.manifest.json
          git commit -m "chore(vintage-kana): temporary NINJAL transcript bridge"
          git push
